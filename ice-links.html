<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイス🍦 外の棚</title>
<meta name="description" content="YouTube と Spotify は外の棚。リストのURLもここで再生。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="アイス🍦">
<meta property="og:url" content="https://clog-grok.github.io/ice-links.html">
<meta property="og:title" content="アイス🍦 外の棚">
<meta property="og:description" content="YouTube と Spotify は外の棚。リストのURLもここで再生。">
<meta property="og:image" content="https://clog-grok.github.io/ice-og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="アイス🍦 外の棚">
<meta name="twitter:description" content="YouTube と Spotify は外の棚。リストのURLもここで再生。">
<meta name="twitter:image" content="https://clog-grok.github.io/ice-og.jpg">
<link rel="canonical" href="https://clog-grok.github.io/ice-links.html">
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --ice:#9ecbff; --cream:#e8eef7; --dim:#8b9bb4; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; background:radial-gradient(1200px 600px at 50% -8%, #1b2838 0%, var(--bg) 55%); color:var(--cream); }
  main { max-width:440px; margin:0 auto; padding:24px 16px 56px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; line-height:1.55; margin:0 0 16px; }
  .jumps { display:flex; gap:8px; margin:0 0 16px; }
  .jumps a { flex:1; text-align:center; text-decoration:none; border:1px solid var(--line); background:#11161d; color:var(--ice); border-radius:12px; padding:11px 8px; font-size:13px; }
  .addbox { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:12px; margin:0 0 12px; }
  .field { position:relative; margin:0 0 8px; }
  .field input { width:100%; padding:10px 40px 10px 10px; border-radius:8px; border:1px solid var(--line); background:#11161d; color:var(--cream); font-size:14px; }
  .field .wipe { position:absolute; right:4px; top:4px; width:32px; height:32px; border:0; background:transparent; color:var(--dim); font-size:18px; }
  .addbox > button { width:100%; padding:10px; border-radius:8px; border:1px solid var(--ice); background:#162436; color:var(--ice); font-size:14px; }
  .row { display:flex; gap:8px; align-items:stretch; margin:0 0 8px; }
  a.seat { flex:1; text-align:left; background:#11161d; color:var(--cream); border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:14px; text-decoration:none; }
  a.seat small { display:block; color:var(--dim); font-size:11px; margin-top:3px; }
  .icon { width:40px; border:1px solid var(--line); background:#11161d; color:var(--cream); border-radius:12px; font-size:16px; }
  .note { font-size:12px; color:var(--dim); line-height:1.65; margin-top:16px; }
  a { color:var(--ice); }
  .empty { color:var(--dim); font-size:13px; padding:8px 2px; }
  .embed { width:100%; border:0; border-radius:12px; margin:0 0 14px; background:#11161d; }
</style>
</head>
<body>
<main>
  <h1>アイス🍦 外の棚</h1>
  <p class="sub">曲でもリストでも、共有URLを置く。Spotifyのリストはこのページで再生できる。</p>
  <div class="jumps">
    <a href="https://music.youtube.com/" target="_blank" rel="noopener">YouTube Music</a>
    <a href="https://open.spotify.com/" target="_blank" rel="noopener">Spotify</a>
  </div>
  <div class="addbox">
    <div class="field"><input id="extTitle" placeholder="名前（空でも可）"><button type="button" class="wipe" data-for="extTitle">×</button></div>
    <div class="field"><input id="extUrl" placeholder="曲またはリストのURL"><button type="button" class="wipe" data-for="extUrl">×</button></div>
    <button type="button" id="extAdd">棚に追加</button>
  </div>
  <div id="list"></div>
  <p class="note"><a href="ice-jukebox.html">席へ戻る</a></p>
</main>
<script>
const KEY = "ice-out-v1";
let outs = [];
try { outs = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { outs = []; }

function isFile(url){
  if (!url) return false;
  const u = url.toLowerCase();
  if (/youtube\.com|youtu\.be|spotify\.com|spotify\.link|music\.apple/.test(u)) return false;
  return /\.(mp3|ogg|wav|m4a|aac)(\?|#|$)/.test(u) || /archive\.org\/download\//.test(u);
}

function parseSpotify(url){
  if (!url) return null;
  const u = url.trim();
  const web = u.match(/open\.spotify\.com\/(?:intl-[a-z]{2}\/)?(playlist|track|album|artist|episode|show)\/([a-zA-Z0-9]+)/i);
  if (web) return { type: web[1].toLowerCase(), id: web[2] };
  const uri = u.match(/^spotify:(playlist|track|album|artist|episode|show):([a-zA-Z0-9]+)/i);
  if (uri) return { type: uri[1].toLowerCase(), id: uri[2] };
  return null;
}

const KIND = { playlist:"リスト", track:"曲", album:"アルバム", artist:"アーティスト", episode:"エピソード", show:"番組" };

function outHref(url){
  const s = parseSpotify(url);
  if (s) return "https://open.spotify.com/" + s.type + "/" + s.id;
  const ylist = url.match(/[?&]list=([a-zA-Z0-9_-]+)/);
  const yvid = url.match(/(?:youtu\.be\/|(?:music\.)?youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (ylist && !yvid) return "https://www.youtube.com/playlist?list=" + ylist[1];
  if (yvid) return "https://www.youtube.com/watch?v=" + yvid[1] + (ylist ? "&list=" + ylist[1] : "");
  return url;
}

function embedSrc(url){
  const s = parseSpotify(url);
  if (s) return "https://open.spotify.com/embed/" + s.type + "/" + s.id + "?utm_source=generator&theme=0";
  return null;
}

function defaultTitle(url){
  const s = parseSpotify(url);
  if (s) return "Spotify " + (KIND[s.type] || s.type);
  if (/[?&]list=/.test(url) && /youtube\.com|youtu\.be/.test(url)) return "YouTube リスト";
  return "外の曲";
}

function save(){ try { localStorage.setItem(KEY, JSON.stringify(outs)); } catch(e) {} }

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (!outs.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "曲でもリストでも、共有URLを貼る。";
    list.appendChild(p);
    return;
  }
  outs.forEach((t, i) => {
    const wrap = document.createElement("div");
    wrap.className = "row";
    const a = document.createElement("a");
    a.className = "seat";
    a.href = outHref(t[1]);
    a.target = "_blank";
    a.rel = "noopener";
    const s = parseSpotify(t[1]);
    const kind = s ? (KIND[s.type] || s.type) : "外へ飛ぶ";
    a.innerHTML = (i+1) + ". " + t[0] + "<small>" + kind + "</small>";
    const up = document.createElement("button");
    up.className = "icon"; up.textContent = "↑";
    up.onclick = () => { if (i===0) return; [outs[i-1], outs[i]] = [outs[i], outs[i-1]]; save(); render(); };
    const down = document.createElement("button");
    down.className = "icon"; down.textContent = "↓";
    down.onclick = () => { if (i===outs.length-1) return; [outs[i+1], outs[i]] = [outs[i], outs[i+1]]; save(); render(); };
    const del = document.createElement("button");
    del.className = "icon"; del.textContent = "×";
    del.onclick = () => { outs.splice(i,1); save(); render(); };
    wrap.append(a, up, down, del);
    list.appendChild(wrap);
    const src = embedSrc(t[1]);
    if (src) {
      const frame = document.createElement("iframe");
      frame.className = "embed";
      frame.src = src;
      frame.height = (s && (s.type === "playlist" || s.type === "album" || s.type === "artist")) ? "352" : "152";
      frame.setAttribute("allow", "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture");
      frame.loading = "lazy";
      list.appendChild(frame);
    }
  });
}

document.querySelectorAll(".wipe").forEach(b => {
  b.onclick = () => { document.getElementById(b.dataset.for).value = ""; };
});
document.getElementById("extAdd").onclick = () => {
  const titleEl = document.getElementById("extTitle");
  const urlEl = document.getElementById("extUrl");
  const url = (urlEl.value || "").trim();
  if (!url) return;
  if (isFile(url)) {
    urlEl.value = "";
    titleEl.placeholder = "席の曲は音の席へ";
    return;
  }
  const title = (titleEl.value || "").trim() || defaultTitle(url);
  outs.push([title, url]);
  save();
  titleEl.value = "";
  urlEl.value = "";
  render();
};
render();
</script>
</body>
</html>
