<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>試作 | clog-grok</title>
  <meta name="description" content="未完成のツール。本番の一覧には出しません。">
  <meta name="theme-color" content="#111111">
  <meta name="robots" content="noindex">
  <style>
    :root {
      --bg: #111;
      --card: #1c1c1e;
      --line: #2c2c2e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --warn: #ffb86b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
    }
    main { max-width: 420px; margin: 0 auto; }
    .kicker { font-size: 0.72rem; letter-spacing: 0.12em; color: var(--warn); margin: 0 0 6px; }
    h1 { font-size: 1.55rem; margin: 0 0 8px; }
    .lead { margin: 0 0 22px; color: var(--muted); font-size: 0.92rem; line-height: 1.55; }
    .list { display: grid; gap: 12px; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid #3a2e1c;
      border-radius: 16px; padding: 16px 16px 14px;
    }
    .tag {
      display: inline-block; font-size: 0.68rem; padding: 3px 8px;
      border-radius: 999px; margin-bottom: 8px; font-weight: 600;
      background: #3a2e1c; color: var(--warn);
    }
    .name { font-size: 1.12rem; font-weight: 700; margin: 0 0 6px; }
    .desc { margin: 0; color: var(--muted); font-size: 0.86rem; line-height: 1.5; }
    .go { margin-top: 12px; font-size: 0.82rem; color: #fff; }
    .status { color: var(--muted); font-size: 0.86rem; }
    footer { margin-top: 28px; color: #636366; font-size: 0.72rem; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">WIP</p>
    <h1>試作</h1>
    <p class="lead">未完成です。本番の一覧には出ません。数字も仮です。</p>
    <p class="lead" style="margin-top:-12px"><a href="./" style="color:var(--warn);text-decoration:none">本番ツールはこちら →</a></p>
    <div class="list" id="list"><p class="status">読み込み中…</p></div>
    <footer>公開へ出すときは、そのHTMLから tool-status を外す。</footer>
  </main>
  <script>
  (function () {
    const REPO = "https://api.github.com/repos/clog-grok/clog-grok.github.io/contents/?ref=main";
    const list = document.getElementById("list");
    const skip = { "index.html": true, "wip.html": true, "mansion-kojihi-preview.html": true };

    function text(html, re) {
      const m = html.match(re);
      return m ? m[1].replace(/\s+/g, " ").trim() : "";
    }

    function isWip(item) {
      const st = (item.status || "").toLowerCase();
      return st === "wip" || st === "draft" || /^wip-/i.test(item.file);
    }

    function card(item) {
      const a = document.createElement("a");
      a.className = "card";
      a.href = "./" + item.file;
      a.innerHTML =
        '<span class="tag"></span>' +
        '<p class="name"></p><p class="desc"></p><p class="go">開く →</p>';
      a.querySelector(".tag").textContent = "試作";
      a.querySelector(".name").textContent = item.name;
      a.querySelector(".desc").textContent = item.desc || item.file;
      return a;
    }

    function fail(msg) {
      list.innerHTML = "";
      const p = document.createElement("p");
      p.className = "status";
      p.textContent = msg;
      list.appendChild(p);
    }

    function meta(f) {
      return fetch("./" + f.name).then(function (r) { return r.ok ? r.text() : ""; }).then(function (html) {
        return {
          file: f.name,
          name: text(html, /<title>([^<]+)<\/title>/i) || f.name.replace(/\.html$/i, ""),
          desc: text(html, /<meta\s+name=["']description["']\s+content=["']([^"']+)["']/i),
          status: text(html, /<meta\s+name=["']tool-status["']\s+content=["']([^"']+)["']/i)
        };
      });
    }

    fetch(REPO, { headers: { Accept: "application/vnd.github+json" } })
      .then(function (res) {
        if (!res.ok) throw new Error("list " + res.status);
        return res.json();
      })
      .then(function (files) {
        const htmls = files.filter(function (f) {
          return f.type === "file" && /\.html$/i.test(f.name) && !skip[f.name];
        }).sort(function (a, b) { return a.name.localeCompare(b.name); });
        return Promise.all(htmls.map(meta)).then(function (items) {
          const wip = items.filter(isWip);
          list.innerHTML = "";
          if (!wip.length) {
            fail("試作は今ありません。");
            return;
          }
          wip.forEach(function (item) { list.appendChild(card(item)); });
        });
      })
      .catch(function () {
        fail("一覧を取れませんでした。少し待って再読み込みしてください。");
      });
  })();
  </script>
</body>
</html>
