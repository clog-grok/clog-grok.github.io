<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="用途地域別の採光補正係数と有効採光面積を計算します。数値の直接入力とスライダーが連動します。">
<meta name="tool-tag" content="法規">
<title>採光補正係数シミュレーター</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .app-container {
    background: #16213e;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    width: 100%;
    max-width: 500px;
  }
  h1 { margin: 0 0 15px 0; color: #e94560; text-align: center; font-size: 1.4em; }
  .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
  .tab {
    flex: 1; text-align: center; padding: 10px; background: #0f3460;
    cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.2s;
  }
  .tab.active { background: #e94560; color: #fff; }
  .control-group { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .control-row label { font-size: 0.9em; font-weight: bold; color: #fff; }
  .input-wrapper { display: flex; align-items: baseline; }
  .input-wrapper span { font-weight: bold; color: #4ecca3; font-size: 1.1em; margin-left: 3px; }
  input[type=number] {
    background: transparent;
    border: none;
    border-bottom: 1px dashed #4ecca3;
    color: #4ecca3;
    font-size: 1.2em;
    font-weight: bold;
    width: 60px;
    text-align: right;
    outline: none;
    padding: 2px;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  select {
    width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px;
    background: #0b132b; color: #4ecca3; border: 1px solid #4ecca3;
    border-radius: 6px; font-size: 0.95em; font-weight: bold; outline: none;
    cursor: pointer;
  }
  input[type=range] { width: 100%; accent-color: #4ecca3; margin-bottom: 15px; }
  .result-area { background: #0b132b; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #4ecca3; }
  .formula-display { font-family: monospace; color: #a0a0a0; margin-bottom: 10px; font-size: 0.9em; }
  .factor-display { font-size: 2.2em; font-weight: bold; color: #e94560; margin: 10px 0; }
  .judgement { display: flex; justify-content: space-around; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #333; }
  .judgement div { text-align: center; width: 45%; }
  .judgement div span { display: block; font-size: 1.2em; font-weight: bold; color: #fff; margin-top: 5px; }
  .status { font-size: 1.3em; font-weight: bold; margin-top: 15px; padding: 10px; border-radius: 6px; }
  .status.ok { color: #4ecca3; background: rgba(78, 204, 163, 0.1); }
  .status.ng { color: #e94560; background: rgba(233, 69, 96, 0.1); }
  .status.none { color: #f1c40f; background: rgba(241, 196, 15, 0.1); }
  .visualizer {
    position: relative; height: 180px; background: #87CEEB;
    border-radius: 8px; margin-top: 20px; overflow: hidden; border: 2px solid #333;
  }
  .building { position: absolute; bottom: 20px; left: 0; width: 80px; background: #555; border-right: 2px solid #222; transition: 0.1s ease-out; }
  .window { position: absolute; right: 0; background: #fff; width: 10px; border-radius: 2px 0 0 2px; }
  .boundary { position: absolute; bottom: 20px; width: 4px; height: 160px; background: #e94560; transition: 0.1s ease-out; }
  .ground { position: absolute; bottom: 0; width: 100%; height: 20px; background: #654321; }
  .dim-h { position: absolute; left: 85px; width: 2px; background: #333; transition: 0.1s ease-out; }
  .dim-h::before, .dim-h::after { content: ''; position: absolute; left: -4px; width: 10px; height: 2px; background: #333; }
  .dim-h::before { top: 0; }
  .dim-h::after { bottom: 0; }
  .dim-d { position: absolute; height: 2px; background: #333; transition: 0.1s ease-out; }
  .dim-d::before, .dim-d::after { content: ''; position: absolute; top: -4px; width: 2px; height: 10px; background: #333; }
  .dim-d::before { left: 0; }
  .dim-d::after { right: 0; }
</style>
</head>
<body>
<div class="app-container">
  <h1>☀️ 採光補正係数 シミュレーター</h1>
  <div class="tabs">
    <div class="tab active" onclick="setZone('residential')" id="tab-residential">住居系</div>
    <div class="tab" onclick="setZone('commercial')" id="tab-commercial">商業系</div>
    <div class="tab" onclick="setZone('industrial')" id="tab-industrial">工業系</div>
  </div>
  <div class="control-group">
    <div class="control-row">
      <label>🏢 居室の用途 (法第28条・令14条の2)</label>
    </div>
    <select id="usage-select" onchange="calculate()">
      <option value="1/7">住宅の居室・病院の病室など (床面積の 1/7)</option>
      <option value="1/5">小中高の教室・保育室など (床面積の 1/5)</option>
      <option value="1/10">大学・専修学校の教室など (床面積の 1/10)</option>
      <option value="0">事務所・店舗・工場など (採光義務なし)</option>
    </select>
    <div class="control-row">
      <label>水平距離 D (隣地境界まで)</label>
      <div class="input-wrapper">
        <input type="number" id="num-d" min="0.5" max="10.0" step="0.1" value="3.0" oninput="sync('d', 'num')">
        <span>m</span>
      </div>
    </div>
    <input type="range" id="slider-d" min="0.5" max="10.0" step="0.1" value="3.0" oninput="sync('d', 'slider')">
    <div class="control-row">
      <label>垂直距離 H (直上のパラペット等まで)</label>
      <div class="input-wrapper">
        <input type="number" id="num-h" min="1.0" max="10.0" step="0.1" value="2.0" oninput="sync('h', 'num')">
        <span>m</span>
      </div>
    </div>
    <input type="range" id="slider-h" min="1.0" max="10.0" step="0.1" value="2.0" oninput="sync('h', 'slider')">
    <div class="control-row">
      <label>部屋の床面積</label>
      <div class="input-wrapper">
        <input type="number" id="num-floor" min="5.0" max="40.0" step="1.0" value="14.0" oninput="sync('floor', 'num')">
        <span>㎡</span>
      </div>
    </div>
    <input type="range" id="slider-floor" min="5.0" max="40.0" step="1.0" value="14.0" oninput="sync('floor', 'slider')">
    <div class="control-row">
      <label>実際の窓面積 (開口部)</label>
      <div class="input-wrapper">
        <input type="number" id="num-win" min="0.0" max="10.0" step="0.1" value="1.5" oninput="sync('win', 'num')">
        <span>㎡</span>
      </div>
    </div>
    <input type="range" id="slider-win" min="0.0" max="10.0" step="0.1" value="1.5" oninput="sync('win', 'slider')">
  </div>
  <div class="result-area">
    <div class="formula-display" id="formula-text">式: D/H × 6.0 - 1.4</div>
    <div>採光補正係数</div>
    <div class="factor-display" id="factor-result">0.00</div>
    <div style="font-size:0.8em; color:#888;">(最大 3.0)</div>
    <div class="judgement">
      <div>必要採光面積<br><span id="req-area">0.0 ㎡</span><br><small id="ratio-label">(床面積の1/7)</small></div>
      <div>有効採光面積<br><span id="eff-area">0.0 ㎡</span><br><small>(窓面積 × 係数)</small></div>
    </div>
    <div class="status" id="status-text">判定</div>
  </div>
  <div class="visualizer">
    <div class="building" id="vis-building">
      <div class="window" id="vis-window"></div>
    </div>
    <div class="boundary" id="vis-boundary"></div>
    <div class="ground"></div>
    <div class="dim-h" id="vis-h"></div>
    <div class="dim-d" id="vis-d"></div>
  </div>
</div>
<script>
  let currentZone = 'residential';
  function setZone(zone) {
    currentZone = zone;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + zone).classList.add('active');
    calculate();
  }
  function sync(id, source) {
    const numInput = document.getElementById('num-' + id);
    const sliderInput = document.getElementById('slider-' + id);
    if (source === 'num') {
      sliderInput.value = numInput.value;
    } else if (source === 'slider') {
      numInput.value = sliderInput.value;
    }
    calculate();
  }
  function calculate() {
    const D = parseFloat(document.getElementById('num-d').value) || 0;
    const H = parseFloat(document.getElementById('num-h').value) || 1;
    const floorArea = parseFloat(document.getElementById('num-floor').value) || 0;
    const winArea = parseFloat(document.getElementById('num-win').value) || 0;
    const usageRatio = document.getElementById('usage-select').value;
    const ratio = D / H;
    let factor = 0;
    let formulaStr = '';
    if (currentZone === 'residential') {
      factor = ratio * 6.0 - 1.4;
      formulaStr = '式: D/H × 6.0 - 1.4';
    } else if (currentZone === 'commercial') {
      factor = ratio * 10.0 - 1.0;
      formulaStr = '式: D/H × 10.0 - 1.0';
    } else if (currentZone === 'industrial') {
      factor = ratio * 8.0 - 1.0;
      formulaStr = '式: D/H × 8.0 - 1.0';
    }
    if (factor < 0) factor = 0;
    if (factor > 3.0) factor = 3.0;
    document.getElementById('formula-text').textContent = formulaStr;
    document.getElementById('factor-result').textContent = factor.toFixed(2);
    let reqArea = 0;
    let ratioLabelStr = '';
    if (usageRatio === '1/7') {
      reqArea = floorArea / 7.0;
      ratioLabelStr = '(床面積の1/7)';
    } else if (usageRatio === '1/5') {
      reqArea = floorArea / 5.0;
      ratioLabelStr = '(床面積の1/5)';
    } else if (usageRatio === '1/10') {
      reqArea = floorArea / 10.0;
      ratioLabelStr = '(床面積の1/10)';
    } else if (usageRatio === '0') {
      reqArea = 0;
      ratioLabelStr = '(規定なし)';
    }
    const effArea = winArea * factor;
    document.getElementById('req-area').textContent = (usageRatio === '0') ? '不要' : reqArea.toFixed(2) + ' ㎡';
    document.getElementById('ratio-label').textContent = ratioLabelStr;
    document.getElementById('eff-area').textContent = effArea.toFixed(2) + ' ㎡';
    const statusText = document.getElementById('status-text');
    if (usageRatio === '0') {
      statusText.innerHTML = '💡 採光義務なし<br><span style="font-size:0.7em; opacity:0.8;">※排煙等の無窓居室（法35条）には要注意</span>';
      statusText.className = 'status none';
    } else if (effArea >= reqArea) {
      statusText.textContent = '✅ クリア！ (採光OK)';
      statusText.className = 'status ok';
    } else {
      statusText.textContent = '❌ アウト (窓を大きくするかDを広げて)';
      statusText.className = 'status ng';
    }
    const visWindow = document.getElementById('vis-window');
    const visBoundary = document.getElementById('vis-boundary');
    const visH = document.getElementById('vis-h');
    const visD = document.getElementById('vis-d');
    const visBuilding = document.getElementById('vis-building');
    const scale = 12;
    const pxD = D * scale;
    const pxH = H * scale;
    const windowCenterY = 30;
    visBuilding.style.height = (windowCenterY + pxH) + 'px';
    visWindow.style.bottom = (windowCenterY - 10) + 'px';
    visWindow.style.height = '20px';
    visBoundary.style.left = (80 + pxD) + 'px';
    visH.style.bottom = (20 + windowCenterY) + 'px';
    visH.style.height = pxH + 'px';
    visD.style.bottom = (20 + windowCenterY) + 'px';
    visD.style.left = '80px';
    visD.style.width = pxD + 'px';
  }
  calculate();
</script>
</body>
</html>
