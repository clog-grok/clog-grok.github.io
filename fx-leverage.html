<script>(function(){try{var t=localStorage.getItem("fx-theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
<style>

    --header-sub: #8b949e;
    --tab-bg: #0d1117;

    --tab-on-border: #30363d;

    --seg-on-bg: #1f6feb;
    --seg-on-text: #fff;
    --seg-on-border: #58a6ff;
    --btn-soft: #21262d;
    --btn-soft-text: #c9d1d9;
    --sim-bg: #0d1117;
    --numbox-bg: #161b22;
    --range-track: #30363d;
    --range-thumb: #58a6ff;
    --alert-bg: #21262d;
    --alert-border: #484f58;
    --alert-loss-bg: #3d1214;
    --alert-loss-border: #f85149;
    --alert-loss-text: #ffb4ae;
    --alert-gain-bg: #0d2818;
    --alert-gain-border: #3fb950;
    --alert-gain-text: #aff5b4;
    --result-bg: #0d1117;

  }
  body { margin: 0; padding: 12px; background: var(--page-bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: hidden; }
  .app { width: 100%; max-width: 420px; margin: 0 auto; background: var(--app-bg); border-radius: 16px; overflow: hidden; box-shadow: var(--app-shadow); }
  header { position: relative; background: var(--header-bg); color: var(--header-text); padding: 16px 44px 10px; text-align: center; }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 6px 0 0; font-size: .75rem; color: var(--header-sub); }
  .theme-btn { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--theme-btn); color: var(--header-text); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .theme-btn:hover { background: var(--theme-btn-hover); }
  .theme-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  html[data-theme="dark"] .theme-btn .ico-moon { display: none; }
  html:not([data-theme="dark"]) .theme-btn .ico-sun { display: none; }
  .switch { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 16px 14px; background: var(--tab-bg); }
  .switch a { text-align: center; text-decoration: none; color: var(--tab-text); border: 1px solid var(--tab-border); border-radius: 8px; padding: 8px; font-size: .78rem; font-weight: 700; }
  .switch a.on { background: var(--tab-on-bg); color: var(--tab-on-text); border-color: var(--tab-on-border); }

  label { display: block; font-size: .78rem; font-weight: 700; margin-bottom: 6px; color: var(--label); }
  .field { margin-bottom: 14px; }
  .seg { display: grid; gap: 6px; margin-bottom: 8px; }

  .chips button { flex: 1; min-width: 0; border: 1px solid var(--border); background: var(--chip-bg); border-radius: 999px; padding: 6px 0; font-size: .65rem; color: var(--chip-text); white-space: nowrap; }

  .sim { background: var(--sim-bg); border-radius: 12px; padding: 14px 12px; margin-bottom: 14px; border: 1px solid transparent; }

  .sim h2 { margin: 0 0 12px; font-size: .88rem; color: var(--label); }

  .alert.loss { background: var(--alert-loss-bg); border-color: var(--alert-loss-border); color: var(--alert-loss-text); }
  .alert.gain { background: var(--alert-gain-bg); border-color: var(--alert-gain-border); color: var(--alert-gain-text); }
  .alert .big { font-size: 1.2rem; margin: 4px 0; }

  .result .k { color: var(--result-muted); font-size: .75rem; }
  .result .v { font-size: 1.7rem; font-weight: 800; margin: 4px 0 10px; }

  .share { width: 100%; border: 0; background: var(--share); color: #fff; font-weight: 700; font-size: 16px; border-radius: 12px; padding: 14px; }
  .share-hint { margin: 8px 0 0; font-size: .68rem; color: var(--muted); text-align: center; }
  .result .row { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin: 4px 0 12px; }
  .result input#plIn { width: 12rem; border: 0; background: transparent; color: var(--result-text); font-size: 1.35rem; font-weight: 800; text-align: right; padding: 4px 0; outline: none; }
  .result .yen { font-size: .9rem; color: var(--result-muted); }
  .tap { font-size: .62rem; color: var(--result-muted); font-weight: 500; }
  .rev { margin: 0 0 12px; width: 100%; border: 1px solid var(--rev-border); background: var(--rev-bg); color: var(--rev-text); font-weight: 700; font-size: .85rem; border-radius: 10px; padding: 10px; }
  .rev:active { filter: brightness(1.15); }

  .seg.two { grid-template-columns: 1fr 1fr; }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; }
  .seg button { padding: 8px 0; font-size: .75rem; }
  .box, .numbox { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--input-bg); padding: 0 8px 0 12px; color: var(--input-text); }
  .numbox { background: var(--numbox-bg); border-radius: 8px; }
  input[type=text], input[type=number] { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; font-weight: 700; padding: 12px 0; text-align: right; outline: none; color: inherit; }
  .unit { font-size: .75rem; }
  .x, .get { height: 36px; font-size: .75rem; font-weight: 700; flex: initial; }
  .x { width: 36px; font-size: 16px; }
  .get { width: auto; padding: 0 10px; margin-left: 4px; }
  .result { padding: 16px 12px 12px; margin-bottom: 14px; }
  .result input { width: 12rem; border: 0; background: transparent; color: var(--result-text); font-size: 1.35rem; font-weight: 800; text-align: right; padding: 4px 0; outline: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; border-top: 1px solid var(--result-line); padding-top: 10px; font-size: .72rem; color: var(--result-muted); text-align: left; }
  .grid .cell input { width: calc(100% - 1.4rem); color: var(--result-em); font-size: .92rem; font-weight: 700; text-align: left; padding: 4px 0; display: inline-block; }
  .grid .cell .yen { margin-left: 4px; }
  .grid .locked { color: var(--result-em); font-size: .92rem; font-weight: 700; margin-top: 4px; }
  .tap { font-size: .62rem; color: var(--muted); }

</style>

<body>
<div class="app">
  <header>
    <button type="button" class="theme-btn" id="themeBtn" aria-label="テーマ切替">
      <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <h1>FX損益計算機</h1>
    <p>ドル円の値動き（スワップなし）</p>
  </header>
  <nav class="switch">
    <a href="./enkawase.html">円高ショック</a>
    <a class="on" href="./fx-leverage.html">FX損益</a>
  </nav>
  <div class="pad">
    <div class="field"><label>1ロット</label><div class="seg two" id="sizeSeg"></div></div>
    <div class="field"><label for="lotsIn">ロット数</label><div class="box"><input id="lotsIn" type="text" inputmode="decimal" value="1"><span class="unit">ロット</span><button type="button" class="x" id="clrLots">×</button></div><p class="hint" id="unitsHint"></p></div>
    <div class="field"><label>売買</label><div class="seg two" id="sideSeg"></div></div>
    <div class="field"><label for="entry">約定レート</label><div class="box"><input id="entry" type="number" inputmode="decimal" step="0.001" value="157"><span class="unit">円/$</span><button type="button" class="x" id="clrEntry">×</button><button type="button" class="get" id="fetchBtn">取得</button></div><p class="hint" id="rateHint">取得は公開の為替データです。ずれたら手入力。</p></div>
    <div class="sim"><h2>想定</h2><div class="field" style="margin-bottom:0"><label for="exitNum">想定レート</label><div class="numbox"><input id="exitNum" type="text" inputmode="decimal" value="140"><span class="unit">円/$</span></div><input id="exit" type="range" min="100" max="200" step="0.1" value="140"><div class="ends"><span>100</span><span>150</span><span>200</span></div></div></div>
    <div class="alert" id="alertBox"></div>
    <div class="result"><div class="k">想定損益 <span class="tap">数字を変えると想定レートが動きます</span></div><div class="row"><input id="plIn" type="text" inputmode="decimal"><span class="yen">円</span></div><div class="grid"><div class="cell">必要証拠金<div><input id="marginIn" type="text" inputmode="decimal"><span class="yen">円</span></div></div><div class="cell">証拠金に対する損益<div class="locked" id="roe">—</div></div><div class="cell">名目（約定時）<div class="locked" id="notional">—</div></div><div class="cell">1円動いたとき<div><input id="perYenIn" type="text" inputmode="decimal"><span class="yen">円</span></div></div></div></div>
    <div class="field"><label>レバレッジ（証拠金の目安）</label><div class="seg three" id="levSeg"></div><p class="hint">損益の式には入りません。</p></div>
    <button type="button" class="share" id="shareBtn">共有</button>
    <p class="share-hint">スマホでは共有シートが開きます。</p>
    <div class="foot"><a href="./">一覧</a><button type="button" id="resetBtn" aria-label="リセット">↺</button></div>
  </div>
</div>
<script>


(function(){
  const KEY = "fx-theme";
  const root = document.documentElement;
  function systemTheme(){
    try { return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
    catch (e) { return "light"; }
  }
  function apply(t, persist){
    root.setAttribute("data-theme", t);
    if (persist) { try { localStorage.setItem(KEY, t); } catch (e) {} }
  }
  function stored(){
    try {
      const t = localStorage.getItem(KEY);
      return (t === "light" || t === "dark") ? t : null;
    } catch (e) { return null; }
  }
  function cur(){ return root.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  function syncFromPreference(){
    const s = stored();
    apply(s || systemTheme(), false);
  }
  syncFromPreference();
  try {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => { if (!stored()) apply(systemTheme(), false); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  } catch (e) {}
  const btn = document.getElementById("themeBtn");
  if (btn) btn.addEventListener("click", () => apply(cur() === "dark" ? "light" : "dark", true));
})();

const $ = (id) => document.getElementById(id);
const STORE = "fxpl-v1";
const SIZES = [1000, 10000];
const LEVS = [1, 10, 25];
let lotSize = 10000;
let lots = 1;
let side = 1;
let lev = 25;
let lock = "";
function units() { return lots * lotSize; }
function parseNum(s) {
  if (s === "-" || s === "+" || s === "" || s === ".") return NaN;
  const n = parseFloat(String(s).replace(/,/g, "").replace(/−/g, "-"));
  return isFinite(n) ? n : NaN;
}
function comma(n) { if (!isFinite(n)) return ""; return Math.round(n).toLocaleString("en-US"); }
function signedComma(n) { if (!isFinite(n)) return ""; const sign = n > 0 ? "+" : n < 0 ? "-" : ""; return sign + Math.round(Math.abs(n)).toLocaleString("en-US"); }
function paintSeg(host, items, current, labelFn, onPick) {
  host.innerHTML = "";
  items.forEach((v) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = labelFn(v);
    if (v === current) b.className = "on";
    b.onclick = () => onPick(v);
    host.appendChild(b);
  });
}
function paint() {
  paintSeg($("sizeSeg"), SIZES, lotSize, (v) => (v === 1000 ? "1,000通貨" : "10,000通貨"), (v) => { lotSize = v; calc(); });
  paintSeg($("sideSeg"), [1, -1], side, (v) => (v === 1 ? "買い" : "売り"), (v) => { side = v; calc(); });
  const levItems = LEVS.includes(lev) ? LEVS : [...LEVS, lev];
  paintSeg($("levSeg"), levItems, lev, (v) => (Number.isInteger(v) ? v + "倍" : v.toFixed(1) + "倍"), (v) => { lev = v; calc(); });
}
function pinSlider(v) { if (isFinite(v)) $("exit").value = String(Math.max(100, Math.min(200, v))); }
function setExit(v) { if (!isFinite(v)) return; const n = Math.round(v * 1000) / 1000; $("exitNum").value = String(n); pinSlider(n); }
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ lotSize, lots, side, lev, entry: $("entry").value, exit: $("exitNum").value })); } catch (e) {}
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!s) return;
    if (s.lotSize === 1000 || s.lotSize === 10000) lotSize = s.lotSize;
    if (s.lots > 0) { lots = s.lots; $("lotsIn").value = String(s.lots); }
    if (s.side === 1 || s.side === -1) side = s.side;
    if (s.lev > 0) lev = s.lev;
    if (s.entry != null) $("entry").value = s.entry;
    if (s.exit != null) setExit(parseNum(s.exit));
  } catch (e) {}
}
function resetAll() {
  try { localStorage.removeItem(STORE); } catch (e) {}
  lotSize = 10000; lots = 1; side = 1; lev = 25; lock = "";
  $("lotsIn").value = "1"; $("entry").value = "157"; setExit(140);
  $("rateHint").textContent = "取得は公開の為替データです。ずれたら手入力。";
  calc();
}
function calc() {
  paint();
  const u = units();
  $("unitsHint").textContent = "合計 " + comma(u) + "通貨";
  const entry = parseNum($("entry").value);
  const exit = parseNum($("exitNum").value);
  pinSlider(exit);
  if (!(entry > 0) || !(u > 0) || !isFinite(exit)) { $("alertBox").textContent = "ロット数と約定レートを入れてください"; $("alertBox").className = "alert"; return; }
  const pl = u * (exit - entry) * side;
  const notional = u * entry;
  const margin = notional / lev;
  const roe = margin ? (pl / margin) * 100 : 0;
  const perYen = u * side;
  if (lock !== "pl") $("plIn").value = signedComma(pl);
  if (lock !== "margin") $("marginIn").value = comma(margin);
  if (lock !== "perYen") $("perYenIn").value = signedComma(perYen);
  $("notional").textContent = comma(notional) + "円";
  $("roe").textContent = (roe >= 0 ? "+" : "") + roe.toFixed(1) + "%";
  const box = $("alertBox");
  if (Math.abs(pl) < 0.5) { box.className = "alert"; box.textContent = "想定は約定と同じです。"; }
  else { box.className = "alert " + (pl < 0 ? "loss" : "gain"); box.textContent = (side === 1 ? "買い" : "売り") + " " + lots + "ロット（" + comma(u) + "通貨） / " + entry + " → " + exit; }
  save();
}
async function fetchRate() {
  $("rateHint").textContent = "取得中…";
  const urls = ["https://open.er-api.com/v6/latest/USD", "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json"];
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) continue;
      const d = await res.json();
      let jpy = null;
      if (d.rates && d.rates.JPY) jpy = d.rates.JPY;
      if (d.usd && d.usd.jpy) jpy = d.usd.jpy;
      if (!jpy) continue;
      const v = Math.round(jpy * 1000) / 1000;
      $("entry").value = String(v);
      setExit(v);
      $("rateHint").textContent = "取得 " + v + "円/$";
      calc();
      return;
    } catch (e) {}
  }
  $("rateHint").textContent = "取得できませんでした。手入力してください。";
}
$("lotsIn").addEventListener("input", () => { const n = parseNum($("lotsIn").value); if (n > 0) lots = n; calc(); });
$("clrLots").onclick = () => { $("lotsIn").value = ""; $("lotsIn").focus(); };
$("clrEntry").onclick = () => { $("entry").value = ""; $("entry").focus(); calc(); };
$("fetchBtn").onclick = fetchRate;
$("exit").addEventListener("input", () => { $("exitNum").value = $("exit").value; calc(); });
$("exitNum").addEventListener("input", () => { pinSlider(parseNum($("exitNum").value)); calc(); });
$("entry").addEventListener("input", calc);
$("plIn").addEventListener("focus", () => { lock = "pl"; });
$("marginIn").addEventListener("focus", () => { lock = "margin"; });
$("perYenIn").addEventListener("focus", () => { lock = "perYen"; });
["plIn", "marginIn", "perYenIn"].forEach((id) => { $(id).addEventListener("blur", () => { lock = ""; calc(); }); });
$("plIn").addEventListener("input", () => {
  const pl = parseNum($("plIn").value); const entry = parseNum($("entry").value); const u = units();
  if (!isFinite(pl) || !(entry > 0) || !u) return;
  setExit(entry + pl / (u * side)); calc();
});
$("marginIn").addEventListener("input", () => {
  const margin = parseNum($("marginIn").value); const entry = parseNum($("entry").value); const u = units();
  if (!(margin > 0) || !(entry > 0) || !u) return;
  lev = Math.round(((u * entry) / margin) * 10) / 10; if (lev <= 0) return; calc();
});
$("perYenIn").addEventListener("input", () => {
  const n = parseNum($("perYenIn").value); if (!isFinite(n) || n === 0) return;
  side = n > 0 ? 1 : -1; lots = Math.abs(n) / lotSize; $("lotsIn").value = String(lots); calc();
});
$("shareBtn").onclick = async () => {
  const text = (side === 1 ? "買い" : "売り") + " " + lots + "ロット（" + comma(units()) + "通貨）\n" + $("entry").value + " → " + $("exitNum").value + "\n想定損益 " + $("plIn").value + "円 / 証拠金 " + $("marginIn").value + "円";
  if (navigator.share) {
    try { await navigator.share({ title: "FX損益計算機", text }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(text); } catch (e) {}
  $("shareBtn").textContent = "コピーした";
  setTimeout(() => { $("shareBtn").textContent = "共有"; }, 1400);
};
$("resetBtn").onclick = resetAll;
load();
paint(); calc();
</script>
</body>
