<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配置プレビュー｜マンション工事費</title>
<style>
:root{--ink:#18212b;--muted:#687381;--line:#dbe2e8;--bg:#f6f8fa;--panel:#fff;--accent:#1864ab;--accent-bg:#eaf3ff;--warn:#fff8e1;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55}
.container{max-width:1120px;margin:0 auto;padding:24px 20px 48px}
header{margin-bottom:20px}
h1{font-size:clamp(24px,4vw,36px);margin:0 0 6px;letter-spacing:.02em}
.lead{color:var(--muted);margin:0}
.notice{background:var(--warn);border:1px solid #f2d675;border-radius:10px;padding:12px 14px;margin:18px 0;font-size:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px rgb(20 40 60 / 4%)}
.card h2{font-size:18px;margin:0 0 14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}
input,select{width:100%;font:inherit;padding:9px 10px;border:1px solid #c8d2dc;border-radius:7px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:3px solid #d8eaff;border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
button{font:inherit;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700}
button.secondary{background:#edf1f5;color:var(--ink)}
button.danger{background:#fff;color:var(--danger);border:1px solid #e3b9b5}
summary{cursor:pointer;font-weight:700;color:var(--accent);margin-top:8px}
.small{font-size:12px;color:var(--muted)}
.results{display:grid;gap:10px}
.result-row{display:flex;justify-content:space-between;gap:15px;align-items:baseline;border-bottom:1px dashed var(--line);padding:8px 0}
.result-row:last-child{border-bottom:0}
.result-row .name{color:var(--muted);font-size:13px}
.result-row .value{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.total{margin-top:4px;background:var(--accent-bg);border:1px solid #b8d6f5;border-radius:10px;padding:12px 14px}
.total .result-row{border-bottom:0;padding:0}
.total .value{font-size:22px;color:var(--accent)}
.breakdown{margin-top:15px}
.breakdown h3{font-size:15px;margin:0 0 7px}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:right;white-space:nowrap}
th{background:#f1f5f8;font-weight:700}
th:first-child,td:first-child{text-align:left}
footer{margin-top:18px;color:var(--muted);font-size:12px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<main class="container">
<header>
<h1>配置プレビュー｜マンション工事費</h1>
<p class="lead">入力値の配置と、1戸あたり本体・共通費の計算結果を確認するプレビューです。</p>
</header>
<div class="notice">このページは配置確認用です。実際の見積書に記載する金額とは異なる場合があります。</div>
<section class="grid" aria-label="工事費設定と結果">
<div class="card">
<h2>工事費の設定</h2>
<div class="form-grid">
<div class="field"><label for="units">戸数</label><input id="units" type="number" min="1" value="48"></div>
<div class="field"><label for="gfa">延床面積（㎡）</label><input id="gfa" type="number" min="0" value="4200"></div>
<div class="field"><label for="land">敷地面積（㎡）</label><input id="land" type="number" min="0" value="1200"></div>
<div class="field"><label for="baseCost">本体工事費（円／㎡）</label><input id="baseCost" type="number" min="0" value="280000"></div>
<div class="field"><label for="commonCost">共通費率（%）</label><input id="commonCost" type="number" min="0" value="12"></div>
<div class="field"><label for="landCost">土地単価（円／㎡）</label><input id="landCost" type="number" min="0" value="450000"></div>
<div class="field full"><label for="otherCost">その他費用（円）</label><input id="otherCost" type="number" min="0" value="0"></div>
</div>
<div class="actions"><button id="calcBtn" type="button">計算する</button><button id="resetBtn" class="secondary" type="button">初期値に戻す</button></div>
<details>
<summary>計算式</summary>
<p class="small">本体工事費 = 延床面積 × 本体工事費単価、共通費 = 本体工事費 × 共通費率、土地費 = 敷地面積 × 土地単価。合計を戸数で割り、1戸あたり金額を表示します。</p>
</details>
</div>
<div class="card">
<h2>計算結果</h2>
<div class="results">
<div class="result-row"><span class="name">本体工事費</span><span class="value" id="baseLine">—</span></div>
<div class="result-row"><span class="name">共通費</span><span class="value" id="commonLine">—</span></div>
<div class="result-row"><span class="name">土地費</span><span class="value" id="landLine">—</span></div>
<div class="result-row"><span class="name">その他費用</span><span class="value" id="otherLine">—</span></div>
<div class="result-row"><span class="name">工事費小計</span><span class="value" id="constructionLine">—</span></div>
<div class="total"><div class="result-row"><span class="name">合計</span><span class="value" id="totalLine">—</span></div></div>
</div>
<div class="breakdown">
<h3>1戸あたり</h3>
<div class="result-row"><span class="name">本体</span><span class="value" id="perUnitText">—</span></div>
<div class="result-row"><span class="name">共通費・その他・土地</span><span class="value" id="exCommonLine">—</span></div>
<div class="result-row"><span class="name">延床面積（1戸あたり）</span><span class="value" id="gfaLandOneLine">—</span></div>
</div>
</div>
</section>
<footer>配置プレビュー（restore build）</footer>
</main>
<script>
(() => {
  const defaults = {units:48,gfa:4200,land:1200,baseCost:280000,commonCost:12,landCost:450000,otherCost:0};
  const yen = n => `${Math.round(n).toLocaleString('ja-JP')} 円`;
  const number = id => Number(document.getElementById(id).value) || 0;
  function calculate(){
    const units = Math.max(1, number('units'));
    const gfa = number('gfa');
    const land = number('land');
    const baseCost = number('baseCost');
    const commonRate = number('commonCost') / 100;
    const landCost = number('landCost');
    const other = number('otherCost');
    const base = gfa * baseCost;
    const common = base * commonRate;
    const landTotal = land * landCost;
    const construction = base + common;
    const total = construction + landTotal + other;
    document.getElementById('baseLine').textContent = yen(base);
    document.getElementById('commonLine').textContent = yen(common);
    document.getElementById('landLine').textContent = yen(landTotal);
    document.getElementById('otherLine').textContent = yen(other);
    document.getElementById('constructionLine').textContent = yen(construction);
    document.getElementById('totalLine').textContent = yen(total);
    document.getElementById('perUnitText').textContent = yen(base / units);
    document.getElementById('exCommonLine').textContent = yen((common + landTotal + other) / units);
    document.getElementById('gfaLandOneLine').textContent = `${(gfa / units).toLocaleString('ja-JP')} ㎡ / ${(land / units).toLocaleString('ja-JP')} ㎡`;
  }
  function reset(){ for(const [id,value] of Object.entries(defaults)) document.getElementById(id).value = value; calculate(); }
  document.getElementById('calcBtn').addEventListener('click', calculate);
  document.getElementById('resetBtn').addEventListener('click', reset);
  for(const id of Object.keys(defaults)) document.getElementById(id).addEventListener('input', calculate);
  calculate();
})();
</script>
<script src="mansion-kojihi-preview.js?v=20-restore"></script>
</body>
</html>
