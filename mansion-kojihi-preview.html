<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配置プレビュー｜マンション工事費</title>
<meta name="description" content="公開版を土台に、階数と戸数・面積を住戸の計画へ寄せた配置プレビュー。公開版はそのまま。">
<meta name="tool-tag" content="建築">
<meta name="tool-status" content="wip">
<style>
  :root { --bg-color:#0f172a; --card-bg:#1e293b; --text-main:#f8fafc; --text-sub:#cbd5e1; --accent:#38bdf8; --ok:#34d399; --border:#334155; --warn:#fbbf24; }
  html[data-theme="light"] { --bg-color:#e2e8f0; --card-bg:#ffffff; --text-main:#0f172a; --text-sub:#334155; --accent:#0369a1; --ok:#047857; --border:#cbd5e1; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
  body.steps-open { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .app-container { background-color: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.18); position: relative; }
  .theme { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border: 1px solid var(--border); background: transparent; color: var(--text-main); border-radius: 999px; padding: 0; font-size: 1rem; line-height: 1; }
  h1 { font-size: 1.15rem; text-align: center; margin: 0 0 14px; padding-right: 48px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; }
  .seg button { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 8px; padding: 8px 4px; font-size: 0.78rem; }
  .seg button.on { border-color: var(--accent); color: var(--text-main); background: rgba(56, 189, 248, 0.14); }
  .mini { display: flex; gap: 4px; flex-shrink: 0; }
  .mini button { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 6px; padding: 3px 7px; font-size: 0.68rem; }
  .mini button.on { border-color: var(--accent); color: var(--text-main); background: rgba(56, 189, 248, 0.14); }
  .fold { background-color: var(--bg-color); border-radius: 12px; padding: 8px 14px 14px; margin-bottom: 12px; }
  .fold summary { list-style: none; cursor: pointer; padding: 8px 0; margin-bottom: 8px; color: var(--text-main); font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .fold:not([open]) summary { margin-bottom: 0; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary .tri { display: inline-block; width: 1.1em; font-size: 0.85em; line-height: 1; color: var(--accent); flex-shrink: 0; }
  .fold summary .tri::before { content: "▶"; }
  .fold[open] summary .tri::before { content: "▼"; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .row label { font-size: 0.92rem; color: var(--text-main); }
  .row input[type="text"] { width: 104px; text-align: right; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 0.95rem; }
  .with-unit { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .with-unit input[type="text"] { width: 88px; }
  .unit { font-size: 0.82rem; color: var(--text-main); min-width: 2.4em; font-weight: 600; }
  .unit-slash { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; margin: 0 2px; }
  .units-cap { font-size: 0.85rem; color: var(--text-main); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .conv { font-size: 0.72rem; color: var(--text-sub); text-align: right; margin: 0 0 10px; min-height: 1em; word-break: break-all; }
  .result-box { border: 2px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .result-box.main { border-color: var(--accent); }
  .result-title { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
  .result-amount { font-size: 1.45rem; font-weight: bold; text-align: right; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .result-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: 6px; color: var(--text-sub); }
  .result-line b { color: var(--text-main); font-weight: 600; }
  .result-line input[type="text"] { width: 88px; text-align: right; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 0.85rem; outline: none; }
  .result-line.coeff-line { justify-content: flex-end; gap: 4px; }
  .result-line.coeff-line #gfaFormula { flex: 0 1 auto; text-align: right; white-space: nowrap; }
  .gfa-land-block { display: block; width: 100%; margin: 0 0 10px; clear: both; overflow: hidden; position: relative; z-index: 1; box-sizing: border-box; }
  .gfa-land-block .gfa-land-line { margin: 0; padding: 0; border-bottom: 0; }
  .gfa-land-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px; margin: 8px 0 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.8rem; color: var(--text-sub); flex-wrap: wrap; width: 100%; box-sizing: border-box; position: relative; clear: both; }
  .gfa-land-label { flex: 1 1 8em; min-width: 0; white-space: normal; }
  .gfa-land-val { flex: 0 0 auto; margin-left: auto; color: var(--text-main); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; word-break: keep-all; overflow-wrap: normal; text-align: right; max-width: 100%; }
  .result-sub { font-size: 0.72rem; color: var(--text-sub); text-align: right; margin: 4px 0 0; min-height: 1em; }
  .cap { display: inline-block; font-size: 0.68rem; border: 1px solid var(--ok); color: var(--ok); border-radius: 999px; padding: 1px 8px; margin: 0; max-width: 100%; white-space: normal; position: relative; z-index: 2; vertical-align: top; }
  .cap-line { display: block; width: 100%; margin: 0 0 6px; line-height: 1.35; clear: both; position: relative; z-index: 2; overflow: visible; box-sizing: border-box; }
  .check { display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; color: var(--text-main); margin: 8px 0 6px; }
  .extra-list { font-size: 0.72rem; color: var(--text-sub); line-height: 1.5; margin: 0 0 8px 24px; }
  .steps-btn { display: block; width: 100%; border: 2px solid var(--border); background: var(--bg-color); color: var(--text-main); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; font-size: 0.78rem; cursor: pointer; }
  .steps-slot { min-height: 0; }
  .steps-panel { display: none; background: var(--card-bg); color: var(--text-main); border: 2px solid var(--border); border-radius: 14px; padding: 10px 12px; margin: 0 0 10px; }
  .steps-panel.open { display: block; }
  .steps-panel.float { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: calc(100% - 24px); max-width: 400px; max-height: min(28vh, 180px); overflow: auto; z-index: 1000; margin: 0; box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .foot a, .foot button { background: none; border: 0; color: var(--text-sub); font-size: 0.78rem; text-decoration: none; padding: 10px 4px; cursor: pointer; }
  .float-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .float-head strong { font-size: 0.85rem; }
  .float-head button { border: 1px solid var(--border); background: transparent; color: var(--text-main); border-radius: 8px; width: 32px; height: 32px; font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .steps { font-size: 0.72rem; color: var(--text-main); line-height: 1.45; margin: 0; white-space: pre-wrap; word-break: break-all; }
  .warn { font-size: 0.72rem; color: var(--warn); margin-top: 8px; line-height: 1.5; }
  .hidden { display: none; }
  .foot-link { color: var(--text-sub); font-size: 0.75rem; text-decoration: none; }

  h1 { margin: 0 0 4px; }
  .preview-note { text-align: center; font-size: 0.72rem; color: var(--warn); margin: 0 0 12px; }
  .land-card { background-color: var(--bg-color); border-radius: 12px; padding: 8px 14px 14px; margin-bottom: 12px; }
  .block-title { font-size: 1.02rem; font-weight: 700; color: var(--text-main); margin: 4px 0 10px; }
  .foot { gap: 8px; flex-wrap: wrap; }
  .foot-link { display: inline-block; width: max-content; margin-top: 0; }
</style>
</head>
<body>
<div class="app-container">
  <button type="button" class="theme" id="themeBtn" aria-label="テーマ">☀</button>
  <h1>マンション工事費ざっくり</h1>
  <p class="preview-note">配置プレビュー（公開版は別・未反映）</p>

  <div class="result-box">
    <div class="cap-line"><span class="cap" id="capLabel">容積</span></div>
    <div class="result-title">想定延べ面積</div>
    <div class="result-amount" id="gfaText">—</div>
    <div class="result-line"><span>建築面積上限（1階）</span><b id="archText">—</b></div>
    <div class="result-line"><span>容積の上限</span><b id="farText">—</b></div>
    <div class="result-line"><span>上限までの階数</span><b id="needFloorText">—</b></div>
    <p class="warn hidden" id="floorNote"></p>
  </div>

  <details class="fold" id="landFold" open>
    <summary><span class="tri" aria-hidden="true"></span>敷地・建蔽・容積</summary>
    <div class="row"><label id="landLabel">敷地面積</label><div class="mini" id="unitSeg"><button type="button" data-unit="m2" class="on">㎡</button><button type="button" data-unit="tsubo">坪</button></div></div>
    <div class="row"><span></span><div class="with-unit"><input type="text" inputmode="decimal" id="land" value="330"><span class="unit" id="landUnit">㎡</span></div></div>
    <div class="conv" id="landConv"></div>
    <div class="row"><label>建蔽率</label><div class="with-unit"><input type="text" inputmode="decimal" id="kenpei" value="80"><span class="unit">%</span></div></div>
    <div class="row"><label>容積率</label><div class="with-unit"><input type="text" inputmode="decimal" id="yoseki" value="400"><span class="unit">%</span></div></div>
    <div class="gfa-land-block">
      <div class="cap-line"><span class="cap" id="capLabelLand2">容積</span></div>
      <div class="gfa-land-line">
        <span class="gfa-land-label">想定延べ面積</span>
        <b id="gfaTextLand2" class="gfa-land-val">—</b>
      </div>
    </div>
  </details>

  <div class="result-box">
    <div class="result-title">住戸の計画</div>
    <div class="result-line coeff-line" style="margin:2px 0 4px;">
      <span id="gfaFormula">専有 —㎡ ×</span>
      <input type="text" inputmode="decimal" id="coeffOut" value="1.33" aria-label="廊下係数">
    </div>
    <div class="row"><label>階数</label><div class="with-unit"><input type="text" inputmode="decimal" id="floors" value="7"><span class="unit">階</span></div></div>
    <div class="result-line"><span>1階あたり戸数</span><b id="perFloorText">—</b></div>
    <div class="result-line"><span>想定戸数</span><div class="with-unit"><input type="text" inputmode="decimal" id="unitsIn"><span class="unit-slash">/</span><b id="unitsCapText" class="units-cap">—</b></div></div>
    <div class="result-line"><span>1戸あたり本体</span><b id="perUnitText">—</b></div>
    <div class="result-line"><span>専有の合計</span><b id="exText">—</b></div>
    <div class="result-line"><span>共用の合計</span><b id="commonText">—</b></div>
    <p class="warn hidden" id="unitsNote"></p>
  </div>

  <details class="fold" id="typeFold" open>
    <summary><span class="tri" aria-hidden="true"></span>住戸・構造・単価</summary>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="oneroom" class="on">ワンルーム</button>
      <button type="button" data-type="family">ファミリー</button>
    </div>
    <div class="seg three" id="structSeg">
      <button type="button" data-struct="S">S造</button>
      <button type="button" data-struct="RC" class="on">RC造</button>
      <button type="button" data-struct="SRC">SRC造</button>
    </div>
    <div class="row"><label id="priceLabel">延べの坪単価</label><div class="mini" id="priceSeg"><button type="button" data-price="tsubo" class="on">坪</button><button type="button" data-price="m2">㎡</button></div></div>
    <div class="row"><span></span><div class="with-unit"><input type="text" inputmode="decimal" id="price" value="120"><span class="unit" id="priceUnit">万円/坪</span></div></div>
    <div class="conv" id="priceConv"></div>
    <div class="row"><label>1戸の専有</label><div class="with-unit"><input type="text" inputmode="decimal" id="unitM2" value="25"><span class="unit" id="unitSizeUnit">㎡</span></div></div>
    <div class="row"><label>専有効率</label><input type="text" inputmode="decimal" id="eff" value="0.75"></div>
    <div class="row"><label>廊下係数</label><input type="text" inputmode="decimal" id="coeff" value="1.33"></div>
    <div class="conv">専有効率 ＝ 1 ÷ 廊下係数</div>
    <div class="gfa-land-block">
      <div class="cap-line"><span class="cap" id="capLabelLand">容積</span></div>
      <div class="gfa-land-line">
        <span class="gfa-land-label">想定延べ面積</span>
        <b id="gfaTextLand" class="gfa-land-val">—</b>
      </div>
    </div>
  </details>

  <div class="result-box main">
    <div class="result-title" id="bodyTitle">本体工事費（延べ面積 × 単価）</div>
    <div class="result-amount" id="bodyText">—</div>
    <div class="result-line"><span id="formulaLabel">延べ坪 × 坪単価</span><b id="formulaText">—</b></div>
    <p class="result-sub hidden" id="bodyBaseLine"></p>
  </div>
  <label class="check"><input type="checkbox" id="extra"> 付帯＋諸費用 +25%（仮置き）</label>
  <p class="extra-list hidden" id="extraList">含むもの（仮）：外構・地盤改良・設計監理・申請 など</p>
  <button type="button" class="steps-btn" id="stepsToggle">式の確認</button>
  <div class="steps-slot" id="stepsSlot">
    <div class="steps-panel" id="stepsPanel" hidden>
      <div class="float-head"><strong>式の確認</strong><button type="button" id="stepsClose" aria-label="閉じる">×</button></div>
      <p class="steps" id="steps">—</p>
    </div>
  </div>
  <div class="foot">
    <a class="foot-link" href="./wip.html">← 試作</a>
    <a class="foot-link" href="./mansion-kojihi.html">公開版（参考）</a>
    <button type="button" id="resetBtn" aria-label="リセット">↺</button>
  </div>
</div>
<script src="./mansion-kojihi-preview.js"></script>
</body>
</html>
