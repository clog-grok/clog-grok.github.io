<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DXF軽量ビューア</title>
<meta name="description" content="DXF図面を開いて距離・面積を測る（縮尺補正つき）">
<meta name="tool-status" content="wip">
<style>
header{padding-top:env(safe-area-inset-top,0px)}footer{padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--bg:#12161a;--bar:#1c2227;--fg:#e6edf0;--btn:#273036;--bd:#3d4850;--mut:#8fa0a8;--cv:#0e1317;--act:#c4364d;--actb:#ff5d73}
:root[data-theme=light]{--bg:#e9ecee;--bar:#f7f8f8;--fg:#1b2429;--btn:#e8ecee;--bd:#b8c2c8;--mut:#5d6b73;--cv:#f6f6f2;--act:#d4193c;--actb:#d4193c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;touch-action:none}
body{display:flex;flex-direction:column;height:100dvh}
header,footer{background:var(--bar);padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
button,.btn,input[type=number]{min-height:44px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--btn);color:var(--fg);font:inherit;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
header>*,#sets>*{flex:1 1 auto;min-width:0}
header{flex-wrap:nowrap;gap:3px}header>*{flex:1 1 0;padding:0 2px;font-size:13px}
#tools{background:var(--bar);padding:4px 6px 6px;display:flex;flex-wrap:nowrap;gap:4px;align-items:center;border-bottom:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch}
#tools[hidden]{display:none!important}
#tools button{min-height:36px;padding:0 7px;font-size:13px;flex:0 0 auto}
#tools input{min-height:36px;padding:0 8px;font-size:16px;flex:1 1 80px;min-width:64px;max-width:120px;border:1px solid var(--bd);border-radius:8px;background:var(--btn);color:var(--fg)}
#measB{min-width:3.2em;font-weight:600}
#sgB{min-width:36px;font-size:15px;font-weight:700}
#nameWrap{position:relative;display:flex;flex:1 1 80px;min-width:72px;max-width:140px;align-items:center}
#nameWrap[hidden]{display:none!important}
#nameWrap input{flex:1;width:100%;max-width:none;min-width:0}
#nameWrap.has-plus input{padding-right:30px}
#catPlus{position:absolute;right:2px;top:50%;transform:translateY(-50%);min-height:32px;width:28px;padding:0;border:none;background:transparent;color:var(--fg);font-size:18px;font-weight:700;flex:0 0 auto}
#fileBar,#sets{background:var(--bar);padding:0 6px 6px;display:flex;gap:4px;border-bottom:1px solid var(--bd)}
#fileBar>*{flex:1 1 0}
#modeB{min-width:3.6em;font-weight:700}
#cname{touch-action:manipulation}
#modeB.md-dist{background:#1a4a6e!important;border-color:#4aa3e0;color:#fff}
#modeB.md-area{background:#1a5c3c!important;border-color:#5ad19a;color:#fff}
#modeB.md-cnt{background:#6a4a14!important;border-color:#e0a84a;color:#fff}
#lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 0 4px;font-size:13px;color:var(--mut)}
#lhead button{min-height:32px;padding:0 10px;font-size:12px;flex:0 0 auto}
button,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active,.btn:active{opacity:.7}
#saveAsBar{background:var(--bar);padding:0 6px 6px;display:flex;gap:4px;border-bottom:1px solid var(--bd);align-items:center}
#saveAsBar input{flex:1 1 auto;min-width:0;min-height:44px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--btn);color:var(--fg);font:inherit;font-size:16px}
#saveAsBar button{flex:0 0 auto;padding:0 12px}
#dlBar{background:var(--bar);padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--bd);font-size:13px}
#dlBar #dlMsg{flex:1 1 100%}#dlBar a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--fg)}
button.on{background:var(--btn);border-color:var(--mut);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--mut)}
#snapB.on,#snapCntB.on{background:var(--btn);border-color:#5ad19a;color:var(--fg);box-shadow:inset 0 0 0 1.5px #5ad19a}#measB.on,#fileB.on,#lB.on,#setB.on,#calB.on{background:var(--btn);border-color:var(--mut);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--mut)}
#thB svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
:root[data-theme=dark] .sun,:root[data-theme=light] .moon{display:none}
#main{flex:1;min-height:0;position:relative;background:var(--cv)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;padding:4px 10px;border-radius:6px;pointer-events:none;max-width:90%}
#recB{background:#2d6b52!important;border-color:#5ad19a;color:#fff}#sgB.on{background:#6b2d3a!important;border-color:#d15a7a;color:#fff;box-shadow:none}
footer{padding:6px 10px}
#out{font-size:15px;font-variant-numeric:tabular-nums;white-space:pre-line;min-height:22px;width:100%}
#panel{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--bar);border-top:1px solid var(--bd);padding:8px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.pr{display:flex;gap:6px;align-items:flex-end}
.pr label{flex:1;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.pr button{flex:1}
input[type=number]{width:100%;font-size:16px;padding:0 10px}
#calSt{font-size:13px}
#info{font-size:12px;color:var(--mut);max-height:4.2em;overflow:auto}
#lp{position:absolute;left:0;right:0;bottom:0;max-height:55%;overflow:auto;z-index:6;background:var(--bar);border-top:1px solid var(--bd);padding:8px;touch-action:pan-y}
#lp .rw{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--bd)}
#lp .rw .tag{flex:none;font-size:12px;color:var(--mut);min-width:2.8em}#lp .rw .nm{flex:1;min-width:0;min-height:36px;font-size:16px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--btn);color:var(--fg)}#lp .rw .vt{flex:none;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mut);max-width:38%;text-align:right}#lp .rw button{min-height:36px;flex:none}#lp .rw button.on{background:#6b2d3a;border-color:#d15a7a;color:#fff}#lp .rw input[type=checkbox]{width:22px;height:22px;flex:none}
#lsum{white-space:pre-line;font-weight:bold;padding-top:6px}
</style>
</head>
<body>
<header>
  <button id="fileB">ファイル</button>
  <button id="fitB">全体</button>
  <button id="measB" title="計測のオン／オフ">計測</button>
  <button id="lB">一覧</button>
  <button id="setB">設定</button>
</header>
<div id="fileBar" hidden>
  <label class="btn">開く<input type="file" id="f"  hidden></label>
  <button id="ovB" title="今のファイル名で保存">上書き保存</button>
  <button id="saB" title="ファイル名を付けて保存">名前を付けて保存</button>
  <button id="shB" title="編集中のDXFを共有">共有</button>
</div>
<div id="saveAsBar" hidden>
  <input id="saveAsName" type="text" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="saveAsGo">保存</button>
  <button id="saveAsX">やめる</button>
</div>
<div id="dlBar" hidden>
  <span id="dlMsg">保存用ファイルを作りました</span>
  <button id="dlShare">共有 →「ファイルに保存」</button>
  <a id="dlLink" class="btn">ダウンロード</a>
  <button id="dlText">テキストで共有</button>
  <button id="dlCopy">DXFをコピー</button>
  <button id="dlZip">zipで保存（中にDXF）</button>
  <button id="dlTxt">txtで保存</button>
  <button id="dlX">閉じる</button>
</div>
<div id="tools" hidden>
  <button id="modeB" title="タップで距離→面積→個数">距離</button>
  <span id="nameWrap" hidden>
    <input id="cname" type="text" placeholder="名前">
    <button type="button" id="catPlus" hidden title="新しい種類">＋</button>
  </span>
  <button id="snapCntB" hidden title="端点吸着のオン／オフ">吸着</button>
  <button id="sgB" hidden title="加算／減算（開口など）">加</button>
  <button id="okB">確定</button>
  <button id="recB">記入</button>
  <button id="undoB" title="一点ずつ戻す">戻す</button>
  <button id="redoB" title="一点ずつ進める">進む</button>
</div>
<div id="sets" hidden>
  <button id="snapB" class="on">吸着</button>
  <button id="calB">縮尺</button>
  <button id="thB" aria-label="ライト/ダーク切替"><svg viewBox="0 0 24 24"><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
</div>
<div id="main">
  <canvas id="c"></canvas><div id="badge"></div>
<div id="panel" hidden>
    <div class="pr">
      <label>図面上の測定値<input type="number" id="rawIn" inputmode="decimal" step="any"></label>
      <label>実際の寸法(mm)<input type="number" id="realIn" inputmode="decimal" step="any"></label>
    </div>
    <div class="pr"><button id="apB">補正を適用</button><button id="clB">補正解除</button></div>
    <div class="pr"><label style="flex-direction:row;align-items:center;gap:6px;min-height:44px"><input type="checkbox" id="rndC" checked>きりのいい係数に丸める</label><label style="flex-direction:row;align-items:center;gap:6px;min-height:44px"><input type="checkbox" id="intC" checked>補正後の距離を整数mmで表示</label></div>
    <div class="pr"><label style="flex-direction:row;align-items:center;gap:6px;min-height:44px"><input type="checkbox" id="bakeC" checked>保存時に補正を図形の座標へ反映する</label></div>
    <div id="calSt"></div>
    <div id="info">DXFファイルを開いてください。</div>
  </div>
  <div id="lp" hidden><div id="lhead"><span>一覧（もう一度「一覧」で閉じる）</span><button id="lCp">コピー</button></div><div id="lrows"></div><div id="lsum"></div></div>
</div>
<footer><div id="out">DXFファイルを開いてください</div></footer>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let R=[],SRC=null,pPts=[],pDone=false,ci=-1,ei=-1,asg=1,LT='',nmv={dist:'',area:'',cnt:''},RS={dist:[],area:[],cnt:[]},W=1,H=1,dpr=1,V={z:1,x:0,y:0},D=null,mode='',snapOn=true,dPts=[],aPts=[],aDone=false,hov=null,k=1,raf=0,curKey=null,theme='dark',lastM='',note='',calSrc=null,intMm=true;
/* ---------- DXFパーサ(自前・外部ライブラリなし) ---------- */
const clean=s=>s.replace(/\\U\+([0-9A-Fa-f]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16)))
 .replace(/\\P/g,'\n').replace(/\\S([^;]*);/g,(_,a)=>a.replace('^','/')).replace(/\\[ACFfHQTW][^;]*;/g,'')
 .replace(/\\[LlOoKk]/g,'').replace(/\\~/g,' ').replace(/[{}]/g,'').replace(/%%[cC]/g,'Ø').replace(/%%[dD]/g,'°').replace(/%%[pP]/g,'±');
function parse(t){
  const L=t.split(/\r?\n/),recs=[];let sec='',r=null,cb=null;
  for(let i=0;i+1<L.length;i+=2){
    const c=parseInt(L[i],10),v=L[i+1].trim();
    if(c===0){if(v==='ENDSEC')sec='';if(v==='ENDBLK')cb=null;r={t:v,g:[],sec,b:cb};recs.push(r)}
    else if(r){r.g.push([c,v]);if(c===2){if(r.t==='SECTION')sec=v;else if(r.t==='BLOCK'){cb=v;r.b=v}}}
  }
  const gv=(r,c)=>{for(const a of r.g)if(a[0]===c)return a[1]},gn=(r,c,d=0)=>{const v=gv(r,c);return v===undefined?d:parseFloat(v)};
  const top=[],blocks={},un={};let pl=null;
  for(const r of recs){
    const T=r.t;let o=null;
    if(T==='BLOCK'){blocks[r.b]={bx:gn(r,10),by:gn(r,20),e:[]};continue}
    if(r.sec!=='ENTITIES'&&r.sec!=='BLOCKS')continue;
    if(T==='ENDBLK'||T==='ENDSEC')continue;
    if(T==='SEQEND'){pl=null;continue}
    if(T==='VERTEX'){const f=gn(r,70);if(pl&&!(f&16)&&f<64)pl.p.push({x:gn(r,10),y:gn(r,20),b:gn(r,42)});continue}
    if(T==='LINE')o={t:'L',a:[gn(r,10),gn(r,20)],b:[gn(r,11),gn(r,21)]};
    else if(T==='LWPOLYLINE'){const p=[];for(const[k_,v]of r.g){if(k_===10)p.push({x:parseFloat(v),y:0,b:0});else if(k_===20&&p.length)p[p.length-1].y=parseFloat(v);else if(k_===42&&p.length)p[p.length-1].b=parseFloat(v)}o={t:'P',p,cl:(gn(r,70)&1)===1}}
    else if(T==='POLYLINE')pl=o={t:'P',p:[],cl:(gn(r,70)&1)===1};
    else if(T==='CIRCLE')o={t:'C',x:gn(r,10),y:gn(r,20),r:gn(r,40)};
    else if(T==='ARC')o={t:'A',x:gn(r,10),y:gn(r,20),r:gn(r,40),a0:gn(r,50),a1:gn(r,51)};
    else if(T==='TEXT'){let x=gn(r,10),y=gn(r,20),ha=gn(r,72);if((ha||gn(r,73))&&gv(r,11)!==undefined){x=gn(r,11);y=gn(r,21)}o={t:'T',x,y,h:gn(r,40),rot:gn(r,50)*Math.PI/180,ha:ha===1||ha===4?1:ha===2?2:0,va:-1,s:gv(r,1)||''}}
    else if(T==='MTEXT'){let s='';for(const[k_,v]of r.g)if(k_===3)s+=v;s+=gv(r,1)||'';const a=gn(r,71,1)-1,rot=gv(r,11)!==undefined?Math.atan2(gn(r,21),gn(r,11)):gn(r,50)*Math.PI/180;o={t:'T',x:gn(r,10),y:gn(r,20),h:gn(r,40),rot,ha:a%3,va:Math.floor(a/3),s}}
    else if(T==='INSERT')o={t:'I',n:gv(r,2),x:gn(r,10),y:gn(r,20),sx:gn(r,41,1),sy:gn(r,42,1),rot:gn(r,50)*Math.PI/180};
    else if(T==='DIMENSION')o={t:'I',n:gv(r,2),x:0,y:0,sx:1,sy:1,rot:0};
    else{un[T]=(un[T]||0)+1;continue}
    (r.sec==='BLOCKS'?(blocks[r.b]||{e:[]}).e:top).push(o);
  }
  /* 展開: 全図形を1つのPath2Dにまとめる(円・円弧・膨らみは折れ線化) */
  const path=new Path2D(),sn=[],xs=[],ys=[],txt=[];let nSeg=0;
  const tr=(M,x,y)=>[M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]];
  const cmp=(P,Q)=>[P[0]*Q[0]+P[2]*Q[1],P[1]*Q[0]+P[3]*Q[1],P[0]*Q[2]+P[2]*Q[3],P[1]*Q[2]+P[3]*Q[3],P[0]*Q[4]+P[2]*Q[5]+P[4],P[1]*Q[4]+P[3]*Q[5]+P[5]];
  function add(M,pp,cl,sp){
    pp.forEach((q,i)=>{const[x,y]=tr(M,q[0],q[1]);i?path.lineTo(x,y):path.moveTo(x,y);xs.push(x);ys.push(y)});
    if(cl)path.closePath();nSeg++;
    for(const q of sp){const[x,y]=tr(M,q[0],q[1]);sn.push(x,y)}
  }
  const arc=(cx,cy,r,a0,sw)=>{const n=Math.max(4,Math.ceil(Math.abs(sw)/(Math.PI/48))),o=[];for(let i=0;i<=n;i++){const a=a0+sw*i/n;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}return o};
  function expand(list,M,d){
    for(const o of list){
      if(o.t==='L')add(M,[o.a,o.b],false,[o.a,o.b]);
      else if(o.t==='P'&&o.p.length>1){
        const pp=[],n=o.p.length,m=o.cl?n:n-1;
        for(let i=0;i<m;i++){
          const p0=o.p[i],p1=o.p[(i+1)%n];pp.push([p0.x,p0.y]);
          if(p0.b){const dx=p1.x-p0.x,dy=p1.y-p0.y,dd=Math.hypot(dx,dy);if(dd>0){const b=p0.b,off=dd*(1-b*b)/(4*b),cx=(p0.x+p1.x)/2-dy/dd*off,cy=(p0.y+p1.y)/2+dx/dd*off,r=Math.hypot(p0.x-cx,p0.y-cy),a=arc(cx,cy,r,Math.atan2(p0.y-cy,p0.x-cx),4*Math.atan(b));pp.push(...a.slice(1,-1))}}
        }
        if(!o.cl){const l=o.p[n-1];pp.push([l.x,l.y])}
        add(M,pp,o.cl,o.p.map(p=>[p.x,p.y]));
      }
      else if(o.t==='C'&&o.r>0)add(M,arc(o.x,o.y,o.r,0,2*Math.PI),true,[]);
      else if(o.t==='A'&&o.r>0){const a0=o.a0*Math.PI/180;let sw=(((o.a1-o.a0)%360)+360)%360||360;sw*=Math.PI/180;const a=arc(o.x,o.y,o.r,a0,sw);add(M,a,false,[a[0],a[a.length-1]])}
      else if(o.t==='T'){
        const s=clean(o.s);if(!s.trim()||!(o.h>0))continue;
        const[x,y]=tr(M,o.x,o.y);xs.push(x);ys.push(y);
        txt.push({x,y,h:o.h*Math.hypot(M[0],M[1]),rot:o.rot+Math.atan2(M[1],M[0]),ha:o.ha,va:o.va,s,l:s.split('\n')});
      }
      else if(o.t==='I'&&d<4){
        const B=blocks[o.n];if(!B)continue;const c=Math.cos(o.rot),s=Math.sin(o.rot);
        const a=o.sx*c,b=o.sx*s,cc=-o.sy*s,dd=o.sy*c;
        expand(B.e,cmp(M,[a,b,cc,dd,o.x-(a*B.bx+cc*B.by),o.y-(b*B.bx+dd*B.by)]),d+1);
      }
    }
  }
  expand(top,[1,0,0,1,0,0],0);
  /* 全体表示用の範囲: 迷子の図形に引きずられないよう上下0.5%を除外 */
  let bnd=null;
  if(xs.length){
    const lim=a=>{const s=Float64Array.from(a).sort();if(s.length<200)return[s[0],s[s.length-1]];return[s[Math.floor(s.length*.005)],s[Math.ceil(s.length*.995)-1]]};
    const[x0,x1]=lim(xs),[y0,y1]=lim(ys);bnd=[x0,y0,x1,y1];
  }
  return{path,txt,sn:Float64Array.from(sn),bnd,nSeg,un};
}

/* ---------- 保存(使えない環境でも止まらない) ---------- */
const st={g(a){try{return localStorage.getItem(a)}catch(e){return null}},s(a,v){try{localStorage.setItem(a,v);return true}catch(e){return false}},d(a){try{localStorage.removeItem(a)}catch(e){}}};

/* ---------- テーマ ---------- */
// DXFの色・レイヤーは読んでいないため、線と文字はそれぞれ単色。色対応を足すときは、この配色表を土台にする。
const PAL={
  dark:{line:'#bcd7e0',text:'#f0c36a',meas:'#ff5d73',fill:'rgba(255,93,115,.28)',rec:'#5ee08a',snap:'#ffd23f',lb:'rgba(0,0,0,.75)',lf:'#fff'},
  light:{line:'#27343c',text:'#8a5300',meas:'#d4193c',fill:'rgba(212,25,60,.2)',rec:'#0a6e9a',snap:'#0a7a4f',lb:'rgba(255,255,255,.9)',lf:'#111'}};
const T=()=>PAL[theme];
function setTheme(t,save){theme=t;document.documentElement.dataset.theme=t;if(save)st.s('dxfv:theme',t);req()}
$('thB').onclick=()=>setTheme(theme==='dark'?'light':'dark',true);

/* ---------- ファイル読み込み(文字コード判定つき) ---------- */
/* zipの中のDXFを取り出す（このアプリが作るzipと、一般的なdeflate圧縮のzip） */
async function unzipDxf(buf){
  const v=new DataView(buf),u=new Uint8Array(buf);let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('zipとして読めません');

/* DXFテキストを加工: 追加図形をENTITIES末尾に挿入。bake時は既存図形の座標も×k */
function buildDxf(text,R,k,bake,intMm){

  const EX={CIRCLE:[40],ARC:[40],TEXT:[40],MTEXT:[40,41],LWPOLYLINE:[40,41,43],POLYLINE:[40,41],VERTEX:[40,41]};
  const num=x=>String(+x.toFixed(6)),skip={};let sec='',cur='',end=-1;

      if(xy||(EX[cur]||[]).includes(c)){const n=parseFloat(v);if(isFinite(n))L[i+1]=num(n*kk)}
    }

  const line=(a,b)=>{g(0,'LINE');g(100,'AcDbEntity');g(8,'0');g(100,'AcDbLine');g(10,num(a.x));g(20,num(a.y));g(30,0);g(11,num(b.x));g(21,num(b.y));g(31,0)};
  const txt=(x,y,h,s,deg)=>{g(0,'TEXT');g(100,'AcDbEntity');g(8,'0');g(100,'AcDbText');g(10,num(x));g(20,num(y));g(30,0);g(40,num(h));g(1,s);g(50,num(deg));g(72,1);g(11,num(x));g(21,num(y));g(31,0);g(100,'AcDbText');g(73,0)};
  for(const r of R){
    if(r.sel===false)continue;
    if(r.t==='d'){
      const a=P(r.a),b=P(r.b),h=r.h*kk,len=Math.hypot(b.x-a.x,b.y-a.y);if(!(len>0))continue;
      let ux=(b.x-a.x)/len,uy=(b.y-a.y)/len;line(a,b);
      const ar=(p,sx)=>{const s=h*.8,dx=ux*sx,dy=uy*sx;for(const q of[1,-1])line(p,{x:p.x+(dx*s)-q*dy*s*.3,y:p.y+(dy*s)+q*dx*s*.3})};ar(a,1);ar(b,-1);
      let ang=Math.atan2(uy,ux);if(ang>Math.PI/2+1e-9||ang<=-Math.PI/2+1e-9){ang+=Math.PI;ux=-ux;uy=-uy}
      const dv=bake?len:len*k;
      txt((a.x+b.x)/2-uy*h*.9,(a.y+b.y)/2+ux*h*.9,h,nl(r,k!==1&&intMm?fmt(Math.round(dv),0):fmt(dv)),ang*180/Math.PI);
    }else if(r.t==='p'){
      const p=r.p.map(P),h=r.h*kk;if(p.length<2)continue;
      g(0,'LWPOLYLINE');g(100,'AcDbEntity');g(8,'0');g(100,'AcDbPolyline');g(90,p.length);g(70,0);p.forEach(q=>{g(10,num(q.x));g(20,num(q.y))});
      const tot=plen(p),a=p[p.length-2],b=p[p.length-1],len=Math.hypot(b.x-a.x,b.y-a.y)||1;let ux=(b.x-a.x)/len,uy=(b.y-a.y)/len,ang=Math.atan2(uy,ux);
      if(ang>Math.PI/2+1e-9||ang<=-Math.PI/2+1e-9){ang+=Math.PI;ux=-ux;uy=-uy}

      txt((a.x+b.x)/2-uy*h*.9,(a.y+b.y)/2+ux*h*.9,h,nl(r,k!==1&&intMm?fmt(Math.round(dv),0):fmt(dv)),ang*180/Math.PI);

      const h=r.h*kk;r.pts.forEach((q0,j)=>{const q=P(q0);g(0,'CIRCLE');g(100,'AcDbEntity');g(8,'0');g(100,'AcDbCircle');g(10,num(q.x));g(20,num(q.y));g(30,0);g(40,num(h*.6));txt(q.x+h*.8,q.y+h*.3,h,(r.name||'')+' · '+(j+1),0)});

      const p=r.p.map(P),h=r.h*kk;
      g(0,'LWPOLYLINE');g(100,'AcDbEntity');g(8,'0');g(100,'AcDbPolyline');g(90,p.length);g(70,1);p.forEach(q=>{g(10,num(q.x));g(20,num(q.y))});

}
let sjisMap=null;

}

/* 共有シートへ送る。iOSのSafari系は .dxf の型を共有不可とすることがあるため、型を変えて順に試す */
async function tryShare(blob,name){
  if(!navigator.share||!navigator.canShare)return false;
  for(const type of['application/octet-stream','text/plain']){
    const f=new File([blob],name,{type});
    if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true}
  }
  return false;
}

  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nb.length,true);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nb.length,true);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,1,true);eo.setUint16(10,1,true);eo.setUint32(12,46+nb.length,true);eo.setUint32(16,30+nb.length+n,true);
  return new Blob([lh,nb,data,ch,nb,eo],{type:'application/zip'});
}
async function dlSave(kind){
  if(!LASTOUT||!DLCAP)return false;
  const base=LASTOUT.name.replace(/\.dxf$/i,'');
  try{
    const bytes=new Uint8Array(await LASTOUT.blob.arrayBuffer());
    const data=kind==='zip'?zipOne(LASTOUT.name,bytes):new Blob([bytes],{type:'text/plain'});
    const fn=kind==='zip'?base+'.zip':LASTOUT.name+'.txt';
    await DLCAP.save({filename:fn,data});
    upd(kind==='zip'?'zipを保存しました。ファイルアプリでzipをタップすると '+LASTOUT.name+' が出ます':'txtで保存しました。拡張子を .dxf に直すとDXFとして使えます: '+LASTOUT.name);
    return true;
  }catch(e){upd(e&&e.code==='declined'?'保存をやめました':'保存できませんでした: '+(e&&e.message||e));return true}
}
$('dlTxt').onclick=()=>dlSave('txt');$('dlZip').onclick=()=>dlSave('zip');
$('dlText').onclick=async()=>{if(!LASTTEXT)return;try{await navigator.share({title:LASTOUT.name,text:LASTTEXT});upd('テキストで共有しました。保存後、ファイル名の拡張子を .dxf に変更してください')}catch(e){if(!(e&&e.name==='AbortError'))upd('テキスト共有もできませんでした。「DXFをコピー」を使ってください')}};
$('dlCopy').onclick=async()=>{try{await navigator.clipboard.writeText(LASTTEXT);upd('DXFの中身をコピーしました。メモ等に貼り付け、拡張子 .dxf で保存してください')}catch(e){upd('コピーできませんでした')}};
$('shB').onclick=()=>{closeSaveAs();SHAREONLY=true;saveDxf(false)};
async function capFallback(name,tail){
  SRC.name=name;closeFileBar();
  showDl('このブラウザでは.dxfを直接保存できないため、zip（中にDXF）で保存します: '+name+'（記入'+R.length+'件）'+tail+'\n（このビューアの「開く」でzipをそのまま読み込めます）');
  return await dlSave('zip')?'ok':'dl';
}
async function putFile(blob,name,asNew,tail){
  LASTOUT={blob,name};hideDl();
  if(SHAREONLY){
    SHAREONLY=false;
    try{if(await tryShare(blob,name)){upd('共有シートで「ファイルに保存」を選んでください: '+name+tail);closeFileBar();return 'ok'}}
    catch(e){if(e&&e.name==='AbortError'){upd('共有をキャンセルしました');return 'cancel'}}
    if(DLCAP){SHAREONLY=false;return await capFallback(name,tail)}
    showDl('このブラウザではファイル共有が使えません。下のいずれかを試してください\nファイル: '+name);
    upd('ファイル共有は使えませんでした。表示された別の方法を試してください');closeFileBar();return 'dl';
  }
  try{
    if(!asNew&&SRC.handle){
      const w=await SRC.handle.createWritable();await w.write(blob);await w.close();
      SRC.name=name;upd('上書き保存しました: '+name+tail);closeFileBar();return 'ok';
    }
    if(FSAPI){
      const h=await showSaveFilePicker({suggestedName:name,types:[{description:'DXF',accept:{'application/octet-stream':['.dxf']}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();
      SRC.handle=h;SRC.name=h.name||name;upd((asNew?'名前を付けて保存しました: ':'保存しました: ')+SRC.name+tail);closeFileBar();return 'ok';
    }
    if(await tryShare(blob,name)){
      SRC.name=name;
      upd('共有シートで「ファイルに保存」を選ぶと保存されます: '+name+'\n（同名ファイルがあれば「置き換える」で上書き）'+tail);
      closeFileBar();return 'ok';
    }
  }catch(e){
    if(e&&e.name==='AbortError'){upd('保存をキャンセルしました');return 'cancel'}
  }
  if(DLCAP)return await capFallback(name,tail);
  // 共有もファイル保存APIも使えない場合: 手動で押せるボタンを出す（自動DLは端末によって無視されるため）
  showDl('保存用ファイル: '+name+'（記入'+R.length+'件）\n下のボタンを押して保存してください');
  upd('自動保存できませんでした。上の「共有」または「ダウンロード」ボタンを押してください: '+name+tail);
  closeFileBar();return 'dl';
}
async function saveDxf(asNew,forcedName){
  if(!SRC){upd('先にDXFを開いてください');return}
  const bake=k!==1&&$('bakeC').checked;
  if(!R.length&&!bake){upd('保存する内容がありません（記入なし・補正の反映なし）');return}
  let r;try{r=buildDxf(SRC.text,R,k,bake,intMm)}catch(e){upd('保存エラー: '+e.message);return}
  const name=cleanName(forcedName,bakeName(asNew));
  const bytes=encOut(r.text,SRC.sjis);
  const blob=new Blob([bytes],{type:'application/octet-stream'});
  const sk=Object.entries(r.skip).map(([a,b])=>a+'×'+b).join(', ');
  const tail=`（記入${R.length}件${bake?'、補正×'+fk(k)+'を座標に反映':''}）`+(bake?'\n※補正後DXFを開き直すときは縮尺補正は不要です':'')+(bake&&sk?'\n⚠ 補正されない図形あり: '+sk:'');
  LASTTEXT=r.text;
  const out=await putFile(blob,name,asNew,tail);
  if(out==='ok'||out==='dl')SRC.name=name;
}
$('ovB').onclick=()=>{closeSaveAs();hideDl();saveDxf(false)};
if(!FSAPI){$('ovB').textContent='保存';$('ovB').title='今のファイル名で保存（iPhoneは共有シートから「ファイルに保存」）'}
$('saB').onclick=()=>{
  if(!SRC){upd('先にDXFを開いてください');return}
  $('saveAsName').value=bakeName(true);$('saveAsBar').hidden=false;$('fileBar').hidden=false;$('fileB').classList.add('on');
  setTimeout(()=>{try{$('saveAsName').focus();$('saveAsName').select()}catch(_){}},50);
};
$('saveAsX').onclick=()=>{closeSaveAs();upd('名前を付けて保存をやめた')};
$('saveAsGo').onclick=()=>{const n=$('saveAsName').value;closeSaveAs();hideDl();saveDxf(true,n)};
$('saveAsName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('saveAsGo').click()}};

/* ---------- 入力: Pointer Eventsに一本化(マウス・タッチ二重反応なし) ---------- */
const P=new Map();let g={};
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
function zoomAt(sx,sy,f){const wx=(sx-V.x)/V.z,wy=(V.y-sy)/V.z,z=clampZ(V.z*f);V.z=z;V.x=sx-wx*z;V.y=sy+wy*z;req()}
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  // 名前欄フォーカス中でもキャンバス操作できるようにする（ピンチ用の他指は消さない）
  const ae=document.activeElement;if(ae&&ae!==cv&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))ae.blur();
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const p=pos(e);P.set(e.pointerId,p);
  if(P.size===1){
    g={multi:false,moved:false,x0:p.x,y0:p.y,touch:e.pointerType!=='mouse'};
    if(mode&&snapOn&&g.touch){hov=near(p.x,p.y,26);req()}
  }else{g.multi=true;g.moved=true;hov=null;const[a,b]=[...P.values()];g.pd=Math.hypot(a.x-b.x,a.y-b.y);g.mx=(a.x+b.x)/2;g.my=(a.y+b.y)/2}
});
cv.addEventListener('pointermove',e=>{
  const p=pos(e),old=P.get(e.pointerId);
  if(!old){if(mode&&snapOn&&e.pointerType==='mouse'){hov=near(p.x,p.y,14);req()}return}
  P.set(e.pointerId,p);
  if(P.size===1){
    if(!g.moved&&Math.hypot(p.x-g.x0,p.y-g.y0)>(g.touch?9:5)){g.moved=true;hov=null}
    if(g.moved){V.x+=p.x-old.x;V.y+=p.y-old.y;req()}
  }else if(P.size===2){
    const[a,b]=[...P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(g.pd>0){const wx=(g.mx-V.x)/V.z,wy=(V.y-g.my)/V.z,z=clampZ(V.z*d/g.pd);V.z=z;V.x=mx-wx*z;V.y=my+wy*z;req()}
    g.pd=d;g.mx=mx;g.my=my;
  }
});
const endP=(e,ok)=>{
  if(!P.has(e.pointerId))return;
  if(ok&&P.size===1&&!g.multi&&!g.moved&&mode)tap(g.x0,g.y0,g.touch);
  else if(hov){hov=null;req()}
  P.delete(e.pointerId);if(P.size===1)g.moved=true;
};
cv.addEventListener('pointerup',e=>endP(e,true));
cv.addEventListener('pointercancel',e=>endP(e,false));
cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);zoomAt(p.x,p.y,Math.exp(-Math.max(-100,Math.min(100,e.deltaY))*.0015))},{passive:false});

/* ---------- 起動 ---------- */
{const t=st.g('dxfv:theme');theme=t==='light'||t==='dark'?t:(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');setTheme(theme,false)}
upd();
