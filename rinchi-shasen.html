<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>斜線制限電卓</title>
<meta name="description" content="高さ制限の練習用電卓。">
<meta name="tool-tag" content="建築">
<style>:root{--bg:#000;--text:#fff;--muted:#86868b;--key:#333336;--op:#ff9f0a;--fn:#a5a5a5;--hint:#38bdf8;--card:#1c1c1e;}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.app{max-width:400px;margin:0 auto;padding:24px 16px calc(120px + env(safe-area-inset-bottom,0px))}.sub{min-height:18px;font-size:16px;color:var(--muted);text-align:right;padding:0 8px;font-variant-numeric:tabular-nums}.disp-row{display:flex;align-items:center;gap:8px;min-height:72px;padding:0 0 8px}.icon{width:36px;height:36px;flex-shrink:0;border-radius:18px;background:#2c2c2e;color:#fff;display:grid;place-items:center;padding:0}.icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8}.icon.on{background:#3a3a3c}.disp{flex:1;font-size:56px;font-weight:300;text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;word-break:break-all;line-height:1}.stage{position:relative}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{appearance:none;border:0;border-radius:50%;aspect-ratio:1;width:100%;height:auto;font:inherit;font-size:28px;color:#fff;background:var(--key);cursor:pointer;line-height:1}button:active{filter:brightness(1.35)}.fn{background:var(--fn);color:#000;font-size:20px}.op{background:var(--op)}.op.on{background:#fff;color:var(--op)}.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;position:sticky;top:0;z-index:8;background:var(--bg);padding:8px 0 6px}.wide{width:100%;aspect-ratio:auto;height:52px;border-radius:12px;background:#1c1c1e;color:var(--hint);font-size:15px;font-weight:700}.wide.on{background:#0c4a6e;color:#fff}.sheet{display:none;margin-top:10px;background:var(--card);border-radius:12px;padding:10px 12px 12px;font-size:13px;line-height:1.6;color:#e5e5ea}.sheet.show{display:block}.sheet-stick{position:sticky;top:0;z-index:7;display:grid;grid-template-columns:1fr 36px;gap:6px;align-items:center;background:var(--card);padding:2px 0 8px}.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0}.sheet-x{aspect-ratio:1;width:36px;height:36px;border-radius:18px;background:#3a3a3c;color:#fff;font-size:22px;line-height:1;padding:0}.hint-float{display:none;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;aspect-ratio:1;border-radius:24px;background:#0c4a6e;color:#fff;font-size:26px;line-height:1}.hint-float.show{display:grid;place-items:center}.chip{aspect-ratio:auto;width:100%;height:32px;border-radius:8px;background:#2c2c2e;color:#fff;font-size:12px;font-weight:700}.chip.on{background:#0c4a6e;color:#7dd3fc}.panel{display:none}.panel.on{display:block}.panel h3{margin:0 0 6px;font-size:13px;color:var(--hint);font-weight:700}.panel h4{margin:12px 0 4px;font-size:12px;color:#fff;font-weight:700}.panel p{margin:0 0 8px}.law{color:var(--muted);font-size:11px}.box{background:#111;border-radius:8px;padding:8px 10px;margin:0 0 8px;font-variant-numeric:tabular-nums}.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;margin:0 0 8px}.exgrid label{display:block;font-size:11px;color:var(--muted);margin:0 0 2px}.exgrid input[readonly]{color:#7dd3fc}.exgrid input,.exgrid select{width:100%;height:34px;border:0;border-radius:8px;background:#2c2c2e;color:#fff;font:inherit;font-size:15px;padding:0 8px}.exrow{display:flex;align-items:center;gap:4px}.exx{flex-shrink:0;width:28px;height:28px;border-radius:14px;background:#3a3a3c;color:#fff;font-size:16px;padding:0}.jud-ok{color:#7dd3fc;font-weight:700}.jud-ng{color:#ff453a;font-weight:700}table.ht{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 8px}table.ht th,table.ht td{border-bottom:1px solid #2c2c2e;padding:4px 2px;text-align:left}table.ht th{color:var(--muted)}.overlay{display:none;position:absolute;left:-16px;right:-16px;top:0;bottom:0;background:#1c1c1e;border-radius:16px;z-index:5;flex-direction:column;overflow:hidden}.overlay.show{display:flex}.ov-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 6px}.ov-top button{aspect-ratio:auto;width:auto;height:34px;border-radius:17px;padding:0 14px;font-size:15px;background:#2c2c2e;color:#fff}.ov-list{overflow:auto;padding:4px 16px 20px}.day{color:var(--muted);font-size:13px;margin:10px 0 4px}.row{display:flex;align-items:center;gap:10px;width:100%;aspect-ratio:auto;height:auto;border-radius:0;padding:12px 0;background:transparent;border-bottom:1px solid #2c2c2e;text-align:right}.row .txt{flex:1}.row .ex{display:block;font-size:15px;color:var(--muted)}.row .rs{display:block;font-size:28px;font-weight:300}.del{display:none;width:26px;height:26px;border-radius:13px;background:#ff453a;font-size:18px}.overlay.edit .del{display:grid}.empty{color:var(--muted);text-align:center;padding:40px 8px}.clearall{display:none;margin:16px auto 0;aspect-ratio:auto;width:auto;height:36px;border-radius:18px;padding:0 16px;background:#2c2c2e;color:#ff453a}.overlay.edit .clearall{display:block}</style>
</head>
<body>
<div class="app">
<div class="sub" id="sub"></div>
<div class="disp-row">
<button type="button" class="icon" id="clock" data-k="hist" aria-label="履歴"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 1.5"/></svg></button>
<div class="disp" id="disp">0</div>
</div>
<div class="stage">
<div class="pad" id="pad">
<button type="button" class="fn" data-k="bs">⌫</button>
<button type="button" class="fn" data-k="ac">AC</button>
<button type="button" class="fn" data-k="pct">%</button>
<button type="button" class="op" data-k="/">÷</button>
<button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
<button type="button" class="op" data-k="*">×</button>
<button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
<button type="button" class="op" data-k="-">−</button>
<button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
<button type="button" class="op" data-k="+">＋</button>
<button type="button" class="fn" data-k="pm">+/−</button>
<button type="button" data-k="0">0</button><button type="button" data-k=".">.</button>
<button type="button" class="op" data-k="=">＝</button>
</div>
<div class="overlay" id="overlay"><div class="ov-top"><button type="button" id="editBtn" data-k="hedit">編集</button><button type="button" class="x" data-k="closehist">×</button></div><div class="ov-list" id="histList"></div></div>
</div>
<div class="bar"><button type="button" class="wide" id="histBtn" data-k="hist">履歴</button><button type="button" class="wide" id="hintBtn" data-k="hint">ヒント</button></div>
<div class="sheet" id="sheet">
<div class="sheet-stick"><div class="chips"><button type="button" class="chip on" data-tab="road">道路</button><button type="button" class="chip" data-tab="adj">隣地</button><button type="button" class="chip" data-tab="north">北側</button><button type="button" class="chip" data-tab="h">共通</button></div><button type="button" class="sheet-x" data-k="hint">×</button></div>
<button type="button" class="hint-float" id="hintFloat" data-k="hint">×</button>
<div class="panel on" id="tab-road"><h3>道路斜線　法56条1項1号</h3><h4>公式</h4><div class="box">制限高さ ＝（最小後退 ＋ 幅員 ＋ 測る点までの水平距離）× 勾配<br>住居系 1.25　／　商業・工業 1.5</div><h4>図面に書く例</h4><div class="exgrid"><div><label>柱幅 mm</label><select id="exCol"><option value="600">600 mm</option><option value="650" selected>650 mm</option><option value="700">700 mm</option><option value="750">750 mm</option><option value="800">800 mm</option><option value="850">850 mm</option></select></div><div><label>柱芯までの距離 m</label><div class="exrow"><input id="exCore" type="text" inputmode="decimal" value="4"><button type="button" class="exx" data-exclear="exCore">×</button></div></div><div><label>最小後退 m</label><div class="exrow"><input id="exSet" type="text" inputmode="decimal" value="3"><button type="button" class="exx" data-exclear="exSet">×</button></div></div><div><label>道路幅員 m</label><div class="exrow"><input id="exW" type="text" inputmode="decimal" value="12"><button type="button" class="exx" data-exclear="exW">×</button></div></div><div><label>計画高さ m</label><div class="exrow"><input id="exH" type="text" inputmode="decimal" value="12.8"><button type="button" class="exx" data-exclear="exH">×</button></div></div><div><label>勾配</label><select id="exK"><option value="1.25" selected>1.25</option><option value="1.5">1.5</option></select></div></div><div class="box" id="exOut"></div><p id="exNote"></p><h4>逆算</h4><div class="box" id="exRev"></div></div>
<div class="panel" id="tab-adj"><h3>隣地斜線　法56条1項2号</h3><h4>公式</h4><div class="box">住居系　20 ＋ 1.25×(2A)<br>商業・工業　31 ＋ 2.5×(2A)</div><h4>図面に書く例</h4><div class="exgrid"><div><label>柱幅 mm</label><select id="adjCol"><option value="600">600 mm</option><option value="650" selected>650 mm</option><option value="700">700 mm</option><option value="750">750 mm</option><option value="800">800 mm</option><option value="850">850 mm</option></select></div><div><label>柱芯までの距離 m</label><div class="exrow"><input id="adjCore" type="text" inputmode="decimal" value="4"><button type="button" class="exx" data-exclear="adjCore">×</button></div></div><div><label>立ち上がり</label><select id="adjRise"><option value="20" selected>20 m 住居系 1.25</option><option value="31">31 m 商業・工業 2.5</option></select></div><div><label>勾配</label><input id="adjK" type="text" value="1.25" readonly></div><div><label>計画高さ m</label><div class="exrow"><input id="adjH" type="text" inputmode="decimal" value="21.8"><button type="button" class="exx" data-exclear="adjH">×</button></div></div></div><div class="box" id="adjOut"></div><p id="adjNote"></p><h4>逆算</h4><div class="box" id="adjRev"></div></div>
<div class="panel" id="tab-north"><h3>北側斜線　法56条1項3号</h3><h4>公式</h4><div class="box">低層・田園　5 ＋ 1.25×真北距離<br>一中高・二中高　10 ＋ 1.25×真北距離</div><h4>図面に書く例</h4><div class="exgrid"><div><label>柱幅 mm</label><select id="nCol"><option value="600">600 mm</option><option value="650" selected>650 mm</option><option value="700">700 mm</option><option value="750">750 mm</option><option value="800">800 mm</option><option value="850">850 mm</option></select></div><div><label>柱芯までの距離 m</label><div class="exrow"><input id="nCore" type="text" inputmode="decimal" value="4"><button type="button" class="exx" data-exclear="nCore">×</button></div></div><div><label>立ち上がり m</label><select id="nRise"><option value="5">5 低層・田園</option><option value="10" selected>10 一中高・二中高</option></select></div><div><label>計画高さ m</label><div class="exrow"><input id="nH" type="text" inputmode="decimal" value="13.7"><button type="button" class="exx" data-exclear="nH">×</button></div></div></div><div class="box" id="nOut"></div><p id="nNote"></p><h4>逆算</h4><div class="box" id="nRev"></div></div>
<div class="panel" id="tab-h"><h3>共通</h3><p>道路斜線＝路面の中心。隣地・北側＝地盤面。</p></div>
<button type="button" class="wide on" id="hintCloseBottom" data-k="hint" style="margin-top:12px">ヒントを閉じる</button>
</div>
</div>
<script src="rinchi-shasen.js"></script>
</body></html>
