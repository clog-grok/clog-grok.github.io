<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>斜線制限</title>
<meta name="description" content="道路・隣地・北側。芯と柱は常に見える。Safariで開く。">
<meta name="tool-tag" content="建築">
<style>
  :root {
    --bg: #0b1220; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
    --warn: #fb7185; --ok: #34d399; --line: #334155; --key: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  .app {
    height: 100%; height: 100dvh; max-width: 430px; margin: 0 auto;
    display: flex; flex-direction: column;
    padding: calc(6px + env(safe-area-inset-top)) 8px calc(6px + env(safe-area-inset-bottom));
  }
  .row3, .row4, .vals, .keys { display: grid; gap: 6px; }
  .row3 { grid-template-columns: 1fr 1fr 1fr; }
  .row4 { grid-template-columns: 1fr 1fr 1fr 1fr; margin-top: 6px; }
  button {
    appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--muted); border-radius: 8px; font: inherit; cursor: pointer;
  }
  .chip { min-height: 34px; font-size: 13px; padding: 0 2px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .result {
    flex: 0 0 auto; background: #0f172a; border: 2px solid var(--accent);
    border-radius: 10px; padding: 6px 10px 8px; margin: 6px 0;
  }
  .result.warn { border-color: var(--warn); }
  .result-k { font-size: 11px; color: var(--muted); }
  .result-h {
    font-size: 30px; font-weight: 800; text-align: right;
    font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--accent);
  }
  .result-f { font-size: 11px; color: var(--muted); text-align: right; margin-top: 3px; }
  .vals { grid-template-columns: 1fr 1fr 1fr; flex: 0 0 auto; }
  .field, .face {
    min-height: 52px; padding: 4px 8px; text-align: left;
    background: #0f172a; display: flex; flex-direction: column; justify-content: center;
  }
  .field.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,.28); }
  .field span, .face span { font-size: 10px; color: var(--muted); }
  .field b, .face b { font-size: 18px; font-variant-numeric: tabular-nums; color: var(--accent); line-height: 1.2; }
  .face { border-style: dashed; }
  .face b { color: #fff; }
  .more { font-size: 12px; color: var(--muted); min-height: 28px; border: 0; text-align: left; }
  .keys { flex: 1 1 auto; grid-template-columns: repeat(3, 1fr); margin-top: 4px; min-height: 0; }
  .key { background: var(--key); border: 0; color: #fff; font-size: 22px; font-weight: 700; border-radius: 10px; min-height: 0; }
  .key:active { background: #0ea5e9; }
  .key.fn { font-size: 14px; color: var(--warn); }
  .key.go { font-size: 14px; color: var(--ok); }
  .mask {
    display: none; position: fixed; inset: 0; background: rgba(2,6,23,.82);
    z-index: 20; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  }
  .mask.open { display: flex; align-items: flex-end; }
  .sheet {
    width: 100%; max-width: 430px; margin: 0 auto; background: #0f172a;
    border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex;
    flex-direction: column; gap: 8px;
  }
  .tog { text-align: left; padding: 10px; font-size: 14px; color: var(--text); }
  .tog.on { border-color: var(--accent); color: #fff; background: rgba(56,189,248,.15); }
  .close { min-height: 44px; background: var(--accent); border: 0; color: #fff; font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <div class="row3" id="kinds">
    <button type="button" class="chip" data-kind="road">道路</button>
    <button type="button" class="chip on" data-kind="adj">隣地</button>
    <button type="button" class="chip" data-kind="north">北側</button>
  </div>
  <div class="row4" id="zones">
    <button type="button" class="chip on" data-zone="ju">住居系</button>
    <button type="button" class="chip" data-zone="sho">商業工業</button>
    <button type="button" class="chip" data-zone="low">低層</button>
    <button type="button" class="chip" data-zone="none">指定なし</button>
  </div>
  <div class="result" id="box">
    <div class="result-k" id="kicker">隣地斜線の高さ</div>
    <div class="result-h" id="h">24.563m</div>
    <div class="result-f" id="formula">20 + 1.25 × 3.650 = 24.563m</div>
  </div>
  <div class="vals">
    <button type="button" class="field on" id="f-core" data-f="core"><span>通り芯</span><b id="v-core">4.00m</b></button>
    <button type="button" class="field" id="f-col" data-f="col"><span>柱成</span><b id="v-col">700mm</b></button>
    <button type="button" class="field" id="f-w" data-f="w" hidden><span>幅員W</span><b id="v-w">6.00m</b></button>
    <div class="face" id="faceBox"><span>外面 a</span><b id="v-face">3.650m</b></div>
  </div>
  <button type="button" class="more" id="moreBtn">緩和を開く</button>
  <div class="keys" id="keys">
    <button type="button" class="key" data-k="7">7</button>
    <button type="button" class="key" data-k="8">8</button>
    <button type="button" class="key" data-k="9">9</button>
    <button type="button" class="key" data-k="4">4</button>
    <button type="button" class="key" data-k="5">5</button>
    <button type="button" class="key" data-k="6">6</button>
    <button type="button" class="key" data-k="1">1</button>
    <button type="button" class="key" data-k="2">2</button>
    <button type="button" class="key" data-k="3">3</button>
    <button type="button" class="key" data-k=".">・</button>
    <button type="button" class="key" data-k="0">0</button>
    <button type="button" class="key fn" data-k="bs">削る</button>
    <button type="button" class="key fn" data-k="c">消す</button>
    <button type="button" class="key fn" data-k="reset">初期</button>
    <button type="button" class="key go" data-k="next">隣へ</button>
  </div>
</div>
<div class="mask" id="mask">
  <div class="sheet" id="sheet">
    <button type="button" class="tog" data-t="water">水面・水路を幅の1/2外側に足す</button>
    <button type="button" class="tog" data-t="delta">高低差緩和（1m以上）</button>
    <button type="button" class="tog" data-t="nichi" id="togNichi" hidden>中高層で日影あり（北側なし）</button>
    <button type="button" class="tog" data-t="none31" id="togNone" hidden>31m + 2.5 / 勾配1.5</button>
    <div class="vals" id="extra" style="grid-template-columns:1fr 1fr"></div>
    <button type="button" class="close" id="closeBtn">閉じる</button>
  </div>
</div>
<script>
const S = {
  kind: "adj", zone: "ju", none31: false, active: "core", fresh: true,
  flags: { water: false, delta: false, nichi: false },
  buf: { core: "4.00", col: "700", w: "6.00", water: "4.00", delta: "2.00" }
};
function n(k) { var v = parseFloat(S.buf[k]); return isFinite(v) ? v : 0; }
function face() { return n("core") - n("col") / 2000; }
function param() {
  if (S.kind === "road") {
    var k = (S.zone === "sho" || (S.zone === "none" && S.none31)) ? 1.5 : 1.25;
    return { h0: 0, k: k };
  }
  if (S.kind === "north") {
    if (S.zone === "low") return { h0: 5, k: 1.25 };
    if (S.zone === "ju") return { h0: 10, k: 1.25 };
    return null;
  }
  if (S.zone === "low") return { abs: true };
  if (S.zone === "sho" || (S.zone === "none" && S.none31)) return { h0: 31, k: 2.5 };
  return { h0: 20, k: 1.25 };
}
function aEff() { var a = face(); if (S.flags.water) a += n("water") / 2; return a; }
function cycle() {
  var list = ["core", "col"];
  if (S.kind === "road") list.push("w");
  var i = list.indexOf(S.active);
  if (i < 0) i = 0;
  S.active = list[(i + 1) % list.length];
  S.fresh = true;
}
function calc() {
  var p = param();
  if (!p) return { ok: false, text: "この用途に北側はない", sub: "住居系か低層だけ" };
  if (p.abs) return { ok: false, text: "隣地斜線なし", sub: "絶対高さ 10m または 12m" };
  if (S.kind === "north" && S.zone === "ju" && S.flags.nichi) return { ok: false, text: "北側なし", sub: "日影規制がある中高層" };
  var a0 = face();
  if (a0 < 0) return { ok: false, text: "外面が負", sub: "柱半分が芯より大きい" };
  if (a0 > 80) return { ok: false, text: "距離が大きすぎる", sub: "芯は 0〜80m" };
  var a = aEff();
  var H, f;
  if (S.kind === "road") {
    var L = n("w") + a;
    H = L * p.k;
    if (S.flags.delta && n("delta") >= 1) H = H - (n("delta") + 1) / 2;
    f = "(" + n("w").toFixed(2) + " + " + a.toFixed(3) + ") × " + p.k;
  } else {
    H = p.h0 + p.k * a;
    if (S.flags.delta && n("delta") >= 1) H += (n("delta") - 1) / 2;
    f = p.h0 + " + " + p.k + " × " + a.toFixed(3);
  }
  if (H < 0 || H > 300) return { ok: false, text: "高さ範囲外", sub: f };
  return { ok: true, H: H, f: f + " = " + H.toFixed(3) + "m" };
}
function paint() {
  document.querySelectorAll("#kinds .chip").forEach(function(b){ b.classList.toggle("on", b.dataset.kind === S.kind); });
  document.querySelectorAll("#zones .chip").forEach(function(b){ b.classList.toggle("on", b.dataset.zone === S.zone); });
  document.getElementById("f-core").classList.toggle("on", S.active === "core");
  document.getElementById("f-col").classList.toggle("on", S.active === "col");
  document.getElementById("f-w").classList.toggle("on", S.active === "w");
  document.getElementById("f-w").hidden = S.kind !== "road";
  document.getElementById("faceBox").style.display = S.kind === "road" ? "none" : "flex";
  document.getElementById("v-core").textContent = S.buf.core + "m";
  document.getElementById("v-col").textContent = S.buf.col + "mm";
  document.getElementById("v-w").textContent = S.buf.w + "m";
  document.getElementById("v-face").textContent = face().toFixed(3) + "m";
  document.getElementById("togNichi").hidden = !(S.kind === "north" && S.zone === "ju");
  document.getElementById("togNone").hidden = S.zone !== "none";
  document.getElementById("togNone").textContent = S.kind === "road" ? "勾配を1.5にする" : "31m + 2.5にする";
  document.querySelectorAll("#sheet .tog").forEach(function(b){
    var id = b.dataset.t;
    b.classList.toggle("on", id === "none31" ? S.none31 : !!S.flags[id]);
  });
  var extra = document.getElementById("extra");
  extra.innerHTML = "";
  if (S.flags.water) extra.innerHTML += '<button type="button" class="field'+(S.active==="water"?" on":"")+'" data-f="water"><span>水面の幅</span><b>'+S.buf.water+'m</b></button>';
  if (S.flags.delta) extra.innerHTML += '<button type="button" class="field'+(S.active==="delta"?" on":"")+'" data-f="delta"><span>高低差</span><b>'+S.buf.delta+'m</b></button>';
  var r = calc();
  document.getElementById("box").classList.toggle("warn", !r.ok);
  document.getElementById("kicker").textContent = S.kind === "road" ? "道路斜線の高さ（路面中心）" : S.kind === "north" ? "北側斜線の高さ" : "隣地斜線の高さ";
  document.getElementById("h").textContent = r.ok ? r.H.toFixed(3) + "m" : r.text;
  document.getElementById("formula").textContent = r.ok ? r.f : (r.sub || "");
}
function type(k) {
  if (k === "next") { cycle(); paint(); return; }
  if (k === "reset") {
    S.buf = { core: "4.00", col: "700", w: "6.00", water: "4.00", delta: "2.00" };
    S.active = "core"; S.fresh = true; paint(); return;
  }
  var allowed = {core:1,col:1,w:1,water:1,delta:1};
  if (!allowed[S.active]) S.active = "core";
  var v = S.buf[S.active] || "0";
  if (S.fresh && /[0-9]/.test(k)) { v = ""; S.fresh = false; }
  if (k === "c") v = "0";
  else if (k === "bs") v = String(v).slice(0, -1);
  else if (k === ".") {
    if (S.active === "col") return;
    if (String(v).indexOf(".") < 0) v = (v === "" ? "0." : v + ".");
  } else if (/^[0-9]$/.test(k)) {
    v = (v === "0" ? k : String(v) + k);
  }
  if (v === "" || v === "-") v = "0";
  if ((String(v).match(/\d/g) || []).length > 4) return;
  S.buf[S.active] = v;
  paint();
}
document.getElementById("kinds").addEventListener("click", function(e) {
  var b = e.target.closest("[data-kind]"); if (!b) return;
  S.kind = b.dataset.kind; S.active = "core"; S.fresh = true; paint();
});
document.getElementById("zones").addEventListener("click", function(e) {
  var b = e.target.closest("[data-zone]"); if (!b) return;
  S.zone = b.dataset.zone; paint();
});
document.querySelector(".vals").addEventListener("click", function(e) {
  var b = e.target.closest("[data-f]"); if (!b) return;
  S.active = b.dataset.f; S.fresh = true; paint();
});
document.getElementById("extra").addEventListener("click", function(e) {
  var b = e.target.closest("[data-f]"); if (!b) return;
  S.active = b.dataset.f; S.fresh = true; paint();
});
document.getElementById("moreBtn").addEventListener("click", function() {
  document.getElementById("mask").classList.add("open");
});
document.getElementById("closeBtn").addEventListener("click", function() {
  document.getElementById("mask").classList.remove("open");
  if (S.active === "water" || S.active === "delta") { S.active = "core"; S.fresh = true; }
  paint();
});
document.getElementById("sheet").addEventListener("click", function(e) {
  var b = e.target.closest("[data-t]"); if (!b) return;
  var id = b.dataset.t;
  if (id === "none31") S.none31 = !S.none31; else S.flags[id] = !S.flags[id];
  paint();
});
document.getElementById("keys").addEventListener("click", function(e) {
  var b = e.target.closest("[data-k]"); if (!b) return;
  type(b.dataset.k);
});
paint();
</script>
</body>
</html>
