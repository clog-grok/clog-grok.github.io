<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マンション工事費ざっくり</title>
<meta name="description" content="土地と建蔽・容積・階数から延べと本体工事費の概算。">
<meta name="tool-tag" content="建築">
<meta name="tool-status" content="wip">
<style>
  :root { --bg-color:#0f172a; --card-bg:#1e293b; --text-main:#f8fafc; --text-sub:#cbd5e1; --accent:#38bdf8; --ok:#34d399; --border:#334155; --warn:#fbbf24; }
  html[data-theme="light"] { --bg-color:#e2e8f0; --card-bg:#ffffff; --text-main:#0f172a; --text-sub:#334155; --accent:#0369a1; --ok:#047857; --border:#cbd5e1; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; }
  .app-container { background-color: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.18); position: relative; }
  .theme { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border: 1px solid var(--border); background: transparent; color: var(--text-main); border-radius: 999px; padding: 0; font-size: 1rem; line-height: 1; }
  h1 { font-size: 1.15rem; text-align: center; margin: 0 0 14px; padding-right: 48px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; }
  .seg button { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 8px; padding: 8px 4px; font-size: 0.78rem; }
  .seg button.on { border-color: var(--accent); color: var(--text-main); background: rgba(56, 189, 248, 0.14); }
  .mini { display: flex; gap: 4px; flex-shrink: 0; }
  .mini button { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 6px; padding: 3px 7px; font-size: 0.68rem; }
  .mini button.on { border-color: var(--accent); color: var(--text-main); background: rgba(56, 189, 248, 0.14); }
  .input-group, .fold { background-color: var(--bg-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .fold { padding: 8px 14px 14px; }
  .fold summary { list-style: none; cursor: pointer; padding: 6px 0; margin-bottom: 8px; color: var(--text-main); font-size: 0.85rem; }
  .fold summary::-webkit-details-marker { display: none; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .row label { font-size: 0.92rem; color: var(--text-main); }
  .row input[type="number"] { width: 104px; text-align: right; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 0.95rem; }
  .conv { font-size: 0.72rem; color: var(--text-sub); text-align: right; margin: 0 0 10px; min-height: 1em; }
  .result-box { border: 2px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .result-box.main { border-color: var(--accent); }
  .result-title { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
  .result-amount { font-size: 1.45rem; font-weight: bold; text-align: right; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .result-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: 6px; color: var(--text-sub); }
  .result-line b { color: var(--text-main); font-weight: 600; }
  .result-line input[type="number"] { width: 88px; text-align: right; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--accent); background: var(--card-bg); color: var(--text-main); font-size: 0.85rem; }
  .cap { display: inline-block; font-size: 0.68rem; border: 1px solid var(--ok); color: var(--ok); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .check { display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; color: var(--text-main); margin: 8px 0 6px; }
  .extra-list { font-size: 0.72rem; color: var(--text-sub); line-height: 1.5; margin: 0 0 8px 24px; }
  details.steps-box { border: 2px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; }
  details.steps-box summary { font-size: 0.78rem; color: var(--text-main); cursor: pointer; }
  .steps { font-size: 0.78rem; color: var(--text-main); line-height: 1.7; margin: 8px 0 0; white-space: pre-wrap; word-break: break-all; }
  .warn { font-size: 0.72rem; color: var(--warn); margin-top: 8px; line-height: 1.5; }
  .hidden { display: none; }
  .foot-link { display: block; width: max-content; color: var(--text-sub); font-size: 0.75rem; text-decoration: none; margin-top: 8px; }
</style>
</head>
<body>
<div class="app-container">
  <button type="button" class="theme" id="themeBtn" aria-label="テーマ">☀</button>
  <h1>マンション工事費ざっくり</h1>
  <div class="input-group">
    <div class="seg" id="unitSeg">
      <button type="button" data-unit="m2" class="on">土地を㎡で</button>
      <button type="button" data-unit="tsubo">土地を坪で</button>
    </div>
    <div class="row"><label id="landLabel">土地面積 ㎡</label><input type="number" id="land" inputmode="decimal" value="330"></div>
    <div class="conv" id="landConv"></div>
    <div class="row"><label>建蔽率 %</label><input type="number" id="kenpei" inputmode="decimal" value="80"></div>
    <div class="row"><label>容積率 %</label><input type="number" id="yoseki" inputmode="decimal" value="400"></div>
    <div class="row"><label>階数</label><input type="number" id="floors" inputmode="numeric" value="7"></div>
  </div>
  <details class="fold">
    <summary>住戸・構造・単価 ▾</summary>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="oneroom" class="on">ワンルーム</button>
      <button type="button" data-type="family">ファミリー</button>
    </div>
    <div class="seg three" id="structSeg">
      <button type="button" data-struct="S">S造</button>
      <button type="button" data-struct="RC" class="on">RC造</button>
      <button type="button" data-struct="SRC">SRC造</button>
    </div>
    <div class="row"><label id="priceLabel">延べの坪単価 万円</label><div class="mini" id="priceSeg"><button type="button" data-price="tsubo" class="on">坪</button><button type="button" data-price="m2">㎡</button></div></div>
    <div class="row"><span></span><input type="number" id="price" inputmode="decimal" value="120"></div>
    <div class="conv" id="priceConv"></div>
    <div class="row"><label>1戸の専有 ㎡</label><input type="number" id="unitM2" inputmode="decimal" value="25"></div>
    <div class="row"><label>専有効率</label><input type="number" id="eff" inputmode="decimal" step="0.01" value="0.75"></div>
    <div class="row"><label>廊下係数</label><input type="number" id="coeff" inputmode="decimal" step="0.01" value="1.33"></div>
    <div class="conv">専有効率 ＝ 1 ÷ 廊下係数</div>
  </details>
  <div class="result-box">
    <div class="result-title">使う延べ<span class="cap" id="capLabel">容積</span></div>
    <div class="result-amount" id="gfaText">—</div>
    <div class="result-line"><span>建築面積上限（1階）</span><b id="archText">—</b></div>
    <div class="result-line"><span>容積の延べ上限</span><b id="farText">—</b></div>
    <div class="result-line"><span>容積を使い切る階数</span><b id="needFloorText">—</b></div>
    <div class="result-line"><span>1階あたり戸数</span><b id="perFloorText">—</b></div>
    <p class="warn hidden" id="floorNote"></p>
  </div>
  <div class="result-box main">
    <div class="result-title">本体工事費（延べ × 単価）</div>
    <div class="result-amount" id="bodyText">—</div>
    <div class="result-line"><span id="formulaLabel">延べ坪 × 坪単価</span><b id="formulaText">—</b></div>
  </div>
  <label class="check"><input type="checkbox" id="extra"> 付帯＋諸費用 +25%（仮置き）</label>
  <p class="extra-list hidden" id="extraList">含むもの（仮）：外構・地盤改良・設計監理・申請 など</p>
  <div class="result-box hidden" id="extraBox">
    <div class="result-title">本体＋付帯諸費用（+25%）</div>
    <div class="result-amount" id="extraText">—</div>
    <div class="result-line"><span>本体 × 1.25</span><b id="extraFormula">—</b></div>
  </div>
  <div class="result-box">
    <div class="result-title">戸数と面積</div>
    <div class="result-line"><span>想定戸数</span><input type="number" id="unitsIn" inputmode="numeric" min="1" step="1"></div>
    <div class="result-line"><span>計算の上限</span><b id="unitsCapText">—</b></div>
    <div class="result-line"><span>1戸あたり本体</span><b id="perUnitText">—</b></div>
    <div class="result-line"><span>専有の合計</span><b id="exText">—</b></div>
    <div class="result-line"><span>廊下係数</span><input type="number" id="coeffOut" inputmode="decimal" step="0.01" min="1"></div>
    <div class="result-line"><span>延べ面積</span><b id="gfaLine">—</b></div>
    <div class="conv" id="gfaFormula" style="margin:2px 0 6px;"></div>
    <div class="result-line"><span>共用の合計</span><b id="commonText">—</b></div>
    <p class="warn hidden" id="unitsNote"></p>
  </div>
  <details class="steps-box"><summary>電卓用の式</summary><p class="steps" id="steps">—</p></details>
  <a class="foot-link" href="./wip.html">← 試作</a>
</div>
<script>
const M2_PER_TSUBO = 3.305785;
const TO_TSUBO = 0.3025;
const PRESET = { S: 114, RC: 120, SRC: 135 };
const TYPE = { oneroom: { unitM2: 25, eff: 0.75 }, family: { unitM2: 65, eff: 0.82 } };
const land = document.getElementById("land");
const kenpei = document.getElementById("kenpei");
const yoseki = document.getElementById("yoseki");
const floors = document.getElementById("floors");
const price = document.getElementById("price");
const unitM2 = document.getElementById("unitM2");
const eff = document.getElementById("eff");
const coeff = document.getElementById("coeff");
const coeffOut = document.getElementById("coeffOut");
const extra = document.getElementById("extra");
const unitsIn = document.getElementById("unitsIn");
const landLabel = document.getElementById("landLabel");
const landConv = document.getElementById("landConv");
const priceLabel = document.getElementById("priceLabel");
const priceConv = document.getElementById("priceConv");
let landUnit = "m2";
let priceUnit = "tsubo";
let unitsManual = false;
let syncing = false;
function yen(n) {
  if (!isFinite(n) || n <= 0) return "—";
  const oku = Math.floor(n / 100000000);
  const man = Math.floor((n % 100000000) / 10000);
  const yenPart = Math.round(n % 10000);
  const parts = [];
  if (oku) parts.push(oku.toLocaleString("ja-JP") + "億");
  if (man) parts.push(man.toLocaleString("ja-JP") + "万");
  if (yenPart && !oku) parts.push(yenPart.toLocaleString("ja-JP"));
  return (parts.join(" ") || "0") + "円";
}
function area(m2) {
  if (!isFinite(m2) || m2 <= 0) return "—";
  return m2.toFixed(1) + "㎡（" + (m2 * TO_TSUBO).toFixed(1) + "坪）";
}
function num(n, d) { return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
function bindSeg(id, attr, onPick) {
  const root = document.getElementById(id);
  root.addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn) return;
    root.querySelectorAll("button").forEach(function (b) { b.classList.remove("on"); });
    btn.classList.add("on");
    onPick(btn.getAttribute(attr));
    calc();
  });
}
bindSeg("unitSeg", "data-unit", function (v) {
  const m2Now = landM2(); landUnit = v;
  if (landUnit === "m2") { landLabel.textContent = "土地面積 ㎡"; land.value = m2Now ? String(Math.round(m2Now * 10) / 10) : ""; }
  else { landLabel.textContent = "土地面積 坪"; land.value = m2Now ? String(Math.round((m2Now * TO_TSUBO) * 10) / 10) : ""; }
});
bindSeg("priceSeg", "data-price", function (v) {
  const tsuboNow = priceTsubo(); priceUnit = v;
  if (priceUnit === "tsubo") { priceLabel.textContent = "延べの坪単価 万円"; price.value = tsuboNow ? String(Math.round(tsuboNow * 10) / 10) : ""; }
  else { priceLabel.textContent = "延べの㎡単価 万円"; price.value = tsuboNow ? String(Math.round((tsuboNow / M2_PER_TSUBO) * 100) / 100) : ""; }
});
bindSeg("typeSeg", "data-type", function (v) { unitsManual = false; setEff(TYPE[v].eff); unitM2.value = TYPE[v].unitM2; });
bindSeg("structSeg", "data-struct", function (v) {
  const tsubo = PRESET[v];
  price.value = priceUnit === "tsubo" ? String(tsubo) : String(Math.round((tsubo / M2_PER_TSUBO) * 100) / 100);
});
function landM2() { const n = parseFloat(land.value); if (!isFinite(n) || n <= 0) return 0; return landUnit === "tsubo" ? n * M2_PER_TSUBO : n; }
function priceTsubo() { const n = parseFloat(price.value); if (!isFinite(n) || n <= 0) return 0; return priceUnit === "m2" ? n * M2_PER_TSUBO : n; }
function priceM2() { return priceTsubo() / M2_PER_TSUBO; }
function setEff(e) { syncing = true; const v = Math.max(0.01, Math.min(e, 1)); eff.value = num(v, 2); coeff.value = num(1 / v, 2); coeffOut.value = num(1 / v, 2); syncing = false; }
function setCoeff(c) { syncing = true; const v = Math.max(1, c); coeff.value = num(v, 2); coeffOut.value = num(v, 2); eff.value = num(1 / v, 2); syncing = false; }
function calc() {
  const m2 = landM2();
  const kPct = parseFloat(kenpei.value) || 0;
  const yPct = parseFloat(yoseki.value) || 0;
  const f = parseFloat(floors.value) || 0;
  const uSize = parseFloat(unitM2.value) || 0;
  let e = parseFloat(eff.value);
  if (!isFinite(e) || e <= 0) e = 0.75;
  e = Math.max(0.01, Math.min(e, 1));
  const c = 1 / e;
  const k = kPct / 100;
  const y = yPct / 100;
  const pTsubo = priceTsubo();
  const pM2 = priceM2();
  landConv.textContent = m2 ? (landUnit === "m2" ? "＝ " + num(m2 * TO_TSUBO, 1) + "坪" : "＝ " + num(m2, 1) + "㎡") : "";
  priceConv.textContent = pTsubo ? (priceUnit === "tsubo" ? "＝ " + num(pM2, 2) + "万円/㎡" : "＝ " + num(pTsubo, 1) + "万円/坪") : "";
  const arch = m2 * k;
  const far = m2 * y;
  const byFloor = arch * f;
  const capGfa = Math.min(far, byFloor);
  const useFar = far <= byFloor;
  const needFloors = arch > 0 ? far / arch : 0;
  const capExclusive = capGfa * e;
  const capUnits = uSize > 0 ? Math.floor(capExclusive / uSize) : 0;
  let units = capUnits;
  if (unitsManual) { const typed = parseFloat(unitsIn.value); if (isFinite(typed) && typed > 0) units = Math.floor(typed); }
  else if (document.activeElement !== unitsIn) { unitsIn.value = capUnits ? String(capUnits) : ""; }
  let usedExclusive = units * uSize;
  let usedGfa = usedExclusive * c;
  const unitsNote = document.getElementById("unitsNote");
  if (usedGfa > capGfa + 0.001) { usedGfa = capGfa; usedExclusive = capExclusive; unitsNote.classList.remove("hidden"); unitsNote.textContent = "延べの上限を超えるので、工事費は上限の延べで見ています。"; }
  else { unitsNote.classList.add("hidden"); unitsNote.textContent = ""; }
  const common = usedGfa - usedExclusive;
  const body = (usedGfa * TO_TSUBO) * pTsubo * 10000;
  const per = units > 0 ? body / units : 0;
  const liveFloors = needFloors > 0 ? Math.min(f || needFloors, needFloors) : (f || 0);
  const perFloor = liveFloors > 0 ? units / liveFloors : 0;
  document.getElementById("capLabel").textContent = useFar ? "容積で頭打ち" : "建蔽×階数で頭打ち";
  document.getElementById("gfaText").textContent = area(usedGfa);
  document.getElementById("archText").textContent = area(arch);
  document.getElementById("farText").textContent = area(far);
  document.getElementById("needFloorText").textContent = needFloors > 0 ? num(needFloors, 2) + "階" : "—";
  document.getElementById("perFloorText").textContent = perFloor > 0 ? num(perFloor, 2) + "戸" : "—";
  const note = document.getElementById("floorNote");
  if (needFloors > 0 && f > needFloors + 0.01) { note.classList.remove("hidden"); note.textContent = "入力" + f + "階でも延べは増えない。容積を使い切るのは " + num(needFloors, 2) + "階。"; }
  else if (needFloors > 0 && f > 0 && f + 0.01 < needFloors) { note.classList.remove("hidden"); note.textContent = "今の階数では容積を使い切れない。使い切るには " + num(needFloors, 2) + "階。"; }
  else { note.classList.add("hidden"); note.textContent = ""; }
  document.getElementById("bodyText").textContent = yen(body);
  if (priceUnit === "tsubo") {
    document.getElementById("formulaLabel").textContent = "延べ坪 × 坪単価";
    document.getElementById("formulaText").textContent = usedGfa > 0 ? num(usedGfa * TO_TSUBO, 1) + "坪 × " + num(pTsubo, 1) + "万円" : "—";
  } else {
    document.getElementById("formulaLabel").textContent = "延べ㎡ × ㎡単価";
    document.getElementById("formulaText").textContent = usedGfa > 0 ? num(usedGfa, 1) + "㎡ × " + num(pM2, 2) + "万円" : "—";
  }
  document.getElementById("unitsCapText").textContent = capUnits ? capUnits + "戸" : "—";
  document.getElementById("perUnitText").textContent = yen(per);
  document.getElementById("exText").textContent = area(usedExclusive);
  if (document.activeElement !== coeffOut) coeffOut.value = num(c, 2);
  document.getElementById("gfaLine").textContent = area(usedGfa);
  document.getElementById("gfaFormula").textContent = usedExclusive > 0 ? "専有 " + num(usedExclusive, 1) + "㎡ × " + num(c, 2) : "";
  document.getElementById("commonText").textContent = area(common);
  const extraBox = document.getElementById("extraBox");
  const extraList = document.getElementById("extraList");
  if (extra.checked) {
    extraBox.classList.remove("hidden"); extraList.classList.remove("hidden");
    document.getElementById("extraText").textContent = yen(body * 1.25);
    document.getElementById("extraFormula").textContent = "× 1.25（+25%）";
  } else { extraBox.classList.add("hidden"); extraList.classList.add("hidden"); }
  document.getElementById("steps").textContent = [
    "1坪 ＝ 3.305785㎡　／　坪 ＝ ㎡ × 0.3025",
    "専有効率 ＝ 1 ÷ 廊下係数 ＝ " + num(e, 2),
    num(m2, 1) + "㎡ × 建蔽" + kPct + "% ＝ 建築面積 " + num(arch, 1) + "㎡",
    num(m2, 1) + "㎡ × 容積" + yPct + "% ＝ 容積延べ " + num(far, 1) + "㎡",
    "上限戸数 ＝ " + capUnits + "戸",
    "専有 " + num(usedExclusive, 1) + "㎡ × 廊下係数" + num(c, 2) + " ＝ 延べ " + num(usedGfa, 1) + "㎡",
    priceUnit === "tsubo" ? num(usedGfa * TO_TSUBO, 1) + "坪 × " + num(pTsubo, 1) + "万円 ＝ 本体" : num(usedGfa, 1) + "㎡ × " + num(pM2, 2) + "万円 ＝ 本体"
  ].join("\n");
}
["land", "kenpei", "yoseki", "floors", "price", "unitM2"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", function () {
    if (id === "unitM2" || id === "floors") unitsManual = false;
    calc();
  });
});
eff.addEventListener("input", function () { if (syncing) return; unitsManual = false; const e = parseFloat(eff.value); if (isFinite(e) && e > 0) setEff(e); calc(); });
function onCoeffInput(el) { if (syncing) return; unitsManual = false; const c = parseFloat(el.value); if (isFinite(c) && c >= 1) setCoeff(c); calc(); }
coeff.addEventListener("input", function () { onCoeffInput(coeff); });
coeffOut.addEventListener("input", function () { onCoeffInput(coeffOut); });
unitsIn.addEventListener("input", function () { unitsManual = true; calc(); });
extra.addEventListener("change", calc);
document.getElementById("themeBtn").addEventListener("click", function () {
  const light = document.documentElement.getAttribute("data-theme") === "light";
  if (light) { document.documentElement.removeAttribute("data-theme"); this.textContent = "\u2600"; }
  else { document.documentElement.setAttribute("data-theme", "light"); this.textContent = "\u263E"; }
});
setEff(0.75);
calc();
</script>
</body>
</html>
