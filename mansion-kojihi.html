<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マンション工事費ざっくり</title>
<meta name="description" content="土地と建蔽・容積・階数から延べと本体工事費の概算。">
<meta name="tool-tag" content="建築">
<meta name="tool-status" content="wip">
<style>
  :root { --bg-color:#0f172a; --card-bg:#1e293b; --text-main:#f8fafc; --text-sub:#cbd5e1; --accent:#38bdf8; --ok:#34d399; --border:#334155; --warn:#fbbf24; }
  html[data-theme="light"] { --bg-color:#e2e8f0; --card-bg:#ffffff; --text-main:#0f172a; --text-sub:#334155; --accent:#0369a1; --ok:#047857; --border:#cbd5e1; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
  body.steps-open { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .app-container { background-color: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.18); position: relative; }
  .theme { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border: 1px solid var(--border); background: transparent; color: var(--text-main); border-radius: 999px; padding: 0; font-size: 1rem; line-height: 1; }
  h1 { font-size: 1.15rem; text-align: center; margin: 0 0 14px; padding-right: 48px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; }
  .seg button { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 8px; padding: 8px 4px; font-size: 0.78rem; }
  .seg button.on { border-color: var(--accent); color: var(--text-main); background: rgba(56, 189, 248, 0.14); }
  .mini { display: flex; gap: 4px; flex-shrink: 0; }
  .mini button { border: 1px solid var(--border); background: transparent; color: var(--text-sub); border-radius: 6px; padding: 3px 7px; font-size: 0.68rem; }
  .mini button.on { border-color: var(--accent); color: var(--text-main); background: rgba(56, 189, 248, 0.14); }
  .input-group, .fold { background-color: var(--bg-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .fold { padding: 8px 14px 14px; }
  .fold summary { list-style: none; cursor: pointer; padding: 8px 0; margin-bottom: 8px; color: var(--text-main); font-size: 1.02rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary .tri { display: inline-block; width: 1.1em; font-size: 0.85em; line-height: 1; color: var(--accent); flex-shrink: 0; }
  .fold summary .tri::before { content: "▶"; }
  .fold[open] summary .tri::before { content: "▼"; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .row label { font-size: 0.92rem; color: var(--text-main); }
  .row input[type="number"] { width: 104px; text-align: right; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 0.95rem; }
  .with-unit { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .with-unit input[type="number"] { width: 88px; }
  .unit { font-size: 0.82rem; color: var(--text-main); min-width: 2.4em; font-weight: 600; }
  .unit-slash { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; margin: 0 2px; }
  .units-cap { font-size: 0.85rem; color: var(--text-main); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .conv { font-size: 0.72rem; color: var(--text-sub); text-align: right; margin: 0 0 10px; min-height: 1em; word-break: break-all; }
  .result-box { border: 2px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .result-box.main { border-color: var(--accent); }
  .result-title { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
  .result-amount { font-size: 1.45rem; font-weight: bold; text-align: right; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .result-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.8rem; margin-top: 6px; color: var(--text-sub); }
  .result-line b { color: var(--text-main); font-weight: 600; }
  .result-line input[type="number"] { width: 88px; text-align: right; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 0.85rem; outline: none; }
  .result-sub { font-size: 0.72rem; color: var(--text-sub); text-align: right; margin: 4px 0 0; min-height: 1em; }
  .cap { display: inline-block; font-size: 0.68rem; border: 1px solid var(--ok); color: var(--ok); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
  .check { display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; color: var(--text-main); margin: 8px 0 6px; }
  .extra-list { font-size: 0.72rem; color: var(--text-sub); line-height: 1.5; margin: 0 0 8px 24px; }
  .result-line .with-unit input[type="number"] { width: 88px; }
  .steps-btn { display: block; width: 100%; border: 2px solid var(--border); background: var(--bg-color); color: var(--text-main); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; font-size: 0.78rem; cursor: pointer; }
  .steps-btn:hover { border-color: var(--accent); }
  .steps-slot { min-height: 0; }
  .steps-panel { display: none; background: var(--card-bg); color: var(--text-main); border: 2px solid var(--accent); border-radius: 14px; padding: 10px 12px; margin: 0 0 10px; }
  .steps-panel.open { display: block; }
  .steps-panel.float { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: calc(100% - 24px); max-width: 400px; max-height: min(28vh, 180px); overflow: auto; z-index: 1000; margin: 0; box-shadow: 0 12px 32px rgba(0,0,0,0.35); }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
  .foot a, .foot button { background: none; border: 0; color: var(--text-sub); font-size: 0.78rem; text-decoration: none; padding: 10px 4px; cursor: pointer; }
  .float-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .float-head strong { font-size: 0.85rem; }
  .float-head button { border: 1px solid var(--border); background: transparent; color: var(--text-main); border-radius: 8px; width: 32px; height: 32px; font-size: 1.1rem; line-height: 1; cursor: pointer; }
  .steps { font-size: 0.72rem; color: var(--text-main); line-height: 1.45; margin: 0; white-space: pre-wrap; word-break: break-all; }
  .warn { font-size: 0.72rem; color: var(--warn); margin-top: 8px; line-height: 1.5; }
  .hidden { display: none; }
  .foot-link { display: block; width: max-content; color: var(--text-sub); font-size: 0.75rem; text-decoration: none; margin-top: 8px; }
</style>
</head>
<body>
<div class="app-container">
  <button type="button" class="theme" id="themeBtn" aria-label="テーマ">☀</button>
  <h1>マンション工事費ざっくり</h1>
  <div class="input-group">
    <div class="row"><label id="landLabel">土地面積</label><div class="mini" id="unitSeg"><button type="button" data-unit="m2" class="on">㎡</button><button type="button" data-unit="tsubo">坪</button></div></div>
    <div class="row"><span></span><div class="with-unit"><input type="number" id="land" inputmode="decimal" value="330"><span class="unit" id="landUnit">㎡</span></div></div>
    <div class="conv" id="landConv"></div>
    <div class="row"><label>建蔽率</label><div class="with-unit"><input type="number" id="kenpei" inputmode="decimal" value="80"><span class="unit">%</span></div></div>
    <div class="row"><label>容積率</label><div class="with-unit"><input type="number" id="yoseki" inputmode="decimal" value="400"><span class="unit">%</span></div></div>
    <div class="row"><label>階数</label><div class="with-unit"><input type="number" id="floors" inputmode="numeric" value="7"><span class="unit">階</span></div></div>
  </div>
  <details class="fold">
    <summary><span class="tri" aria-hidden="true"></span>住戸・構造・単価</summary>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="oneroom" class="on">ワンルーム</button>
      <button type="button" data-type="family">ファミリー</button>
    </div>
    <div class="seg three" id="structSeg">
      <button type="button" data-struct="S">S造</button>
      <button type="button" data-struct="RC" class="on">RC造</button>
      <button type="button" data-struct="SRC">SRC造</button>
    </div>
    <div class="row"><label id="priceLabel">延べの坪単価</label><div class="mini" id="priceSeg"><button type="button" data-price="tsubo" class="on">坪</button><button type="button" data-price="m2">㎡</button></div></div>
    <div class="row"><span></span><div class="with-unit"><input type="number" id="price" inputmode="decimal" value="120"><span class="unit" id="priceUnit">万円/坪</span></div></div>
    <div class="conv" id="priceConv"></div>
    <div class="row"><label>1戸の専有</label><div class="with-unit"><input type="number" id="unitM2" inputmode="decimal" value="25"><span class="unit">㎡</span></div></div>
    <div class="row"><label>専有効率</label><input type="number" id="eff" inputmode="decimal" step="0.01" value="0.75"></div>
    <div class="row"><label>廊下係数</label><input type="number" id="coeff" inputmode="decimal" step="0.01" value="1.33"></div>
    <div class="conv">専有効率 ＝ 1 ÷ 廊下係数</div>
  </details>
  <div class="result-box">
    <div class="result-title">使う延べ<span class="cap" id="capLabel">容積</span></div>
    <div class="result-amount" id="gfaText">—</div>
    <div class="result-line"><span>建築面積上限（1階）</span><b id="archText">—</b></div>
    <div class="result-line"><span>容積の延べ上限</span><b id="farText">—</b></div>
    <div class="result-line"><span>容積を使い切る階数</span><b id="needFloorText">—</b></div>
    <div class="result-line"><span>1階あたり戸数</span><b id="perFloorText">—</b></div>
    <p class="warn hidden" id="floorNote"></p>
  </div>
  <div class="result-box main">
    <div class="result-title" id="bodyTitle">本体工事費（延べ × 単価）</div>
    <div class="result-amount" id="bodyText">—</div>
    <div class="result-line"><span id="formulaLabel">延べ坪 × 坪単価</span><b id="formulaText">—</b></div>
    <p class="result-sub hidden" id="bodyBaseLine"></p>
  </div>
  <label class="check"><input type="checkbox" id="extra"> 付帯＋諸費用 +25%（仮置き）</label>
  <p class="extra-list hidden" id="extraList">含むもの（仮）：外構・地盤改良・設計監理・申請 など</p>
  <div class="result-box">
    <div class="result-title">戸数と面積</div>
    <div class="result-line"><span>想定戸数</span><div class="with-unit"><input type="number" id="unitsIn" inputmode="numeric" min="1" step="1"><span class="unit-slash">/</span><b id="unitsCapText" class="units-cap">—</b></div></div>
    <div class="result-line"><span>1戸あたり本体</span><b id="perUnitText">—</b></div>
    <div class="result-line"><span>専有の合計</span><b id="exText">—</b></div>
    <div class="result-line"><span>廊下係数</span><input type="number" id="coeffOut" inputmode="decimal" step="0.01" min="1"></div>
    <div class="result-line"><span>延べ面積</span><b id="gfaLine">—</b></div>
    <div class="conv" id="gfaFormula" style="margin:2px 0 6px;"></div>
    <div class="result-line"><span>共用の合計</span><b id="commonText">—</b></div>
    <p class="warn hidden" id="unitsNote"></p>
  </div>
  <button type="button" class="steps-btn" id="stepsToggle">式の確認</button>
  <div class="steps-slot" id="stepsSlot">
    <div class="steps-panel" id="stepsPanel" hidden>
      <div class="float-head"><strong>式の確認</strong><button type="button" id="stepsClose" aria-label="閉じる">×</button></div>
      <p class="steps" id="steps">—</p>
    </div>
  </div>
  <div class="foot">
    <a class="foot-link" href="./wip.html">← 試作</a>
    <button type="button" id="resetBtn" aria-label="リセット">↺</button>
  </div>
</div>
<script>
const M2_PER_TSUBO = 3.305785;
const TO_TSUBO = 0.3025;
const PRESET = { S: 114, RC: 120, SRC: 135 };
const TYPE = { oneroom: { unitM2: 25, eff: 0.75 }, family: { unitM2: 65, eff: 0.82 } };
let priceMem = { S: 114, RC: 120, SRC: 135 };
let typeMem = { oneroom: { unitM2: 25, eff: 0.75 }, family: { unitM2: 65, eff: 0.82 } };
const land = document.getElementById("land");
const kenpei = document.getElementById("kenpei");
const yoseki = document.getElementById("yoseki");
const floors = document.getElementById("floors");
const price = document.getElementById("price");
const unitM2 = document.getElementById("unitM2");
const eff = document.getElementById("eff");
const coeff = document.getElementById("coeff");
const coeffOut = document.getElementById("coeffOut");
const extra = document.getElementById("extra");
const unitsIn = document.getElementById("unitsIn");
const landLabel = document.getElementById("landLabel");
const landConv = document.getElementById("landConv");
const priceLabel = document.getElementById("priceLabel");
const priceConv = document.getElementById("priceConv");
let landUnit = "m2";
let priceUnit = "tsubo";
let unitsManual = false;
let syncing = false;
function yen(n) {
  if (!isFinite(n) || n <= 0) return "—";
  const oku = Math.floor(n / 100000000);
  const man = Math.floor((n % 100000000) / 10000);
  const yenPart = Math.round(n % 10000);
  const parts = [];
  if (oku) parts.push(oku.toLocaleString("ja-JP") + "億");
  if (man) parts.push(man.toLocaleString("ja-JP") + "万");
  if (yenPart && !oku) parts.push(yenPart.toLocaleString("ja-JP"));
  return (parts.join(" ") || "0") + "円";
}
function area(m2) {
  if (!isFinite(m2) || m2 <= 0) return "—";
  return m2.toFixed(1) + "㎡（" + (m2 * TO_TSUBO).toFixed(1) + "坪）";
}
function num(n, d) { return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d); }
function trimNum(n, d) {
  const r = Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
  if (Math.abs(r - Math.round(r)) < Math.pow(10, -d) / 2) return String(Math.round(r));
  return String(parseFloat(r.toFixed(d)));
}
function commaM2(n) {
  if (Math.abs(n - Math.round(n)) < 0.05) return Math.round(n).toLocaleString("ja-JP");
  return (Math.round(n * 10) / 10).toLocaleString("ja-JP");
}
function bindSeg(id, attr, onPick) {
  const root = document.getElementById(id);
  root.addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn) return;
    root.querySelectorAll("button").forEach(function (b) { b.classList.remove("on"); });
    btn.classList.add("on");
    onPick(btn.getAttribute(attr));
    calc();
  });
}
bindSeg("unitSeg", "data-unit", function (v) {
  const m2Now = landM2(); landUnit = v;
  const landUnitEl = document.getElementById("landUnit");
  if (landUnit === "m2") { landLabel.textContent = "土地面積"; landUnitEl.textContent = "㎡"; land.value = m2Now ? String(Math.round(m2Now * 10) / 10) : ""; }
  else { landLabel.textContent = "土地面積"; landUnitEl.textContent = "坪"; land.value = m2Now ? String(Math.round((m2Now * TO_TSUBO) * 10) / 10) : ""; }
});
bindSeg("priceSeg", "data-price", function (v) {
  const tsuboNow = priceTsubo(); priceUnit = v;
  const priceUnitEl = document.getElementById("priceUnit");
  if (priceUnit === "tsubo") { priceLabel.textContent = "延べの坪単価"; priceUnitEl.textContent = "万円/坪"; price.value = tsuboNow ? String(Math.round(tsuboNow * 10) / 10) : ""; }
  else { priceLabel.textContent = "延べの㎡単価"; priceUnitEl.textContent = "万円/㎡"; price.value = tsuboNow ? String(Math.round((tsuboNow / M2_PER_TSUBO) * 100) / 100) : ""; }
});
bindSeg("typeSeg", "data-type", function (v) { unitsManual = false; const t = typeMem[v] || TYPE[v]; setEff(t.eff); unitM2.value = t.unitM2; });
bindSeg("structSeg", "data-struct", function (v) { const tsubo = priceMem[v] || PRESET[v]; price.value = priceUnit === "tsubo" ? String(tsubo) : String(Math.round((tsubo / M2_PER_TSUBO) * 100) / 100); });
function rememberPrice() { const t = priceTsubo(); if (t > 0) priceMem[currentStruct()] = t; }
function rememberType() { const e = parseFloat(eff.value); const u = parseFloat(unitM2.value); if (isFinite(e) && e > 0 && isFinite(u) && u > 0) typeMem[currentType()] = { unitM2: u, eff: e }; }
function landM2() { const n = parseFloat(land.value); if (!isFinite(n) || n <= 0) return 0; return landUnit === "tsubo" ? n * M2_PER_TSUBO : n; }
function priceTsubo() { const n = parseFloat(price.value); if (!isFinite(n) || n <= 0) return 0; return priceUnit === "m2" ? n * M2_PER_TSUBO : n; }
function priceM2() { return priceTsubo() / M2_PER_TSUBO; }
function setEff(e) { syncing = true; const v = Math.max(0.01, Math.min(e, 1)); eff.value = num(v, 2); coeff.value = num(1 / v, 2); coeffOut.value = num(1 / v, 2); syncing = false; }
function setCoeff(c) { syncing = true; const v = Math.max(1, c); coeff.value = num(v, 2); coeffOut.value = num(v, 2); eff.value = num(1 / v, 2); syncing = false; }
function calc() {
  const m2 = landM2();
  const kPct = parseFloat(kenpei.value) || 0;
  const yPct = parseFloat(yoseki.value) || 0;
  const f = parseFloat(floors.value) || 0;
  const uSize = parseFloat(unitM2.value) || 0;
  let e = parseFloat(eff.value);
  if (!isFinite(e) || e <= 0) e = 0.75;
  e = Math.max(0.01, Math.min(e, 1));
  const c = 1 / e;
  const k = kPct / 100;
  const y = yPct / 100;
  const pTsubo = priceTsubo();
  const pM2 = priceM2();
  if (m2) {
    if (landUnit === "m2") landConv.textContent = num(m2 * TO_TSUBO, 1) + "坪 × 3.305785 ＝ " + num(m2, 1) + "㎡";
    else landConv.textContent = num(m2, 1) + "㎡ × 0.3025 ＝ " + num(m2 * TO_TSUBO, 1) + "坪";
  } else landConv.textContent = "";
  if (pTsubo) {
    if (priceUnit === "tsubo") priceConv.textContent = num(pM2, 2) + "万円/㎡ × 3.305785 ＝ " + num(pTsubo, 1) + "万円/坪";
    else priceConv.textContent = num(pTsubo, 1) + "万円/坪 ÷ 3.305785 ＝ " + num(pM2, 2) + "万円/㎡";
  } else priceConv.textContent = "";
  const arch = m2 * k;
  const far = m2 * y;
  const byFloor = arch * f;
  const capGfa = Math.min(far, byFloor);
  const useFar = far <= byFloor;
  const needFloors = arch > 0 ? far / arch : 0;
  const capExclusive = capGfa * e;
  const capUnits = uSize > 0 ? Math.floor(capExclusive / uSize) : 0;
  let units = capUnits;
  if (unitsManual) { const typed = parseFloat(unitsIn.value); if (isFinite(typed) && typed > 0) units = Math.floor(typed); }
  else if (document.activeElement !== unitsIn) { unitsIn.value = capUnits ? String(capUnits) : ""; }
  const usedExclusive = units * uSize;
  const usedGfa = usedExclusive * c;
  const overGfa = usedGfa - capGfa;
  const unitsNote = document.getElementById("unitsNote");
  if (overGfa > 0.001) {
    unitsNote.classList.remove("hidden");
    unitsNote.textContent = "想定延べ " + commaM2(usedGfa) + "㎡。上限 " + commaM2(capGfa) + "㎡。差 +" + commaM2(overGfa) + "㎡。";
  } else { unitsNote.classList.add("hidden"); unitsNote.textContent = ""; }
  const common = usedGfa - usedExclusive;
  const body = (usedGfa * TO_TSUBO) * pTsubo * 10000;
  const bodyCap = (capGfa * TO_TSUBO) * pTsubo * 10000;
  const per = units > 0 ? body / units : 0;
  const liveFloors = needFloors > 0 ? Math.min(f || needFloors, needFloors) : (f || 0);
  const perFloor = liveFloors > 0 ? units / liveFloors : 0;
  document.getElementById("capLabel").textContent = useFar ? "容積で頭打ち" : "建蔽×階数で頭打ち";
  document.getElementById("gfaText").textContent = area(usedGfa);
  document.getElementById("archText").textContent = area(arch);
  document.getElementById("farText").textContent = area(far);
  document.getElementById("needFloorText").textContent = needFloors > 0 ? trimNum(needFloors, 2) + "階" : "—";
  document.getElementById("perFloorText").textContent = perFloor > 0 ? trimNum(perFloor, 1) + "戸" : "—";
  const note = document.getElementById("floorNote");
  if (needFloors > 0 && f > 0 && Math.abs(f - needFloors) > 0.01) {
    note.classList.remove("hidden");
    note.textContent = "容積上限 " + commaM2(far) + "㎡（" + trimNum(needFloors, 2) + "階相当）。";
  } else { note.classList.add("hidden"); note.textContent = ""; }
  const bodyTitle = document.getElementById("bodyTitle");
  const bodyBaseLine = document.getElementById("bodyBaseLine");
  const extraList = document.getElementById("extraList");
  const withExtra = extra.checked;
  if (withExtra) {
    bodyTitle.textContent = "本体＋付帯諸費用（+25%）";
    document.getElementById("bodyText").textContent = yen(body * 1.25);
    if (priceUnit === "tsubo") {
      document.getElementById("formulaLabel").textContent = "延べ坪 × 坪単価 × 1.25";
      document.getElementById("formulaText").textContent = usedGfa > 0 ? num(usedGfa * TO_TSUBO, 1) + "坪 × " + num(pTsubo, 1) + "万円 × 1.25" : "—";
    } else {
      document.getElementById("formulaLabel").textContent = "延べ㎡ × ㎡単価 × 1.25";
      document.getElementById("formulaText").textContent = usedGfa > 0 ? num(usedGfa, 1) + "㎡ × " + num(pM2, 2) + "万円 × 1.25" : "—";
    }
    bodyBaseLine.classList.remove("hidden"); bodyBaseLine.textContent = body > 0 ? "本体 " + yen(body) : ""; extraList.classList.remove("hidden");
  } else {
    bodyTitle.textContent = "本体工事費（延べ × 単価）";
    document.getElementById("bodyText").textContent = yen(body);
    if (priceUnit === "tsubo") {
      document.getElementById("formulaLabel").textContent = "延べ坪 × 坪単価";
      document.getElementById("formulaText").textContent = usedGfa > 0 ? num(usedGfa * TO_TSUBO, 1) + "坪 × " + num(pTsubo, 1) + "万円" : "—";
    } else {
      document.getElementById("formulaLabel").textContent = "延べ㎡ × ㎡単価";
      document.getElementById("formulaText").textContent = usedGfa > 0 ? num(usedGfa, 1) + "㎡ × " + num(pM2, 2) + "万円" : "—";
    }
    bodyBaseLine.classList.add("hidden"); bodyBaseLine.textContent = ""; extraList.classList.add("hidden");
  }
  if (overGfa > 0.001 && bodyCap > 0) {
    bodyBaseLine.classList.remove("hidden");
    const capYen = withExtra ? yen(bodyCap * 1.25) : yen(bodyCap);
    bodyBaseLine.textContent = (withExtra && body > 0 ? "本体 " + yen(body) + "　" : "") + "上限延べなら " + capYen;
  }
  document.getElementById("unitsCapText").textContent = capUnits ? capUnits + "戸（上限）" : "—";
  document.getElementById("perUnitText").textContent = yen(per);
  document.getElementById("exText").textContent = area(usedExclusive);
  if (document.activeElement !== coeffOut) coeffOut.value = num(c, 2);
  document.getElementById("gfaLine").textContent = area(usedGfa);
  document.getElementById("gfaFormula").textContent = usedExclusive > 0 ? "専有 " + num(usedExclusive, 1) + "㎡ × " + num(c, 2) : "";
  document.getElementById("commonText").textContent = area(common);
  const costLine = priceUnit === "tsubo" ? num(usedGfa * TO_TSUBO, 1) + "坪 × " + num(pTsubo, 1) + "万＝本体" : num(usedGfa, 1) + "㎡ × " + num(pM2, 2) + "万＝本体";
  document.getElementById("steps").textContent = [
    num(m2, 1) + "㎡×建蔽" + kPct + "%＝" + num(arch, 1) + "㎡ ／ 容積" + yPct + "%＝" + num(far, 1) + "㎡",
    "専有" + num(usedExclusive, 1) + "㎡×" + num(c, 2) + "＝延べ" + num(usedGfa, 1) + "㎡（" + units + "戸／上限" + capUnits + "戸）",
    withExtra && body > 0 ? costLine + " ×1.25＝付帯込" : costLine
  ].join("\n");
  saveState();
}
["land", "kenpei", "yoseki", "floors", "price", "unitM2"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", function () {
    if (id === "unitM2" || id === "floors") unitsManual = false;
    if (id === "price") rememberPrice();
    if (id === "unitM2") rememberType();
    calc();
  });
});
eff.addEventListener("input", function () { if (syncing) return; unitsManual = false; const e = parseFloat(eff.value); if (isFinite(e) && e > 0) setEff(e); rememberType(); calc(); });
function onCoeffInput(el) { if (syncing) return; unitsManual = false; const c = parseFloat(el.value); if (isFinite(c) && c >= 1) setCoeff(c); rememberType(); calc(); }
coeff.addEventListener("input", function () { onCoeffInput(coeff); });
coeffOut.addEventListener("input", function () { onCoeffInput(coeffOut); });
unitsIn.addEventListener("input", function () { unitsManual = true; calc(); });
extra.addEventListener("change", calc);
const STORE_KEY = "mansion-kojihi-v1";
function currentType() { const on = document.querySelector("#typeSeg button.on"); return on ? on.getAttribute("data-type") : "oneroom"; }
function currentStruct() { const on = document.querySelector("#structSeg button.on"); return on ? on.getAttribute("data-struct") : "RC"; }
function currentTheme() { return document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark"; }
function setSegOn(rootId, attr, value) { const root = document.getElementById(rootId); root.querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.getAttribute(attr) === value); }); }
function applyTheme(theme) {
  const btn = document.getElementById("themeBtn");
  if (theme === "light") { document.documentElement.setAttribute("data-theme", "light"); btn.textContent = "\u263E"; }
  else { document.documentElement.removeAttribute("data-theme"); btn.textContent = "\u2600"; }
}
function applyLandUnitLabels() { const landUnitEl = document.getElementById("landUnit"); if (landUnit === "m2") { landLabel.textContent = "土地面積"; landUnitEl.textContent = "㎡"; } else { landLabel.textContent = "土地面積"; landUnitEl.textContent = "坪"; } }
function applyPriceUnitLabels() { const priceUnitEl = document.getElementById("priceUnit"); if (priceUnit === "tsubo") { priceLabel.textContent = "延べの坪単価"; priceUnitEl.textContent = "万円/坪"; } else { priceLabel.textContent = "延べの㎡単価"; priceUnitEl.textContent = "万円/㎡"; } }
function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ land: land.value, kenpei: kenpei.value, yoseki: yoseki.value, floors: floors.value, price: price.value, unitM2: unitM2.value, eff: eff.value, coeff: coeff.value, unitsIn: unitsIn.value, extra: !!extra.checked, landUnit: landUnit, priceUnit: priceUnit, unitsManual: !!unitsManual, type: currentType(), struct: currentStruct(), theme: currentTheme(), priceMem: priceMem, typeMem: typeMem }));
  } catch (e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY); if (!raw) return false;
    const data = JSON.parse(raw); if (!data || typeof data !== "object") return false;
    if (data.land != null) land.value = data.land;
    if (data.kenpei != null) kenpei.value = data.kenpei;
    if (data.yoseki != null) yoseki.value = data.yoseki;
    if (data.floors != null) floors.value = data.floors;
    if (data.price != null) price.value = data.price;
    if (data.unitM2 != null) unitM2.value = data.unitM2;
    if (data.eff != null) eff.value = data.eff;
    if (data.coeff != null) coeff.value = data.coeff;
    if (data.unitsIn != null) unitsIn.value = data.unitsIn;
    if (typeof data.extra === "boolean") extra.checked = data.extra;
    if (data.landUnit === "m2" || data.landUnit === "tsubo") landUnit = data.landUnit;
    if (data.priceUnit === "m2" || data.priceUnit === "tsubo") priceUnit = data.priceUnit;
    unitsManual = !!data.unitsManual;
    if (data.type === "oneroom" || data.type === "family") setSegOn("typeSeg", "data-type", data.type);
    if (data.struct === "S" || data.struct === "RC" || data.struct === "SRC") setSegOn("structSeg", "data-struct", data.struct);
    if (data.priceMem && typeof data.priceMem === "object") { ["S", "RC", "SRC"].forEach(function (k) { const n = parseFloat(data.priceMem[k]); if (isFinite(n) && n > 0) priceMem[k] = n; }); }
    if (data.typeMem && typeof data.typeMem === "object") { ["oneroom", "family"].forEach(function (k) { const t = data.typeMem[k]; if (!t) return; const u = parseFloat(t.unitM2); const e = parseFloat(t.eff); if (isFinite(u) && u > 0 && isFinite(e) && e > 0) typeMem[k] = { unitM2: u, eff: e }; }); }
    setSegOn("unitSeg", "data-unit", landUnit); setSegOn("priceSeg", "data-price", priceUnit); applyLandUnitLabels(); applyPriceUnitLabels(); applyTheme(data.theme === "light" ? "light" : "dark");
    if (data.coeff != null) coeffOut.value = data.coeff;
    return true;
  } catch (e) { return false; }
}
document.getElementById("themeBtn").addEventListener("click", function () { applyTheme(currentTheme() === "light" ? "dark" : "light"); saveState(); });
(function () {
  const panel = document.getElementById("stepsPanel");
  const slot = document.getElementById("stepsSlot");
  const toggle = document.getElementById("stepsToggle");
  const closeBtn = document.getElementById("stepsClose");
  function isOpen() { return panel.classList.contains("open"); }
  function openPanel() { panel.hidden = false; panel.classList.add("open"); panel.classList.remove("float"); document.body.classList.add("steps-open"); toggle.textContent = "式を閉じる"; slot.style.minHeight = ""; syncStepsMode(); }
  function closePanel() { panel.classList.remove("open", "float"); panel.hidden = true; document.body.classList.remove("steps-open"); toggle.textContent = "式の確認"; slot.style.minHeight = ""; }
  function nearPageBottom() {
    const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
    const doc = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    return (window.scrollY || window.pageYOffset || 0) + vh >= doc - 80;
  }
  function syncStepsMode() {
    if (!isOpen()) return;
    const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
    const rect = slot.getBoundingClientRect();
    const slotOnScreen = rect.top < vh - 96 && rect.bottom > 88;
    if (nearPageBottom() || slotOnScreen) { panel.classList.remove("float"); slot.style.minHeight = ""; return; }
    slot.style.minHeight = Math.max(panel.offsetHeight, 1) + "px";
    panel.classList.add("float");
  }
  toggle.addEventListener("click", function () { if (isOpen()) closePanel(); else openPanel(); });
  closeBtn.addEventListener("click", closePanel);
  window.addEventListener("scroll", syncStepsMode, { passive: true });
  window.addEventListener("resize", syncStepsMode);
  if (window.visualViewport) { window.visualViewport.addEventListener("resize", syncStepsMode); window.visualViewport.addEventListener("scroll", syncStepsMode); }
})();
function resetAll() {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  priceMem = { S: 114, RC: 120, SRC: 135 }; typeMem = { oneroom: { unitM2: 25, eff: 0.75 }, family: { unitM2: 65, eff: 0.82 } };
  landUnit = "m2"; priceUnit = "tsubo"; unitsManual = false;
  land.value = "330"; kenpei.value = "80"; yoseki.value = "400"; floors.value = "7"; price.value = "120"; unitM2.value = "25"; extra.checked = false; unitsIn.value = "";
  setSegOn("typeSeg", "data-type", "oneroom"); setSegOn("structSeg", "data-struct", "RC"); setSegOn("unitSeg", "data-unit", "m2"); setSegOn("priceSeg", "data-price", "tsubo");
  applyLandUnitLabels(); applyPriceUnitLabels(); setEff(0.75);
  const panel = document.getElementById("stepsPanel"); panel.classList.remove("open", "float"); panel.hidden = true; document.body.classList.remove("steps-open");
  document.getElementById("stepsToggle").textContent = "式の確認"; document.getElementById("stepsSlot").style.minHeight = ""; calc();
}
document.getElementById("resetBtn").addEventListener("click", resetAll);
if (!loadState()) { setEff(0.75); }
calc();
</script>
