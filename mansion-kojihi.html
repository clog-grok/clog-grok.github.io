;margin:0}.row input[type="number"],.with-unit input[type="number"],.result-line input[type="number"],.row.twin .with-unit input[type="number"]{border:none;border-bottom:1px dashed rgba(148,163,184,0.35);background:transparent;border-radius:4px;padding:6px 6px;min-height:36px;box-shadow:none;outline:none;transition:background .12s,border-color .12s,box-shadow .12s;cursor:text}.row input[type="number"]:hover,.with-unit input[type="number"]:hover,.result-line input[type="number"]:hover{background:rgba(148,163,184,0.10);border-bottom-style:solid;border-bottom-color:rgba(148,163,184,0.55)}.row input[type="number"]:focus,.with-unit input[type="number"]:focus,.result-line input[type="number"]:focus{background:rgba(148,163,184,0.12);border:1px solid var(--border);border-bottom:1px solid var(--text-sub);box-shadow:0 0 0 2px rgba(148,163,184,0.16)}</style></head><body><div class="app-container"><button type="button" class="theme" id="themeBtn" aria-label="テーマ"> ☀</button><h1> マンション工事費ざっくり</h1><details class="fold" id="siteFold" open><summary><span class="tri" aria-hidden="true"></span><span class="fold-head"><span class="fold-title"> 土地・建蔽・容積・階数</span><span class="site-sum" id="siteSum"> —</span></span></summary><div class="live-prev" id="livePrev" aria-live="polite"><div class="lp-row"><span> 使う延べ</span><span class="lp-val" id="liveGfa"> —</span></div><div class="lp-row"><span id="liveCostLabel"> 本体</span><span class="lp-val em" id="liveCost"> —</span></div></div><div class="site-block"><div class="row"><label id="landLabel"> 土地面積</label><div class="mini" id="unitSeg"><button type="button" data-unit="m2" class="on"> ㎡</button><button type="button" data-unit="tsubo"> 坪</button></div></div><div class="row"><span></span><div class="with-unit"><input type="number" id="land" inputmode="decimal" value="330"><span class="unit" id="landUnit"> ㎡</span></div></div><div class="conv" id="landConv"></div><div class="row twin"><div class="twin-col"><label> 建蔽率</label><div class="with-unit"><input type="number" id="kenpei" inputmode="decimal" value="80"><span class="unit"> %</span></div></div><div class="twin-col"><label> 容積率</label><div class="with-unit"><input type="number" id="yoseki" inputmode="decimal" value="400"><span class="unit"> %</span></div></div></div><div class="row floors-row"><label> 階数</label><div class="with-unit"><input type="number" id="floors" inputmode="numeric" value="7"><span class="unit"> 階</span></div></div></div></details><details class="fold" id="unitFold" open><summary><span class="tri" aria-hidden="true"></span><span class="fold-head"><span class="fold-title"> 住戸・構造・単価</span></span></summary><div class="seg" id="typeSeg"><button type="button" data-type="oneroom" class="on"> ワンルーム</button><button type="button" data-type="family"> ファミリー</button></div><div class="seg three" id="structSeg"><button type="button" data-struct="S"> S造</button><button type="button" data-struct="RC" class="on"> RC造</button><button type="button" data-struct="SRC"> SRC造</button></div><div class="row"><label id="priceLabel"> 延べの坪単価</label><div class="mini" id="priceSeg"><button type="button" data-price="tsubo" class="on"> 坪</button><button type="button" data-price="m2"> ㎡</button></div></div><div class="row"><span></span><div class="with-unit"><input type="number" id="price" inputmode="decimal" value="120"><span class="unit" id="priceUnit"> 万円/坪</span></div></div><div class="conv" id="priceConv"></div><div class="row"><label> 1戸の専有</label><div class="with-unit"><input type="number" id="unitM2" inputmode="decimal" value="25"><span class="unit"> ㎡</span></div></div><div class="row"><label> 専有効率</label><input type="number" id="eff" inputmode="decimal" step="0.01" value="0.75"></div><div class="row"><label> 廊下係数</label><input type="number" id="coeff" inputmode="decimal" step="0.01" value="1.33"></div><div class="conv"> 専有効率 ＝ 1 ÷ 廊下係数</div></details><div class="result-box"><div class="result-title"> 使う延べ<span class="cap" id="capLabel"> 容積</span></div><div class="result-amount" id="gfaText"> —</div><div class="result-line"><span> 建築面積上限（1階）</span><b id="archText"> —</b></div><div class="result-line"><span> 容積の延べ上限</span><b id="farText"> —</b></div><div class="result-line"><span> 容積を使い切る階数</span><b id="needFloorText"> —</b></div><div class="result-line"><span> 1階あたり戸数</span><b id="perFloorText"> —</b></div><p class="warn hidden" id="floorNote"></p></div><div class="result-box main"><div class="result-title" id="bodyTitle"> 本体工事費（延べ × 単価）</div><div class="result-amount" id="bodyText"> —</div><div class="result-line"><span id="formulaLabel"> 延べ坪 × 坪単価</span><b id="formulaText"> —</b></div><p class="result-sub hidden" id="bodyBaseLine"></p></div><label class="check"><input type="checkbox" id="extra"> 付帯＋諸費用 +25%（仮置き）</label><p class="extra-list hidden" id="extraList"> 含むもの（仮）：外構・地盤改良・設計監理・申請 など</p><div class="result-box"><div class="result-title"> 戸数と面積</div><div class="result-line"><span> 想定戸数</span><div class="with-unit"><input type="number" id="unitsIn" inputmode="numeric" min="1" step="1"><span class="unit-slash"> /</span><b id="unitsCapText" class="units-cap"> —</b></div></div><div class="result-line"><span> 1戸あたり本体</span><b id="perUnitText"> —</b></div><div class="result-line"><span> 専有の合計</span><b id="exText"> —</b></div><div class="result-line"><span> 廊下係数</span><input type="number" id="coeffOut" inputmode="decimal" step="0.01" min="1"></div><div class="result-line"><span> 延べ面積</span><b id="gfaLine"> —</b></div><div class="conv" id="gfaFormula" style="margin:2px 0 6px;"></div><div class="result-line"><span> 共用の合計</span><b id="commonText"> —</b></div><p class="warn hidden" id="unitsNote"></p></div><button type="button" class="steps-btn" id="stepsToggle"> 式の確認</button><div class="steps-panel" id="stepsPanel" hidden><div class="float-head"><button type="button" id="stepsClose" aria-label="閉じる"> ×</button></div><p class="steps" id="steps"> —</p></div><a class="foot-link" href="./wip.html"> ← 試作</a></div> <script>const M2_PER_TSUBO = 3.305785;

;

oneroom: {

, family: {
unitM2: 65, eff: 0.82 }
}
;

const floors = document.getElementById("floors");

const coeff = document.getElementById("coeff");

let priceUnit = "tsubo";

function yen(n) {
if (!isFinite(n) || n <= 0) return "—";
const oku = Math.floor(n / 100000000);
const man = Math.floor((n % 100000000) / 10000);
const yenPart = Math.round(n % 10000);
const parts = [];
if (oku) parts.push(oku.toLocaleString("ja-JP") + "億");
if (man) parts.push(man.toLocaleString("ja-JP") + "万");
if (yenPart && !oku) parts.push(yenPart.toLocaleString("ja-JP"));
return (parts.join(" ") || "0") + "円";
}
function area(m2) {
if (!isFinite(m2) || m2 <= 0) return "—";
return m2.toFixed(1) + "㎡（" + (m2 * TO_TSUBO).toFixed(1) + "坪）";
}
function num(n, d) {
return (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
}
function bindSeg(id, attr, onPick) {
const root = document.getElementById(id);
root.addEventListener("click", function (e) {
const btn = e.target.closest("button");
if (!btn) return;
root.querySelectorAll("button").forEach(function (b) {
b.classList.remove("on");
}
);
btn.classList.add("on");
onPick(btn.getAttribute(attr));
calc();
}
);
}
bindSeg("unitSeg", "data-unit", function (v) {
const m2Now = landM2();
landUnit = v;
const landUnitEl = document.getElementById("landUnit");
if (landUnit === "m2") {
landLabel.textContent = "土地面積";
landUnitEl.textContent = "㎡";
land.value = m2Now ? String(Math.round(m2Now * 10) / 10) : "";
}
else {
landLabel.textContent = "土地面積";
landUnitEl.textContent = "坪";
land.value = m2Now ? String(Math.round((m2Now * TO_TSUBO) * 10) / 10) : "";
}
}
);
bindSeg("priceSeg", "data-price", function (v) {
const tsuboNow = priceTsubo();
priceUnit = v;
const priceUnitEl = document.getElementById("priceUnit");
if (priceUnit === "tsubo") {
priceLabel.textContent = "延べの坪単価";
priceUnitEl.textContent = "万円/坪";
price.value = tsuboNow ? String(Math.round(tsuboNow * 10) / 10) : "";
}
else {
priceLabel.textContent = "延べの㎡単価";
priceUnitEl.textContent = "万円/㎡";
price.value = tsuboNow ? String(Math.round((tsuboNow / M2_PER_TSUBO) * 100) / 100) : "";
}
if (tsuboNow >
0) syncPriceMapFromInput();
}
);
function defaultPriceMap() {
return {
oneroom: {
S: PRESET.S, RC: PRESET.RC, SRC: PRESET.SRC }
,
family: {
S: PRESET.S, RC: PRESET.RC, SRC: PRESET.SRC }
}
;
}
let priceMap = defaultPriceMap();
let lastType = "oneroom";
let lastStruct = "RC";
function rememberPrice() {
const tsubo = priceTsubo();
if (!(tsubo >
0)) return;
if (!priceMap[lastType]) priceMap[lastType] = {
}
;
priceMap[lastType][lastStruct] = Math.round(tsubo * 10) / 10;
}
function applyRememberedPrice() {
const t = currentType();
const s = currentStruct();
const raw = priceMap[t] && priceMap[t][s];
const tsubo = (typeof raw === "number" && raw >
0) ? raw : PRESET[s];
price.value = priceUnit === "tsubo" ? String(tsubo) : String(Math.round((tsubo / M2_PER_TSUBO) * 100) / 100);
lastType = t;
lastStruct = s;
}
function syncPriceMapFromInput() {
const tsubo = priceTsubo();
if (!(tsubo >
0)) return;
const t = currentType();
const s = currentStruct();
if (!priceMap[t]) priceMap[t] = {
}
;
priceMap[t][s] = Math.round(tsubo * 10) / 10;
lastType = t;
lastStruct = s;
}
bindSeg("typeSeg", "data-type", function (v) {
rememberPrice();
unitsManual = false;
setEff(TYPE[v].eff);
unitM2.value = TYPE[v].unitM2;
applyRememberedPrice();
}
);
bindSeg("structSeg", "data-struct", function () {
rememberPrice();
applyRememberedPrice();
}
);
function landM2() {
const n = parseFloat(land.value);
if (!isFinite(n) || n <= 0) return 0;
return landUnit === "tsubo" ? n * M2_PER_TSUBO : n;
}
function priceTsubo() {
const n = parseFloat(price.value);
if (!isFinite(n) || n <= 0) return 0;
return priceUnit === "m2" ? n * M2_PER_TSUBO : n;
}
function priceM2() {
return priceTsubo() / M2_PER_TSUBO;
}
function setEff(e) {
syncing = true;
const v = Math.max(0.01, Math.min(e, 1));
eff.value = num(v, 2);
coeff.value = num(1 / v, 2);
coeffOut.value = num(1 / v, 2);
syncing = false;
}
function setCoeff(c) {
syncing = true;
const v = Math.max(1, c);
coeff.value = num(v, 2);
coeffOut.value = num(v, 2);
eff.value = num(1 / v, 2);
syncing = false;
}
function calc() {
const m2 = landM2();
const kPct = parseFloat(kenpei.value) || 0;
const yPct = parseFloat(yoseki.value) || 0;
const f = parseFloat(floors.value) || 0;
const uSize = parseFloat(unitM2.value) || 0;
let e = parseFloat(eff.value);
if (!isFinite(e) || e <= 0) e = 0.75;
e = Math.max(0.01, Math.min(e, 1));
const c = 1 / e;
const k = kPct / 100;
const y = yPct / 100;
const pTsubo = priceTsubo();
const pM2 = priceM2();
if (m2) {
if (landUnit === "m2") {
landConv.textContent = num(m2 * TO_TSUBO, 1) + "坪 × 3.305785 ＝ " + num(m2, 1) + "㎡";
}
else {
landConv.textContent = num(m2, 1) + "㎡ × 0.3025 ＝ " + num(m2 * TO_TSUBO, 1) + "坪";
}
}
else {
landConv.textContent = "";
}
if (pTsubo) {
if (priceUnit === "tsubo") {
priceConv.textContent = num(pM2, 2) + "万円/㎡ × 3.305785 ＝ " + num(pTsubo, 1) + "万円/坪";
}
else {
priceConv.textContent = num(pTsubo, 1) + "万円/坪 ÷ 3.305785 ＝ " + num(pM2, 2) + "万円/㎡";
}
}
else {
priceConv.textContent = "";
}
const arch = m2 * k;
const far = m2 * y;
const byFloor = arch * f;
const capGfa = Math.min(far, byFloor);
const useFar = far <= byFloor;
const needFloors = arch >
0 ? far / arch : 0;
