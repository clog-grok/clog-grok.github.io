<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アイス🍦 音の席</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --ice:#9ecbff; --cream:#e8eef7; --dim:#8b9bb4; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; background:radial-gradient(1200px 600px at 50% -8%, #1b2838 0%, var(--bg) 55%); color:var(--cream); }
  main { max-width:440px; margin:0 auto; padding:24px 16px 56px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; line-height:1.55; margin:0 0 16px; }
  .rooms { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .rooms button { border:1px solid var(--line); background:#11161d; color:var(--cream); border-radius:999px; padding:8px 12px; font-size:13px; }
  .rooms button.on { border-color:var(--ice); color:var(--ice); background:#162436; }
  .queuebtn { width:100%; margin:0 0 12px; border:1px dashed var(--ice); background:#0f1c28; color:var(--ice); border-radius:12px; padding:11px 14px; font-size:14px; text-align:left; }
  .queuebtn.on { background:#1a3348; }
  .player { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .now { font-size:14px; color:var(--ice); min-height:2.2em; font-weight:700; }
  audio { width:100%; margin-top:8px; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--dim); margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .controls label { display:flex; align-items:center; gap:4px; }
  .controls input { accent-color:var(--ice); margin:0; }
  .row { display:flex; gap:8px; align-items:stretch; margin:0 0 8px; }
  button.seat, a.seat { flex:1; text-align:left; background:#11161d; color:var(--cream); border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:14px; text-decoration:none; display:block; }
  button.seat.on, a.seat.on { border-color:var(--ice); color:var(--ice); background:#162436; }
  button.seat small, a.seat small { display:block; color:var(--dim); font-size:11px; margin-top:3px; }
  .icon { width:40px; border:1px solid var(--line); background:#11161d; color:var(--cream); border-radius:12px; font-size:16px; }
  .note { font-size:12px; color:var(--dim); line-height:1.65; margin-top:16px; }
  a { color:var(--ice); }
  .empty { color:var(--dim); font-size:13px; padding:8px 2px; }
  .mood { color:var(--ice); font-size:13px; margin:0 0 12px; min-height:1.4em; }
  .addbox { background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:12px; margin:0 0 12px; }
  .field { position:relative; margin:0 0 8px; }
  .field input { width:100%; padding:10px 40px 10px 10px; border-radius:8px; border:1px solid var(--line); background:#11161d; color:var(--cream); font-size:14px; }
  .field .wipe { position:absolute; right:4px; top:4px; width:32px; height:32px; border:0; background:transparent; color:var(--dim); font-size:18px; }
  .addbox > button { width:100%; padding:10px; border-radius:8px; border:1px solid var(--ice); background:#162436; color:var(--ice); font-size:14px; }
  .jumps { display:flex; gap:8px; margin:0 0 12px; }
  .jumps a { flex:1; text-align:center; text-decoration:none; border:1px solid var(--line); background:#11161d; color:var(--ice); border-radius:12px; padding:11px 8px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>アイス🍦 音の席</h1>
  <p class="sub">席で聴く。本格的な曲は下のボタンから探して、共有したURLをマイリストへ。</p>
  <div class="jumps">
    <a href="https://music.youtube.com/" target="_blank" rel="noopener">YouTube Music</a>
    <a href="https://open.spotify.com/" target="_blank" rel="noopener">Spotify</a>
  </div>
  <div class="rooms" id="rooms"></div>
  <button type="button" class="queuebtn" id="queueBtn">組 マイリスト</button>
  <p class="mood" id="mood"></p>
  <div class="player">
    <div class="now" id="now">席を選ぶ</div>
    <audio id="a" controls playsinline webkit-playsinline></audio>
    <div class="controls">
      <label><input type="radio" name="mode" value="normal"> 通常</label>
      <label><input type="radio" name="mode" value="sequence" checked> 連続再生</label>
      <label><input type="radio" name="mode" value="loop-all"> 全曲ループ</label>
      <label><input type="radio" name="mode" value="loop-one"> 1曲ループ</label>
    </div>
  </div>
  <div id="list"></div>
  <p class="note" id="credit"></p>
</main>

function enc(s){ return encodeURIComponent(s); }

const a = document.getElementById("a");
const now = document.getElementById("now");
const list = document.getElementById("list");
const roomsEl = document.getElementById("rooms");
const credit = document.getElementById("credit");
const KEY = "ice-queue-v1";
const META = "ice-meta-v1";

let currentRoomId = "night";
let currentIndex = -1;
let fromQueue = false;
let queue = [];
try { queue = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { queue = []; }
try {
  const meta = JSON.parse(localStorage.getItem(META) || "{}");
  if (meta.room && rooms[meta.room]) currentRoomId = meta.room;
  if (meta.mode) {
    const r = document.querySelector('input[name="mode"][value="'+meta.mode+'"]');
    if (r) r.checked = true;
  }
} catch(e) {}

Object.keys(rooms).forEach(id => {
  if (id === "queue") return;
  const b = document.createElement("button");
  b.textContent = rooms[id].label;
  b.dataset.id = id;
  b.onclick = () => openRoom(id);
  roomsEl.appendChild(b);
});
document.getElementById("queueBtn").onclick = () => openRoom("queue");

function saveQueue(){
  try { localStorage.setItem(KEY, JSON.stringify(queue)); } catch(e) {}
  saveMeta();
}
function saveMeta(){
  const mode = (document.querySelector('input[name="mode"]:checked') || {}).value || "sequence";
  try { localStorage.setItem(META, JSON.stringify({ room: currentRoomId, mode })); } catch(e) {}
}
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", saveMeta));

function activeList(){
  return fromQueue ? queue : (rooms[currentRoomId].tracks || []);
}

function isFile(url){
  if (!url) return false;
  const u = url.toLowerCase();
  if (/youtube\.com|youtu\.be|spotify\.com|music\.apple|freemusicarchive\.org\/music/.test(u)) return false;
  return /\.(mp3|ogg|wav|m4a|aac)(\?|#|$)/.test(u) || /archive\.org\/download\//.test(u);
}

function outHref(url){
  const s = url.match(/open\.spotify\.com\/(playlist|track|album|artist)\/([a-zA-Z0-9]+)/);
  if (s) return "spotify:" + s[1] + ":" + s[2];
  const y = url.match(/(?:youtu\.be\/|(?:music\.)?youtube\.com\/watch\?v=)([\w-]{11})/);
  if (y) return "https://www.youtube.com/watch?v=" + y[1];
  return url;
}

function openRoom(id){
  currentRoomId = id;
  currentIndex = -1;
  roomsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  document.getElementById("queueBtn").classList.toggle("on", id === "queue");
  document.getElementById("mood").textContent = rooms[id].mood || "";
  credit.innerHTML = rooms[id].credit;
  saveMeta();
  renderList();
}

function addOutForm(){
  const box = document.createElement("div");
  box.className = "addbox";
  box.innerHTML =
    "<div class='field'><input id='extTitle' placeholder='曲名'><button type='button' class='wipe' data-for='extTitle'>×</button></div>"
    + "<div class='field'><input id='extUrl' placeholder='YouTube / Spotify のURL'><button type='button' class='wipe' data-for='extUrl'>×</button></div>"
    + "<button type='button' id='extAdd'>外へ追加</button>";
  list.appendChild(box);
  box.querySelectorAll(".wipe").forEach(b => {
    b.onclick = () => { document.getElementById(b.dataset.for).value = ""; };
  });
  box.querySelector("#extAdd").onclick = () => {
    const titleEl = document.getElementById("extTitle");
    const urlEl = document.getElementById("extUrl");
    const title = (titleEl.value || "").trim() || "外の曲";
    const url = (urlEl.value || "").trim();
    if (!url) return;
    queue.push([title, url]);
    saveQueue();
    titleEl.value = "";
    urlEl.value = "";
    renderList();
  };
}

function renderList(){
  list.innerHTML = "";
  if (currentRoomId === "queue") {
    addOutForm();
    if (!queue.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "席で＋、または上にURL。";
      list.appendChild(p);
      return;
    }
    queue.forEach((t, i) => list.appendChild(queueRow(t, i)));
    const saved = document.createElement("p");
    saved.className = "empty";
    saved.textContent = "この端末に " + queue.length + " 曲保存。Safariで開くと閉じても残る。";
    list.appendChild(saved);
    return;
  }
  rooms[currentRoomId].tracks.forEach((t, i) => list.appendChild(catalogRow(t, i)));
}

function catalogRow(t, i){
  const wrap = document.createElement("div");
  wrap.className = "row";
  const play = document.createElement("button");
  play.className = "seat";
  play.innerHTML = t[0] + "<small>この席で再生</small>";
  play.onclick = () => playAt(rooms[currentRoomId].tracks, i, false);
  const add = document.createElement("button");
  add.className = "icon";
  add.textContent = "＋";
  add.onclick = () => {
    queue.push([t[0], t[1]]);
    saveQueue();
    add.textContent = "✓";
    setTimeout(() => add.textContent = "＋", 700);
  };
  wrap.append(play, add);
  return wrap;
}

function queueRow(t, i){
  const wrap = document.createElement("div");
  wrap.className = "row";
  const play = isFile(t[1]) ? document.createElement("button") : document.createElement("a");
  play.className = "seat";
  if (!isFile(t[1])) {
    play.href = outHref(t[1]);
    play.target = "_blank";
    play.rel = "noopener";
  } else {
    play.onclick = () => playAt(queue, i, true);
  }
  play.innerHTML = (i+1) + ". " + t[0] + "<small>" + (isFile(t[1]) ? "ここで再生" : "外へ飛ぶ") + "</small>";
  const up = document.createElement("button");
  up.className = "icon"; up.textContent = "↑";
  up.onclick = () => { if (i===0) return; [queue[i-1], queue[i]] = [queue[i], queue[i-1]]; saveQueue(); renderList(); };
  const down = document.createElement("button");
  down.className = "icon"; down.textContent = "↓";
  down.onclick = () => { if (i===queue.length-1) return; [queue[i+1], queue[i]] = [queue[i], queue[i+1]]; saveQueue(); renderList(); };
  const del = document.createElement("button");
  del.className = "icon"; del.textContent = "×";
  del.onclick = () => { queue.splice(i,1); saveQueue(); renderList(); };
  wrap.append(play, up, down, del);
  return wrap;
}

function markOn(i){
  list.querySelectorAll(".seat").forEach((x, n) => x.classList.toggle("on", n === i));
}

function playAt(arr, index, queued){
  if (index < 0 || index >= arr.length) return;
  fromQueue = queued;
  currentIndex = index;
  const [title, url] = arr[index];
  markOn(index);
  if (!isFile(url)) {
    a.pause();
    now.textContent = title;
    location.href = outHref(url);
    return;
  }
  now.textContent = title;
  document.title = title + " · アイス🍦";
  a.src = url;
  a.play().catch(() => { now.textContent = title + "（再生を押す）"; });
  setNowPlaying(title);
}

function setNowPlaying(title){
  const room = rooms[fromQueue ? "queue" : currentRoomId] || rooms.queue;
  const art = room.art || "https://archive.org/services/img/loyalty-freak-music-lofi-ambient-songs";
  if (!navigator.mediaSession) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title,
      artist: "アイス🍦",
      album: room.label || "音の席",
      artwork: [
        { src: art, sizes: "96x96", type: "image/jpeg" },
        { src: art, sizes: "256x256", type: "image/jpeg" },
        { src: art, sizes: "512x512", type: "image/jpeg" }
      ]
    });
    navigator.mediaSession.playbackState = "playing";
    navigator.mediaSession.setActionHandler("play", () => a.play());
    navigator.mediaSession.setActionHandler("pause", () => a.pause());
    navigator.mediaSession.setActionHandler("nexttrack", () => {
      const listArr = activeList();
      const i = nextFileIndex(listArr, currentIndex, true);
      if (i >= 0) playAt(listArr, i, fromQueue);
    });
    navigator.mediaSession.setActionHandler("previoustrack", () => {
      if (currentIndex > 0) playAt(activeList(), currentIndex - 1, fromQueue);
    });
  } catch(e) {}
}

function nextFileIndex(arr, from, wrap){
  const n = arr.length;
  for (let k = 1; k <= n; k++) {
    const i = wrap ? (from + k) % n : from + k;
    if (!wrap && i >= n) return -1;
    if (isFile(arr[i][1])) return i;
  }
  return -1;
}

a.addEventListener("play", () => {
  if (now.textContent) setNowPlaying(now.textContent.replace("（再生を押す）",""));
});

a.addEventListener("ended", () => {
  const arr = activeList();
  if (!arr.length || currentIndex < 0) return;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  if (mode === "loop-one") a.play();
  else if (mode === "sequence") {
    const i = nextFileIndex(arr, currentIndex, false);
    if (i >= 0) playAt(arr, i, fromQueue);
  } else if (mode === "loop-all") {
    const i = nextFileIndex(arr, currentIndex, true);
    if (i >= 0) playAt(arr, i, fromQueue);
  }
});

a.addEventListener("error", () => {
  const arr = activeList();
  if (!arr.length || currentIndex < 0) return;
  now.textContent = "読めない曲。次へ";
  setTimeout(() => {
    if (currentIndex + 1 < arr.length) playAt(arr, currentIndex + 1, fromQueue);
    else now.textContent = "再生終了";
  }, 800);
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && a.src && a.paused && !a.ended && currentIndex >= 0) {
    const t = activeList()[currentIndex];
    if (t && isFile(t[1])) a.play().catch(() => {});
  }
});

openRoom(rooms[currentRoomId] ? currentRoomId : "night");
</script>
