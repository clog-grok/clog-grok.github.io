<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --ice:#9ecbff; --cream:#e8eef7; --dim:#8b9bb4; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif; background:radial-gradient(1200px 600px at 50% -8%, #1b2838 0%, var(--bg) 55%); color:var(--cream); }

  h1 { font-size:20px; margin:0 0 4px; }

  .rooms { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .rooms button { border:1px solid var(--line); background:#11161d; color:var(--cream); border-radius:999px; padding:8px 12px; font-size:13px; }
  .rooms button.on { border-color:var(--ice); color:var(--ice); background:#162436; }
  .queuebtn { width:100%; margin:0 0 12px; border:1px dashed var(--ice); background:#0f1c28; color:var(--ice); border-radius:12px; padding:11px 14px; font-size:14px; text-align:left; }
  .queuebtn.on { background:#1a3348; }
  .player { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .now { font-size:14px; color:var(--ice); min-height:2.2em; font-weight:700; }
  audio { width:100%; margin-top:8px; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--dim); margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .controls label { display:flex; align-items:center; gap:4px; }
  .controls input { accent-color:var(--ice); margin:0; }
  .row { display:flex; gap:8px; align-items:stretch; margin:0 0 8px; }
  button.seat, a.seat { flex:1; text-align:left; background:#11161d; color:var(--cream); border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:14px; text-decoration:none; display:block; }
  button.seat.on, a.seat.on { border-color:var(--ice); color:var(--ice); background:#162436; }
  button.seat small, a.seat small { display:block; color:var(--dim); font-size:11px; margin-top:3px; }
  .icon { width:40px; border:1px solid var(--line); background:#11161d; color:var(--cream); border-radius:12px; font-size:16px; }
  .icon.more { border-color:var(--ice); color:var(--ice); background:#162436; }
  .icon.ghost { opacity:0; pointer-events:none; }
  .note { font-size:12px; color:var(--dim); line-height:1.65; margin-top:16px; }
  a { color:var(--ice); }
  .empty { color:var(--dim); font-size:13px; padding:8px 2px; }
  .mood { color:var(--ice); font-size:13px; margin:0 0 12px; min-height:1.4em; }
</style>

<main>
  <h1>アイス🍦 音の席</h1>
  <p class="sub">席の曲だけここで鳴る。連続再生も席の曲だけ。</p>
  <div class="rooms" id="rooms"></div>
  <button type="button" class="queuebtn" id="queueBtn">組 マイリスト</button>
  <p class="mood" id="mood"></p>
  <div class="player">
    <div class="now" id="now">席を選ぶ</div>
    <audio id="a" controls playsinline webkit-playsinline></audio>
    <div class="controls">
      <label><input type="radio" name="mode" value="normal"> 通常</label>
      <label><input type="radio" name="mode" value="sequence" checked> 連続再生</label>
      <label><input type="radio" name="mode" value="loop-all"> 全曲ループ</label>
      <label><input type="radio" name="mode" value="loop-one"> 1曲ループ</label>
    </div>
  </div>
  <div id="list"></div>
  <p class="note" id="credit"></p>
  <p class="note"><a href="ice-links.html" target="_blank" rel="noopener">YouTube / Spotify は外の棚へ</a></p>
</main>

  queue: { label: "組 マイリスト", mood: "席から＋した曲。ここで連続再生。", credit: "外のリンクは入れない。YouTube は外の棚。", art: "https://archive.org/services/img/loyalty-freak-music-lofi-ambient-songs" }
};
const a = document.getElementById("a");
const now = document.getElementById("now");
const list = document.getElementById("list");
const roomsEl = document.getElementById("rooms");
const credit = document.getElementById("credit");
const KEY = "ice-queue-v1";
const META = "ice-meta-v1";
let currentRoomId = "night";
let currentIndex = -1;
let fromQueue = false;
let playRoomId = "night";
let playingUrl = "";
let queue = [];
try {
  const meta = JSON.parse(localStorage.getItem(META) || "{}");
  if (meta.room && rooms[meta.room]) currentRoomId = meta.room;
  if (meta.mode) {
    const r = document.querySelector('input[name="mode"][value="'+meta.mode+'"]');
    if (r) r.checked = true;
  }
} catch(e) {}
Object.keys(rooms).forEach(id => {
  if (id === "queue") return;
  const b = document.createElement("button");
  b.textContent = rooms[id].label;
  b.dataset.id = id;
  b.onclick = () => openRoom(id);
  roomsEl.appendChild(b);
});
document.getElementById("queueBtn").onclick = () => openRoom("queue");
function saveQueue(){ try { localStorage.setItem(KEY, JSON.stringify(queue)); } catch(e) {} saveMeta(); }
function saveMeta(){
  const mode = (document.querySelector('input[name="mode"]:checked') || {}).value || "sequence";
  try { localStorage.setItem(META, JSON.stringify({ room: currentRoomId, mode })); } catch(e) {}
}
document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", saveMeta));
function activeList(){ return fromQueue ? queue : (rooms[currentRoomId].tracks || []); }
function isFile(url){
  if (!url) return false;
  const u = url.toLowerCase();
  if (/youtube\.com|youtu\.be|spotify\.com|music\.apple|freemusicarchive\.org\/music/.test(u)) return false;
  return /\.(mp3|ogg|wav|m4a|aac)(\?|#|$)/.test(u) || /archive\.org\/download\//.test(u);
}
try {
  const raw = JSON.parse(localStorage.getItem(KEY) || "[]");
  const outs = JSON.parse(localStorage.getItem("ice-out-v1") || "[]");
  raw.forEach(t => { if (isFile(t[1])) queue.push(t); else outs.push(t); });
  localStorage.setItem(KEY, JSON.stringify(queue));
  localStorage.setItem("ice-out-v1", JSON.stringify(outs));
} catch(e) { queue = []; }
function openRoom(id){
  currentRoomId = id;
  roomsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  document.getElementById("queueBtn").classList.toggle("on", id === "queue");
  document.getElementById("mood").textContent = rooms[id].mood || "";
  credit.innerHTML = rooms[id].credit;
  saveMeta();
  renderList();
}
function renderList(){
  list.innerHTML = "";
  if (currentRoomId === "queue") {
    if (!queue.length) {
      const p = document.createElement("p"); p.className = "empty"; p.textContent = "席の＋で入れる。ここで連続再生。"; list.appendChild(p); return;
    }
    queue.forEach((t, i) => list.appendChild(queueRow(t, i)));
    const saved = document.createElement("p"); saved.className = "empty"; saved.textContent = "この端末に " + queue.length + " 曲。閉じても残る。"; list.appendChild(saved);
    markPlaying();
    return;
  }
  rooms[currentRoomId].tracks.forEach((t, i) => list.appendChild(catalogRow(t, i)));
  markPlaying();
}
function queuePosAll(url){
  const out = [];
  queue.forEach((t, i) => { if (t[1] === url) out.push(i + 1); });
  return out;
}
function removeOne(url){
  for (let i = queue.length - 1; i >= 0; i--) {
    if (queue[i][1] === url) { queue.splice(i, 1); break; }
  }
  saveQueue();
  renderList();
}
function catalogRow(t, i){
  const wrap = document.createElement("div"); wrap.className = "row";
  const pos = queuePosAll(t[1]);
  const play = document.createElement("button"); play.className = "seat";
  let hint = pos.length ? "組 " + pos.join("・") : "この席で再生";
  if (playingUrl === t[1] && fromQueue) hint += " · 組で再生中";
  if (playingUrl === t[1] && !fromQueue && playRoomId === currentRoomId && currentIndex === i) hint = "再生中";
  play.innerHTML = t[0] + "<small>" + hint + "</small>";
  play.onclick = () => playAt(rooms[currentRoomId].tracks, i, false);
  wrap.append(play);
  if (pos.length) {
    const del = document.createElement("button");
    del.className = "icon";
    del.textContent = "×";
    del.onclick = () => removeOne(t[1]);
    wrap.append(del);
  }
  const add = document.createElement("button"); add.className = "icon";
  add.textContent = "＋";
  if (pos.length) add.classList.add("more");
  add.onclick = () => {
    queue.push([t[0], t[1]]);
    saveQueue();
    renderList();
  };
  wrap.append(add);
  return wrap;
}
function queueRow(t, i){
  const wrap = document.createElement("div"); wrap.className = "row";
  const play = document.createElement("button"); play.className = "seat";
  play.onclick = () => playAt(queue, i, true);
  const hint = (fromQueue && currentIndex === i) ? "再生中" : "ここで再生";
  play.innerHTML = (i+1) + ". " + t[0] + "<small>" + hint + "</small>";
  const up = document.createElement("button"); up.className = "icon"; up.textContent = "↑";
  up.onclick = () => { if (i===0) return; [queue[i-1], queue[i]] = [queue[i], queue[i-1]]; saveQueue(); renderList(); };
  const down = document.createElement("button"); down.className = "icon"; down.textContent = "↓";
  down.onclick = () => { if (i===queue.length-1) return; [queue[i+1], queue[i]] = [queue[i], queue[i+1]]; saveQueue(); renderList(); };
  const del = document.createElement("button"); del.className = "icon"; del.textContent = "×";
  del.onclick = () => { queue.splice(i,1); saveQueue(); renderList(); };
  wrap.append(play, up, down, del); return wrap;
}
function markPlaying(){
  const seats = list.querySelectorAll(".seat");
  if (currentRoomId === "queue") {
    seats.forEach((x, n) => x.classList.toggle("on", fromQueue && n === currentIndex));
  } else {
    seats.forEach((x, n) => x.classList.toggle("on", !fromQueue && playRoomId === currentRoomId && n === currentIndex));
  }
}
function playLabel(title, extra){
  const where = fromQueue ? ("組 " + (currentIndex + 1)) : ((rooms[playRoomId] || {}).label || "席");
  return where + " · " + title + (extra || "");
}
function playAt(arr, index, queued){
  if (index < 0 || index >= arr.length) return;
  fromQueue = queued;
  currentIndex = index;
  playRoomId = queued ? "queue" : currentRoomId;
  const [title, url] = arr[index];
  playingUrl = url;
  now.textContent = playLabel(title);
  document.title = title + " · アイス🍦";
  a.src = url;
  a.play().catch(() => { now.textContent = playLabel(title, "（再生を押す）"); });
  setNowPlaying(title);
  renderList();
}
function setNowPlaying(title){
  const room = rooms[fromQueue ? "queue" : playRoomId] || rooms.queue;
  const art = room.art || "https://archive.org/services/img/loyalty-freak-music-lofi-ambient-songs";
  if (!navigator.mediaSession) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: "アイス🍦", album: room.label || "音の席", artwork: [{ src: art, sizes: "512x512", type: "image/jpeg" }] });
    navigator.mediaSession.playbackState = "playing";
    navigator.mediaSession.setActionHandler("play", () => a.play());
    navigator.mediaSession.setActionHandler("pause", () => a.pause());
    navigator.mediaSession.setActionHandler("nexttrack", () => { const i = nextFileIndex(activeList(), currentIndex, true); if (i >= 0) playAt(activeList(), i, fromQueue); });
    navigator.mediaSession.setActionHandler("previoustrack", () => { if (currentIndex > 0) playAt(activeList(), currentIndex - 1, fromQueue); });
  } catch(e) {}
}
function nextFileIndex(arr, from, wrap){
  const n = arr.length;
  for (let k = 1; k <= n; k++) {
    const i = wrap ? (from + k) % n : from + k;
    if (!wrap && i >= n) return -1;
    if (isFile(arr[i][1])) return i;
  }
  return -1;
}
a.addEventListener("play", () => { const t = (activeList()[currentIndex] || [])[0]; if (t) setNowPlaying(t); });
a.addEventListener("ended", () => {
  const arr = activeList(); if (!arr.length || currentIndex < 0) return;
  const mode = document.querySelector('input[name="mode"]:checked').value;
  if (mode === "loop-one") a.play();
  else if (mode === "sequence") { const i = nextFileIndex(arr, currentIndex, false); if (i >= 0) playAt(arr, i, fromQueue); }
  else if (mode === "loop-all") { const i = nextFileIndex(arr, currentIndex, true); if (i >= 0) playAt(arr, i, fromQueue); }
});
a.addEventListener("error", () => {
  const arr = activeList(); if (!arr.length || currentIndex < 0) return;
  now.textContent = "読めない曲。次へ";
  setTimeout(() => { if (currentIndex + 1 < arr.length) playAt(arr, currentIndex + 1, fromQueue); else now.textContent = "再生終了"; }, 800);
});
openRoom(rooms[currentRoomId] ? currentRoomId : "night");
</script>
