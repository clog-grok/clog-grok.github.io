<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HTML表示</title>
<meta name="theme-color" content="#151c25">
<style>
:root{
  --bg:#0f1419;--bar:#151c25;--text:#f3f6fa;--muted:#8b97a8;
  --btn:#243041;--accent:#7dd3fc;--line:#2d3a4a;
  --bar-h:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
  overflow:hidden}
body{padding-top:env(safe-area-inset-top)}
.bar{
  position:fixed;z-index:5;left:0;right:0;top:env(safe-area-inset-top);
  height:var(--bar-h);display:flex;align-items:center;gap:4px;
  padding:0 8px;background:var(--bar);border-bottom:1px solid var(--line);
}
.bar b{
  font-size:.72rem;margin-right:auto;min-width:0;padding:0 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c5ced8;font-weight:600;
}
button,.filebtn{
  flex:none;white-space:nowrap;
  min-height:36px;padding:0 8px;border:0;border-radius:10px;
  background:var(--btn);color:var(--text);font:inherit;font-weight:700;font-size:.75rem;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  display:inline-flex;align-items:center;justify-content:center;gap:3px;
}
button.primary,.filebtn.primary{background:var(--accent);color:#082f49}
button.ghost{background:transparent;color:var(--muted)}
button:active,.filebtn:active{filter:brightness(1.12)}
.filebtn input{display:none}
.icon{width:14px;height:14px;display:block;flex:none}
#clearBtn{min-width:36px;padding:0 8px;background:transparent;color:#6b7787;font-weight:600}
#fsBtn,#exitFs{min-width:72px}
.stage{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + var(--bar-h));background:#fff}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--bg);color:var(--text);
}
.empty-hit{
  width:min(86vw,340px);aspect-ratio:1.15;max-height:46vh;
  border:1.5px dashed #3a4656;border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  color:var(--muted);background:transparent;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;
}
.empty-hit:active{border-color:#7dd3fc;color:#d7eef9;background:rgba(125,211,252,.06)}
.empty-hit svg{width:28px;height:28px;opacity:.7}
.empty-hit span{font-size:.92rem;font-weight:700;letter-spacing:.04em;color:#d5dde6}
.empty-hit small{font-size:.72rem;font-weight:500;opacity:.7}
.sheet{
  position:fixed;z-index:6;left:0;right:0;bottom:0;
  height:min(52vh,420px);background:#1a222c;border-top:1px solid var(--line);
  transform:translateY(110%);transition:transform .2s ease;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.on{transform:none}
.sheet h2{margin:0;padding:10px 12px;font-size:.75rem;color:var(--muted);font-weight:600}
textarea{
  flex:1;width:100%;border:0;resize:none;padding:12px;
  background:transparent;color:var(--text);
  font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
}
.toast{
  position:fixed;z-index:8;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(80px);opacity:0;
  background:#111827;color:#fff;padding:8px 14px;border-radius:999px;
  font-size:.78rem;font-weight:700;pointer-events:none;transition:.2s ease;
}
.toast.on{transform:translateX(-50%);opacity:1}
#exitFs{
  display:none;position:fixed;z-index:9;
  top:calc(env(safe-area-inset-top) + 8px);
  right:8px;
  height:36px;min-height:36px;padding:0 8px;border-radius:10px;
  background:var(--btn);color:var(--text);border:0;font-weight:700;font-size:.75rem;
}
body.fs{padding-top:0}
body.fs .bar,body.fs .sheet{visibility:hidden;pointer-events:none}
body.fs .stage{top:0}
body.fs #exitFs{display:inline-flex}
</style>
</head>
<body>
<header class="bar">
  <button type="button" id="clearBtn" aria-label="消す">消す</button>
  <b id="name">HTML表示</b>
  <button type="button" class="primary" id="paste">貼る</button>
  <label class="filebtn"><input id="file" type="file" accept=".html,.htm,.txt,text/html,text/plain"><span>ファイル</span></label>
  <button type="button" class="ghost" id="srcBtn">ソース</button>
  <button type="button" id="fsBtn" aria-label="全画面">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    全画面
  </button>
</header>
<button type="button" id="exitFs">戻る</button>
<div class="stage" id="stage">
  <iframe id="frame" title="view" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
  <div class="empty" id="empty">
    <button type="button" class="empty-hit" id="paste2" aria-label="貼る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="7" width="12" height="14" rx="2"/>
        <path d="M9 7V5.8A1.8 1.8 0 0 1 10.8 4h2.4A1.8 1.8 0 0 1 15 5.8V7"/>
      </svg>
      <span>ここに貼る</span>
      <small>ファイルは上のボタン</small>
    </button>
  </div>
</div>
<section class="sheet" id="sheet">
  <h2>ソース</h2>
  <textarea id="src" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="ここに貼っても表示されます"></textarea>
</section>
<div class="toast" id="toast"></div>
<script>
(function(){
  var src=document.getElementById('src');
  var stage=document.getElementById('stage');
  var frame=document.getElementById('frame');
  var empty=document.getElementById('empty');
  var sheet=document.getElementById('sheet');
  var nameEl=document.getElementById('name');
  var toastEl=document.getElementById('toast');
  var toastTimer=null;
  var fileName='HTML表示';
  var lastUrl='';
  var hasContent=false;
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){ toastEl.classList.remove('on'); }, 1800);
  }
  function nativeFsEl(){
    return document.fullscreenElement||document.webkitFullscreenElement||null;
  }
  function reqFs(el){
    var fn=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen;
    if(!fn) return;
    try{
      var p=fn.call(el);
      if(p&&p.catch) p.catch(function(){});
    }catch(e){}
  }
  function exitNativeFs(){
    var fn=document.exitFullscreen||document.webkitExitFullscreen;
    if(fn&&nativeFsEl()){
      try{ fn.call(document); }catch(e){}
    }
  }
  function enterFS(){
    if(!hasContent){
      toast('先に貼るかファイルを開いてください');
      return;
    }
    sheet.classList.remove('on');
    document.body.classList.add('fs');
    reqFs(document.documentElement);
  }
  function exitFS(){
    document.body.classList.remove('fs');
    exitNativeFs();
  }
  document.addEventListener('fullscreenchange', function(){
    if(!nativeFsEl()) document.body.classList.remove('fs');
  });
  document.addEventListener('webkitfullscreenchange', function(){
    if(!nativeFsEl()) document.body.classList.remove('fs');
  });
  function revokeLater(url){
    if(!url) return;
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 2500);
  }
  function newFrame(){
    var f=document.createElement('iframe');
    f.id='frame';
    f.title='view';
    f.setAttribute('sandbox','allow-scripts allow-forms allow-modals allow-popups');
    stage.insertBefore(f, empty);
    if(frame&&frame.parentNode) frame.parentNode.removeChild(frame);
    frame=f;
    return f;
  }
  function loadHtml(t){
    var f=newFrame();
    var prev=lastUrl;
    lastUrl='';
    try{
      var url=URL.createObjectURL(new Blob([t],{type:'text/html;charset=utf-8'}));
      lastUrl=url;
      f.src=url;
    }catch(e){
      f.srcdoc=t;
    }
    revokeLater(prev);
  }
  function clearAll(){
    src.value='';
    fileName='HTML表示';
    nameEl.textContent=fileName;
    hasContent=false;
    newFrame();
    revokeLater(lastUrl);
    lastUrl='';
    empty.style.display='flex';
    sheet.classList.remove('on');
    exitFS();
    toast('空に戻しました');
  }
  function show(text, label){
    var t=text==null?src.value:text;
    if(t!=null) src.value=t;
    t=src.value;
    if(!t || !t.trim()){
      clearAll();
      return;
    }
    empty.style.display='none';
    hasContent=true;
    fileName=label||fileName||'貼り付け';
    nameEl.textContent=fileName;
    sheet.classList.remove('on');
    loadHtml(t);
  }
  function readFile(f){
    if(!f) return;
    var ok=/\.(html?|txt)$/i.test(f.name) || /html|text/.test(f.type||'');
    if(!ok){
      toast('HTML / TXT を選んでください');
      return;
    }
    var reader=new FileReader();
    reader.onload=function(){
      show(String(reader.result||''), f.name);
      toast(f.name+' を開きました');
    };
    reader.onerror=function(){ toast('ファイルを読めませんでした'); };
    reader.readAsText(f);
  }
  function fromClipboard(){
    if(navigator.clipboard && navigator.clipboard.readText){
      navigator.clipboard.readText().then(function(t){
        if(!t || !t.trim()){ toast('クリップボードが空です'); return; }
        show(t, '貼り付け');
        toast('貼り付けました');
      }).catch(function(){
        sheet.classList.add('on');
        src.focus();
        toast('長押しで貼り付けてください');
      });
    }else{
      sheet.classList.add('on');
      src.focus();
      toast('長押しで貼り付けてください');
    }
  }
  function clipText(e){
    var d=e.clipboardData;
    if(!d) return '';
    return d.getData('text/plain') || d.getData('text/html') || '';
  }
  document.getElementById('paste').onclick=fromClipboard;
  document.getElementById('paste2').onclick=fromClipboard;
  document.getElementById('clearBtn').onclick=clearAll;
  document.getElementById('fsBtn').onclick=enterFS;
  document.getElementById('exitFs').onclick=exitFS;
  document.getElementById('srcBtn').onclick=function(){
    if(document.body.classList.contains('fs')) return;
    sheet.classList.toggle('on');
    if(sheet.classList.contains('on')) setTimeout(function(){ src.focus(); }, 50);
  };
  document.getElementById('file').addEventListener('change', function(e){
    readFile(e.target.files && e.target.files[0]);
    e.target.value='';
  });
  document.addEventListener('paste', function(e){
    if(e.target===src){
      setTimeout(function(){ show(src.value, '貼り付け'); toast('貼り付けました'); }, 0);
      return;
    }
    var t=clipText(e);
    if(!t || !t.trim()) return;
    e.preventDefault();
    show(t, '貼り付け');
    toast('貼り付けました');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') exitFS();
  });
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){
    e.preventDefault();
    var f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) readFile(f);
  });
  empty.style.display='flex';
})();
</script>
</body>
</html>
