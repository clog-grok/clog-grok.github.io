<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading…</title></head><body>
<script>
(async () => {
  const n = 6;
  const parts = [];
  for (let i = 1; i <= n; i++) {
    const r = await fetch("./fx-leverage.p" + i + ".b64", { cache: "no-store" });
    if (!r.ok) throw new Error("part " + i);
    parts.push(await r.text());
  }
  const html = decodeURIComponent(escape(atob(parts.join(""))));
  document.open(); document.write(html); document.close();
})().catch(e => { document.body.textContent = "読み込み失敗: " + e; });
</script>
</body></html>
